// ---------- Boss cơ sở ----------
class Boss extends Enemy {
    constructor(type, cx, by) {
        const d = ENEMY_DEFS[type];
        super(type, cx - d.w / 2, by - d.h);
        this.maxHp = this.hp = d.hp; this.st = 'sleep'; this.stT = 0; this.phase = 1; this.t = 0; this.lastPat = ''; this.deathBurstT = 0; this.flashT = 0; this.hitCd = 0;
        this.facing = this.dir = -1; this.isBoss = true;
    }
    get harmless() { return this.st === 'sleep' || this.st === 'intro' || this.st === 'roar' || this.st === 'dying'; }
    vulnerable() { return !this.harmless; }
    go(st) { this.st = st; this.stT = 0; }
    pick(list) { const l = list.length > 1 ? list.filter(x => x !== this.lastPat) : list; const v = l[Math.floor(game.rngPlay.next() * l.length)]; this.lastPat = v; return v; }
    wake(level) {
        this.go('intro'); game.boss = this;
        sndPlay('bossRoar'); fxShake(2, 0.6); fxScreenFlash('#ffffff', 0.18, 0.4); game.banner = { text: this.bossName || this.def.name, t: 0 };
    }
    enterPhase2(level) {
        const pl = game.player; if (pl && !pl.dead && this.def.final && pl.hp < ITEM.startHp + 2) { pl.hp++; level.spawnBurst(pl.cx, pl.cy, 10, '#ff7a9a', 90); game.pickupMsg = { t: 0, text: 'Ánh tinh thể hồi 1 máu' }; }
        this.phase = 2; this.go('roar'); this.vx = 0; sndPlay('bossRoar'); fxShake(3, 0.8); fxScreenFlash('#ff6040', 0.25, 0.5);
        level.spawnBurst(this.cx, this.cy, 24, this.def.col, 170);
    }
    // Nhận đòn: chỉ vài nguồn có tác dụng; bom bị chặn ở 4 (không giết ngay); có thời gian hồi
    hurt(src) {
        if (!this.alive || this.dead || this.st === 'dying') return false;
        const k = src.kind;
        if (k !== DMG.WHIP && k !== DMG.STOMP && k !== DMG.EXPLOSION && k !== DMG.IMPACT && k !== DMG.ARROW) return false;
        const level = game.level;
        if (!this.vulnerable()) { sndPlay('clang', { x: this.cx, p: 0.8 }); level.spawnBurst(this.cx, this.cy, 4, '#dfe8ff', 90); return false; }
        if (this.hitCd > 0) return false;
        const dmg = k === DMG.EXPLOSION ? 4 : k === DMG.STOMP ? 2 : 1;
        this.hp -= dmg; this.flashT = 0.12; this.hitCd = k === DMG.EXPLOSION ? 0.8 : 0.25; this.lastHurt = src;
        level.spawnBurst(this.cx, this.cy, 8, this.def.col, 110); sndPlay('hitHeavy', { x: this.cx });
        if (this.hp <= 0) { this.hp = 0; this.die(src); }
        else if (this.phase === 1 && this.hp <= this.maxHp * this.def.phase2) this.enterPhase2(level);
        return true;
    }
    die(src) { this.go('dying'); this.vx = 0; this.deathBurstT = 0; sndPlay('bossDie'); fxShake(3, 1); fxScreenFlash('#ffffff', 0.3, 0.6); }
    update(level, dt) {
        this.timers(dt); this.t += dt; this.stT += dt; if (this.flashT > 0) this.flashT -= dt; if (this.hitCd > 0) this.hitCd -= dt;
        const p = game.player;
        if (this.st === 'sleep') {
            this.sleepStep(level, dt);
            if (!p.dead && Math.abs(p.cx - this.cx) <= this.def.wakeDist && p.onGround) this.wake(level);
            return;
        }
        if (this.st === 'intro') { this.sleepStep(level, dt); if (this.stT >= 1.6) this.go(this.firstState || 'idle'); return; }
        if (this.st === 'dying') {
            this.sleepStep(level, dt);
            if ((this.deathBurstT -= dt) <= 0) {
                this.deathBurstT = 0.12; const bx = this.x + game.rngFx.next() * this.w, by = this.y + game.rngFx.next() * this.h;
                level.spawnBurst(bx, by, 8, this.def.col, 140); if (game.rngFx.next() < 0.5) sndPlay('boom', { x: bx, p: 1.4, vol: 0.5 });
            }
            if (this.stT >= 2.2) { this.alive = false; bossDefeated(level, this); }
            return;
        }
        if (this.st === 'roar') { this.sleepStep(level, dt); if (this.stT >= 1.3) this.go(this.firstState || 'idle'); return; }
        this.think(level, dt, p);
    }
    sleepStep(level, dt) { }
    think(level, dt, p) { }
    light() {
        if (this.st === 'dying') return { r: 50, col: '#ffe0a0', a: 0.5 + 0.2 * Math.sin(this.t * 30) };
        if (this.st === 'roar') return { r: 50, col: '#ff6040', a: 0.5 };
        if (this.st === 'intro') return { r: 30 + 30 * clamp(this.stT / 1.6, 0, 1), col: this.def.col, a: 0.4 };
        return null;
    }
}

// Boss ngã: mở cửa, xoá hazard, thưởng vàng + hồi máu +1
function bossDefeated(level, boss) {
    game.bossDone = true; game.boss = null;
    for (const e of game.entities) if (e !== boss && e.alive && (e instanceof BossHazard || (e instanceof Enemy && !(e instanceof Boss)))) { e.alive = false; level.spawnBurst(e.cx, e.cy, 10, e.col, 120); }
    const R = game.rngFx;
    for (let i = 0; i < 8; i++) { const g = new Gold(boss.cx - 3, boss.cy - 6, i < 2 ? 1500 : 500); g.vx = (R.next() - 0.5) * 140; g.vy = -120 - R.next() * 80; entAdd(g); }
    const p = game.player; if (p && !p.dead) p.hp = Math.max(p.hp, ITEM.startHp) + 1;
    fxScreenFlash('#ffffff', 0.35, 0.8); sndPlay('victory'); fxShake(2, 0.5);
    level.spawnBurst(boss.cx, boss.cy, 30, '#ffe9a8', 160);
    game.banner = { text: 'ĐÃ HẠ ' + boss.def.name, t: 0 };
    if (game.stats) game.stats.kills++;
}

// Thanh máu boss + biểu ngữ + chớp màn hình (gọi trong lớp HUD)
function drawBossBar() {
    const f = game.flash;
    if (f && f.t > 0) { ctx.globalAlpha = f.a * (f.t / f.max); ctx.fillStyle = f.col; ctx.fillRect(0, 0, VIEW_W, VIEW_H); ctx.globalAlpha = 1; f.t -= 1 / 60; }
    const bn = game.banner;
    if (bn) { bn.t += 1 / 60; if (bn.t > 2.6) game.banner = null; else { ctx.globalAlpha = Math.min(1, (2.6 - bn.t) * 2, bn.t * 4); drawText(bn.text, VIEW_W / 2, 52, '#ffe9a8', 'center'); ctx.globalAlpha = 1; } }
    const b = game.boss; if (!b || !b.alive || b.st === 'sleep') return;
    if (b.noBar) { drawText(b.bossName || b.def.name, VIEW_W / 2, VIEW_H - 25, '#ffe9a8', 'center'); return; }
    const w = 220, x = Math.round((VIEW_W - w) / 2), y = VIEW_H - 14, k = clamp(b.hp / b.maxHp, 0, 1);
    drawText(b.bossName || b.def.name, VIEW_W / 2, y - 11, '#ffe9a8', 'center');
    ctx.fillStyle = '#000'; ctx.fillRect(x - 2, y - 2, w + 4, 9); ctx.fillStyle = '#3a1822'; ctx.fillRect(x, y, w, 5);
    ctx.fillStyle = b.phase === 2 ? '#ff6040' : '#e23a5c'; ctx.fillRect(x, y, Math.round(w * k), 5); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x, y, Math.round(w * k), 1);
    ctx.fillStyle = '#ffe9a8'; ctx.fillRect(x + Math.round(w * b.def.phase2), y - 1, 1, 7);
}

// ---------- Boss 1: VỆ BINH ĐÁ ----------
// idle → (ĐẬP: slam_wind → slam_hit → slam_rec) | (HÚC: charge_wind → charge → stun) | (pha 2: MƯA ĐÁ: rain_wind → rain_rec).
const BOSS_WARDEN = {
    idle: [1.0, 0.65], slamW: [0.85, 0.7], slamRec: [0.9, 0.7], waveSpeed: [90, 115], echo: 0.45,
    chargeW: [0.9, 0.75], chargeSpeed: [150, 175], chargeMax: 2.4, stun: [1.6, 1.3],
    rainW: 1.0, rainWarn: 0.8, rainRec: 1.0, rocks: 5
};
class Warden extends Boss {
    constructor(cx, by) { super('warden', cx, by); this.aim = -1; this.echoT = -1; this.stepT = 0; this.ignorePlat = true; }
    ph(a) { return Array.isArray(a) ? a[this.phase - 1] : a; }
    sleepStep(level, dt) { this.vx = 0; this.vy = Math.min(this.vy + PHYS.gravity * dt, PHYS.fallMax); physMove(level, this, dt); }
    face(p) { if (!p.dead) this.facing = this.dir = p.cx >= this.cx ? 1 : -1; }
    spawnWaves(level) { const sp = this.ph(BOSS_WARDEN.waveSpeed), fy = this.y + this.h; for (const d of [-1, 1]) entAdd(new Wave(this.cx + d * (this.w / 2 + 2), fy, d, sp, this)); }
    rock(level, x, warn) { const cx = clamp(x, TILE * 2.5, level.pw - TILE * 2.5); entAdd(new FallRock(cx, TILE * 2 + 2, roomFloorY(level, cx, this.y), warn, this)); }
    light() {
        const L = super.light(); if (L) return L;
        const B = BOSS_WARDEN;
        if (this.st === 'slam_wind') { const k = clamp(this.stT / this.ph(B.slamW), 0, 1); return { r: 16 + 26 * k, col: '#ff4a2a', a: 0.15 + 0.55 * k }; }
        if (this.st === 'charge_wind') { const k = clamp(this.stT / this.ph(B.chargeW), 0, 1); return { r: 14 + 22 * k, col: '#ff4a2a', a: 0.15 + 0.55 * k }; }
        if (this.st === 'rain_wind') { const k = clamp(this.stT / B.rainW, 0, 1); return { r: 20 + 36 * k, col: '#ff6040', a: 0.2 + 0.5 * k }; }
        if (this.st === 'charge') return { r: 30, col: '#ffb070', a: 0.4 };
        return { r: 14, col: '#ff7a3a', a: 0.2 };
    }
    think(level, dt, p) {
        const B = BOSS_WARDEN;
        this.vx = 0;
        if (this.echoT >= 0 && (this.echoT -= dt) < 0) { this.echoT = -1; this.spawnWaves(level); sndPlay('bossSlam', { x: this.cx, vol: 0.5, p: 1.3 }); fxShake(1.5, 0.15); }
        switch (this.st) {
            case 'idle':
                this.face(p);
                if (this.stT >= this.ph(B.idle)) {
                    const list = this.phase === 2 ? ['slam', 'charge', 'rain'] : ['slam', 'charge'];
                    const far = Math.abs(p.cx - this.cx) > 150;
                    let pat = far && game.rngPlay.next() < 0.6 ? 'charge' : this.pick(list);
                    this.lastPat = pat;
                    if (pat === 'slam') { this.go('slam_wind'); sndPlay('bossWind', { x: this.cx }); }
                    else if (pat === 'charge') { this.face(p); this.aim = this.facing; this.go('charge_wind'); sndPlay('bossWind', { x: this.cx }); }
                    else { this.go('rain_wind'); sndPlay('bossRoar', { x: this.cx, vol: 0.7 }); fxShake(1, 0.9); }
                }
                break;
            case 'slam_wind': this.face(p); if (this.stT >= this.ph(B.slamW)) {
                this.go('slam_hit'); this.spawnWaves(level); if (this.phase === 2) this.echoT = B.echo;
                sndPlay('bossSlam', { x: this.cx }); fxShake(3.5, 0.3); fxScreenFlash('#ffffff', 0.12, 0.15);
                level.spawnDust(this.cx - 10, this.y + this.h, 6, 120, 20); level.spawnDust(this.cx + 10, this.y + this.h, 6, 120, 20);
            } break;
            case 'slam_hit': if (this.stT >= 0.25) this.go('slam_rec'); break;
            case 'slam_rec': if (this.stT >= this.ph(B.slamRec)) this.go('idle'); break;
            case 'charge_wind':
                if (Math.floor(this.stT * 10) !== Math.floor((this.stT - dt) * 10)) level.spawnDust(this.cx - this.aim * 8, this.y + this.h, 2, 60, 12);
                if (this.stT >= this.ph(B.chargeW)) { this.go('charge'); this.stepT = 0; sndPlay('bossRush', { x: this.cx }); }
                break;
            case 'charge':
                this.vx = this.aim * this.ph(B.chargeSpeed);
                if ((this.stepT += dt) >= 0.22) { this.stepT = 0; sndPlay('bossStep', { x: this.cx }); fxShake(0.6, 0.08); level.spawnDust(this.cx - this.aim * 10, this.y + this.h, 3, 50, 10); }
                break;
            case 'stun': if (this.stT >= this.ph(B.stun)) this.go('idle'); break;
            case 'rain_wind': if (this.stT >= B.rainW) {
                this.go('rain_rec'); sndPlay('bossSlam', { x: this.cx, vol: 0.6, p: 1.2 }); fxShake(2, 0.3);
                const R = game.rngPlay, xs = [p.cx - 60, p.cx, p.cx + 60, p.cx + (R.next() - 0.5) * 160, this.cx + (R.next() - 0.5) * 60].slice(0, B.rocks);
                xs.forEach((x, i) => this.rock(level, x, B.rainWarn + i * 0.08));
            } break;
            case 'rain_rec': if (this.stT >= B.rainRec) this.go('idle'); break;
        }
        this.vy = Math.min(this.vy + PHYS.gravity * dt, PHYS.fallMax);
        physMove(level, this, dt);
        if (this.st === 'charge' && ((this.aim > 0 && this.hitR) || (this.aim < 0 && this.hitL) || this.stT >= B.chargeMax)) {      // đâm vào tường: choáng
            this.go('stun'); this.vx = 0; sndPlay('bossSlam', { x: this.cx }); fxShake(4, 0.35); fxScreenFlash('#ffffff', 0.12, 0.15);
            level.spawnBurst(this.cx + this.aim * 14, this.cy - 4, 14, '#b8bdd4', 130);
            if (this.phase === 2) for (const x of [this.cx - this.aim * 40, this.cx - this.aim * 90]) this.rock(level, x, 0.7);
        }
    }
    draw(ctx, alpha) {
        if (ITEM_HP) return drawWardenHp(this, ctx, alpha);
        const x = Math.round(this.drawX(alpha)), y = Math.round(this.drawY(alpha)), W = this.w, H = this.h, d = this.def;
        const flash = this.flashT > 0, st = this.st, f = this.facing;
        const k = st === 'slam_wind' ? clamp(this.stT / this.ph(BOSS_WARDEN.slamW), 0, 1) : st === 'charge_wind' ? clamp(this.stT / this.ph(BOSS_WARDEN.chargeW), 0, 1) : st === 'rain_wind' ? clamp(this.stT / BOSS_WARDEN.rainW, 0, 1) : 0;
        const crouch = st === 'charge_wind' ? Math.round(k * 7) : st === 'stun' ? 8 : st === 'charge' ? 4 : 0;
        const lean = st === 'charge' ? this.aim * 5 : st === 'charge_wind' ? this.aim * -Math.round(k * 3) : 0;
        const shake = (st === 'charge_wind' || st === 'rain_wind') && k > 0.5 ? (Math.floor(this.t * 40) % 2 ? 1 : -1) : st === 'roar' ? (Math.floor(this.t * 40) % 2 ? 2 : -2) : 0;
        const armsUp = st === 'slam_wind' || st === 'rain_wind' ? k : st === 'roar' || st === 'intro' ? 1 : 0, armsSlam = st === 'slam_hit';
        const dead = st === 'dying', sleep = st === 'sleep';
        const body = flash ? '#ffffff' : sleep ? '#5a5e78' : d.col, dark = flash ? '#ffffff' : '#4a4e66', light = flash ? '#ffffff' : '#b8bdd4', out = '#1c1e2e';
        const ox = x + lean + shake, top = y + crouch;
        if (st === 'charge') { ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(f > 0 ? ox - 14 : ox + W, y + 10, 14, H - 20); }
        ctx.fillStyle = out; ctx.fillRect(ox + 1, y + H - 11, 10, 11); ctx.fillRect(ox + W - 11, y + H - 11, 10, 11);
        ctx.fillStyle = dark; ctx.fillRect(ox + 2, y + H - 10, 8, 10); ctx.fillRect(ox + W - 10, y + H - 10, 8, 10);
        ctx.fillStyle = out; ctx.fillRect(ox - 1, top + 9, W + 2, H - 20 - crouch + 2);
        ctx.fillStyle = body; ctx.fillRect(ox, top + 10, W, H - 21 - crouch + 1);

// ---------- Phòng đấu ----------
// 26 × 16 ô: trần; bên trái 1 khối đá bậc + 1 bục thấp (không thang), bên phải 1 bục cao có thang (né sóng đất / xuống đạp đầu boss); sàn phẳng. P = cửa vào (trái), E = cửa ra (phải, bị phong ấn), 1 = Vệ binh, 2 = Bà chúa.
const BOSS_LEVELS = { 11: 'warden', 23: 'hunter', 35: 'mage', 47: 'queen', 54: 'titan' };   // cuối vùng 2 = Vệ binh đá · vùng 4 = Thợ săn tuyết · vùng 6 = Kẻ dẫn hồn (12a_boss2) · vùng 8 = Bà chúa
const BOSS_TIER = { 11: 1, 23: 1, 35: 1, 47: 1 }, BOSS_HP_MUL = [1, 1, 1.3, 1.6];       // móc chỉnh máu theo bậc (hiện mọi boss bậc 1; muốn Vệ binh bậc cao thì đặt BOSS_TIER[idx] = 2/3 → thêm II/III)
function bossTierApply(b, levelIdx) {
    const t = BOSS_TIER[levelIdx] || 1; b.tier = t; b.maxHp = b.hp = Math.round(b.def.hp * BOSS_HP_MUL[t]);
    b.bossName = t > 1 ? b.def.name + ' ' + 'I'.repeat(t) : b.def.name; return b;
}
function genBossArena(levelIdx) {
    if (BOSS_LEVELS[levelIdx] === 'titan') return genFinaleArena(levelIdx);
    const kind = BOSS_LEVELS[levelIdx], zone = zoneOf(levelIdx), W = 26, H = 16;
    const g = []; for (let r = 0; r < H; r++) g.push(new Array(W).fill('.'));
    for (let c = 0; c < W; c++) { g[0][c] = '#'; g[H - 1][c] = '#'; }
    for (let r = 0; r < H; r++) { g[r][0] = '#'; g[r][W - 1] = '#'; }
    g[14][3] = '#'; for (let c = 5; c <= 7; c++) g[13][c] = '=';       // bên trái (Dan, lần 35, mọi phòng boss): bậc 1 = khối đá cao 1 ô SÁT cửa vào (cột 3), bục 2 = bục một chiều cao 2 ô, dài 3 ô, cách bậc 1 một ô (cột 5–7); KHÔNG thang. Nhảy tối đa ~22 px
    for (let c = 18; c <= 22; c++) g[10][c] = '='; for (let r = 10; r <= 14; r++) g[r][17] = 'L';       // bên phải: bục cao + thang như cũ
    g[14][2] = 'P'; g[14][W - 3] = 'E'; g[14][kind === 'warden' ? 14 : kind === 'queen' ? 13 : 14] = { warden: '1', queen: '2', hunter: '3', mage: '4' }[kind];
    return {
        def: { id: 'L' + (levelIdx + 1), name: { warden: 'Phòng Vệ binh đá', hunter: 'Sân tuyết của Thợ săn', mage: 'Điện hồn của Kẻ dẫn hồn', queen: 'Ngai Bà chúa pha lê' }[kind], theme: kind === 'queen' ? 'snow' : zone.theme, dark: 0, boss: kind, map: g.map(r => r.join('')) },
        meta: { boss: kind, start: { c: 3, r: 15 }, exit: { c: W - 2, r: 15 }, counts: { snake: 0, bat: 0, foe: 0, rock: 0, pot: 0, crate: 0, gold: 0, trap: 0, princess: 0, shop: 0 }, shop: null, rooms: null, path: null }
    };
}

// 12a_boss2 — BOSS 3 & 4 (lần 33; Dan: "thiết kế thêm boss, học của Hollow Knight"). Nhân vật + số liệu + hình vẽ đều TỰ THIẾT KẾ, chỉ học NHỊP ĐÁNH của lối boss Hollow Knight:
//   · mỗi đòn có điềm báo rõ (tư thế + ánh sáng + vạch báo), sau đòn là khoảng hở để đánh trả;
//   · mẫu đòn xoay vòng, không lặp một đòn hai lần liền (Boss.pick);
//   · pha 2 (máu ≤ 50%) đòn nhanh hơn / nhiều hơn / có đòn nối.
// Boss 3 = THỢ SĂN TUYẾT (vùng 4, level 24): đấu tay đôi nhanh trên mặt đất — LAO CHÉM (có đòn nối quay lại ở pha 2), NÉM GIÁO BĂNG (giáo bay đi rồi QUAY VỀ như boomerang), NHẢY BỔ (đáp xuống sinh sóng băng hai phía).
// Boss 4 = KẺ DẪN HỒN (vùng 6, level 36): bay lơ lửng, luôn DỊCH CHUYỂN trước khi ra đòn — CẦU HỒN đuổi theo, CỘT GAI trồi từ sàn (vòng báo trên sàn), pha 2: ĐẬP TỪ TRÊN XUỐNG (cột sáng báo, đáp xuống nằm sơ hở).
// Phòng đấu dùng chung genBossArena (12_boss): ký tự '3' = Thợ săn, '4' = Kẻ dẫn hồn. Số liệu là ước lượng — chỉnh sau khi chơi thử (BOSS_HUNTER / BOSS_MAGE).

// ---------- Hazard mới ----------
// Giáo băng: bay ngang tới tầm `range` (hoặc chạm tường) rồi QUAY VỀ chủ, mất khi về tới chủ. Gây hại cả lúc đi lẫn lúc về.
class IceSpear extends BossHazard {
    constructor(cx, cy, dir, speed, range, owner) { super(cx - 8, cy - 2, 16, 5, 'spear', owner); this.dir = dir; this.spd = speed; this.range = range; this.x0 = cx; this.back = false; this.life = 4; }
    light() { return { r: 16, col: '#bfe9ff', a: 0.5 }; }

    }
    draw(ctx, alpha) {
        if (ITEM_HP) return drawIceSpearHp(this, ctx, alpha);

// Cầu hồn: bay chậm, ĐUỔI theo người chơi (quay chậm nên né được), mất khi đụng tường hoặc hết life.
class SoulOrb extends BossHazard {
    constructor(cx, cy, ang, speed, turn, owner) { super(cx - 5, cy - 5, 10, 10, 'orb', owner); this.a = ang; this.sp = speed; this.turn = turn; this.life = 4.6; this.homeT = 2.4; }
    light() { return { r: 18, col: '#c88cff', a: 0.55 }; }
    step(level, dt) {
        const p = game.player;
        if (this.t < this.homeT && p && !p.dead) {
            let d = Math.atan2(p.cy - this.cy, p.cx - this.cx) - this.a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
            this.a += clamp(d, -this.turn * dt, this.turn * dt);
        }
        this.x += Math.cos(this.a) * this.sp * dt; this.y += Math.sin(this.a) * this.sp * dt;
        if ((this.life -= dt) <= 0 || level.solidAt(this.cx, this.cy)) { this.alive = false; level.spawnBurst(this.cx, this.cy, 7, '#c88cff', 80); sndPlay('shardBreak', { x: this.cx, p: 0.7, vol: 0.7 }); }
        if (Math.floor(this.t * 20) !== Math.floor((this.t - dt) * 20)) level.fx.push({ x: this.cx, y: this.cy, vx: -Math.cos(this.a) * 14, vy: -Math.sin(this.a) * 14, life: 0.3, max: 0.35, size: 3, col: '#a070e0' });
    }
    draw(ctx, alpha) {
        if (ITEM_HP) return drawSoulOrbHp(this, ctx, alpha);
        const x = Math.round(this.drawX(alpha) + 5), y = Math.round(this.drawY(alpha) + 5), pul = 1 + Math.round(Math.sin(this.t * 14));
        ctx.fillStyle = '#2a1648'; ctx.fillRect(x - 5, y - 4, 10, 8); ctx.fillRect(x - 4, y - 5, 8, 10);
        ctx.fillStyle = '#a070e0'; ctx.fillRect(x - 4, y - 3, 8, 6); ctx.fillRect(x - 3, y - 4, 6, 8);
        ctx.fillStyle = '#e8d0ff'; ctx.fillRect(x - 2, y - 2, 4, 4); ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 1 + (pul > 1 ? 0 : 1), y - 1, 2, 2);
    }
}

// Cột gai: 'warn' (CHƯA gây hại: vòng tím + tia nhấp nháy trên sàn) warnT giây → 'up' (trồi nhanh, gây hại) → thụt xuống.
class SoulPillar extends BossHazard {
    constructor(cx, floorY, warnT, owner) { super(cx - 7, floorY - 2, 14, 2, 'pillar', owner); this.floorY = floorY; this.cxx = cx; this.warnT = warnT; this.st = 'warn'; this.active = false; this.maxH = 46; this.upT = 0; }
    light() { return this.st === 'warn' ? { r: 10 + 12 * clamp(this.t / this.warnT, 0, 1), col: '#b070ff', a: 0.25 } : { r: 22, col: '#d9a8ff', a: 0.5 }; }
    step(level, dt) {
        if (this.st === 'warn') {
            if (Math.floor(this.t * 14) !== Math.floor((this.t - dt) * 14)) level.fx.push({ x: this.cxx + (game.rngFx.next() - 0.5) * 10, y: this.floorY - 2, vx: 0, vy: -30, life: 0.3, max: 0.35, size: 2, col: '#c88cff' });
            if (this.t >= this.warnT) { this.st = 'up'; this.upT = 0; this.active = true; sndPlay('bossSlam', { x: this.cxx, vol: 0.35, p: 1.6 }); level.spawnDust(this.cxx, this.floorY, 5, 90, 14); }
            return;
        }
        this.upT += dt; const U = this.upT, hold = 0.42;
        const h = U < 0.08 ? this.maxH * (U / 0.08) : U < hold ? this.maxH : this.maxH * Math.max(0, 1 - (U - hold) / 0.12);
        this.h = Math.max(2, h); this.y = this.floorY - this.h; if (U >= hold + 0.12) this.alive = false;
    }
    draw(ctx, alpha) {
        if (ITEM_HP) return drawSoulPillarHp(this, ctx, alpha);
        const x = Math.round(this.x), fy = Math.round(this.floorY);
        if (this.st === 'warn') {
            const k = clamp(this.t / this.warnT, 0, 1), blink = this.warnT - this.t < 0.25 && Math.floor(this.t * 30) % 2;
            ctx.globalAlpha = blink ? 1 : 0.3 + 0.5 * k; ctx.strokeStyle = '#d070ff'; ctx.strokeRect(Math.round(this.cxx) - 9 + 0.5, fy - 3 + 0.5, 18, 3);
            ctx.fillStyle = '#e8c0ff'; ctx.fillRect(Math.round(this.cxx) - 1, fy - 9 - Math.round(k * 4), 3, 4); ctx.globalAlpha = 1; return;
        }
        const y = Math.round(this.y), h = Math.round(this.h);
        ctx.fillStyle = '#2a1648'; ctx.fillRect(x - 1, y - 1, 16, h + 1);
        for (let j = 0; j < h; j++) { const w = j < 6 ? 2 + j : 12 + (j % 6 < 3 ? 0 : 0); ctx.fillStyle = j < 4 ? '#f0e0ff' : '#a070e0'; ctx.fillRect(x + 7 - (w >> 1), y + j, Math.min(w, 14), 1); }
        ctx.fillStyle = '#d9a8ff'; ctx.fillRect(x + 3, y + 8, 2, Math.max(0, h - 10));
    }
}

// ---------- Boss 3: THỢ SĂN TUYẾT ----------
// idle → LAO (dash_wind → dash → dash_rec) | NÉM GIÁO (spear_wind → spear_out: giáo bay đi và quay về, boss đứng chờ = sơ hở) | NHẢY BỔ (leap_wind → leap → leap_rec) | pha 2: ĐÒN NỐI (lao, quay đầu, lao ngược lại) và NÉM 2 GIÁO.
const BOSS_HUNTER = {
    idle: [0.8, 0.55],
    dashW: [0.75, 0.55], dashSpeed: [200, 235], dashMax: 0.5, dashRec: [1.0, 0.8], comboW: 0.4,       // lao tối đa ~100–118 px
    spearW: [0.7, 0.55], spearSpeed: 150, spearRange: 150, spears: [1, 2], spear2Gap: 0.45, spearWait: 3.2,
    leapW: [0.75, 0.6], leapVy: -250, leapAir: 0.55, leapMaxVx: 170, leapRec: [1.0, 0.8], waveSpeed: [80, 100]
};
class Hunter extends Boss {
    constructor(cx, by) { super('hunter', cx, by); this.aim = -1; this.ignorePlat = true; this.combo = false; this.fastW = 0; this.spearsLeft = 0; this.spearT = 0; this.floorY = 0; this.spearHeight = 0; }
    ph(a) { return Array.isArray(a) ? a[this.phase - 1] : a; }
    sleepStep(level, dt) { this.vx = 0; this.vy = Math.min(this.vy + PHYS.gravity * dt, PHYS.fallMax); physMove(level, this, dt); }
    face(p) { if (!p.dead) this.facing = this.dir = p.cx >= this.cx ? 1 : -1; }
    spears() { let n = 0; for (const e of game.entities) if (e.alive && e instanceof IceSpear && e.owner === this) n++; return n; }
    throwSpear(level, y) {
        const B = BOSS_HUNTER; entAdd(new IceSpear(this.cx + this.facing * 10, y, this.facing, B.spearSpeed, B.spearRange, this));
        sndPlay('shard', { x: this.cx, vol: 0.8, p: 0.8 }); sndPlay('bossRush', { x: this.cx, vol: 0.35, p: 1.5 });
    }
    light() {
        const L = super.light(); if (L) return L;
        const B = BOSS_HUNTER, k = x => clamp(this.stT / this.ph(x), 0, 1);
        if (this.st === 'dash_wind') return { r: 14 + 22 * k(B.dashW), col: '#ff4a2a', a: 0.15 + 0.55 * k(B.dashW) };
        if (this.st === 'spear_wind') return { r: 14 + 20 * k(B.spearW), col: '#7fd0ff', a: 0.15 + 0.5 * k(B.spearW) };
        if (this.st === 'leap_wind') return { r: 14 + 22 * k(B.leapW), col: '#ffd060', a: 0.15 + 0.55 * k(B.leapW) };
        if (this.st === 'dash') return { r: 28, col: '#ffffff', a: 0.4 };
        return { r: 14, col: '#9ad8ff', a: 0.2 };
    }
    think(level, dt, p) {
        const B = BOSS_HUNTER, ph = this.phase;
        if (!this.floorY) this.floorY = this.y + this.h;
        if (this.spearT > 0 && (this.spearT -= dt) <= 0) { this.spearT = 0; if (this.spearsLeft > 0) { this.spearsLeft--; this.throwSpear(level, this.floorY - 7); } }
        switch (this.st) {
            case 'idle': {
                this.vx = 0; this.face(p);
                if (this.stT >= this.ph(B.idle)) {
                    const list = ph === 2 ? ['dash', 'spear', 'leap', 'combo'] : ['dash', 'spear', 'leap'];
                    const dx = Math.abs(p.cx - this.cx);
                    let pat = this.pick(list);
                    if (dx < 36 && pat === 'dash' && game.rngPlay.next() < 0.5) pat = this.pick(['spear', 'leap']);      // sát quá thì đừng lao (lao sẽ chạy qua người)
                    this.lastPat = pat;
                    if (pat === 'dash' || pat === 'combo') { this.aim = this.facing; this.combo = pat === 'combo'; this.go('dash_wind'); sndPlay('bossWind', { x: this.cx }); }
                    else if (pat === 'spear') { this.go('spear_wind'); sndPlay('bossWind', { x: this.cx, p: 1.4 }); }
                    else { this.go('leap_wind'); sndPlay('bossWind', { x: this.cx, p: 1.2 }); }
                }
                break;
            }
            case 'dash_wind':
                this.vx = 0;
                if (Math.floor(this.stT * 10) !== Math.floor((this.stT - dt) * 10)) level.spawnDust(this.cx - this.aim * 8, this.y + this.h, 2, 60, 12);
                if (this.stT >= (this.fastW || this.ph(B.dashW))) { this.fastW = 0; this.go('dash'); sndPlay('bossRush', { x: this.cx }); }
                break;
            case 'dash': this.vx = this.aim * this.ph(B.dashSpeed); if (Math.floor(this.stT * 30) !== Math.floor((this.stT - dt) * 30)) level.fx.push({ x: this.cx - this.aim * 8, y: this.cy + (game.rngFx.next() - 0.5) * 12, vx: -this.aim * 20, vy: 0, life: 0.25, max: 0.3, size: 3, col: '#e8f6ff' }); break;
            case 'dash_rec': this.vx = 0; if (this.stT >= this.ph(B.dashRec)) this.go('idle'); break;
            case 'spear_wind':
                this.vx = 0; this.face(p);
                if (this.stT >= this.ph(B.spearW)) {
                    const y = clamp(p.cy, this.floorY - 40, this.floorY - 8); this.throwSpear(level, y);
                    this.spearsLeft = this.ph(B.spears) - 1; this.spearT = this.spearsLeft > 0 ? B.spear2Gap : 0; this.go('spear_out');
                }
                break;
            case 'spear_out': this.vx = 0; if (this.stT > 0.3 && this.spearsLeft === 0 && this.spearT === 0 && this.spears() === 0 || this.stT >= B.spearWait) this.go('idle'); break;
            case 'leap_wind': this.vx = 0; this.face(p); if (this.stT >= this.ph(B.leapW)) {
                const dx = p.cx - this.cx; this.facing = this.dir = dx >= 0 ? 1 : -1;
                this.vy = B.leapVy; this.vx = clamp(dx / B.leapAir, -B.leapMaxVx, B.leapMaxVx); this.onGround = false; this.go('leap'); sndPlay('bossRush', { x: this.cx, vol: 0.6, p: 1.6 });
            } break;

            case 'leap_rec': this.vx = 0; if (this.stT >= this.ph(B.leapRec)) this.go('idle'); break;
        }
        if (this.st !== 'leap' && this.st !== 'dash') this.vx = 0;
        this.vy = Math.min(this.vy + PHYS.gravity * dt, PHYS.fallMax);
        physMove(level, this, dt);
        if (this.st === 'dash' && (this.hitL || this.hitR || this.stT >= B.dashMax)) {                                  // hết đà / đụng tường
            const wall = this.hitL || this.hitR; this.vx = 0;
            if (wall) { sndPlay('bossSlam', { x: this.cx, vol: 0.6 }); fxShake(2, 0.2); level.spawnBurst(this.cx + this.aim * 8, this.cy, 8, '#e8f6ff', 110); }
            if (this.combo) { this.combo = false; this.aim = -this.aim; this.facing = this.dir = this.aim; this.fastW = B.comboW; this.go('dash_wind'); sndPlay('bossWind', { x: this.cx, p: 1.5 }); }
            else this.go('dash_rec');
        }
    }
    land(level) {
        const B = BOSS_HUNTER, fy = this.y + this.h, sp = this.ph(B.waveSpeed);
        this.vx = 0; this.go('leap_rec'); sndPlay('bossSlam', { x: this.cx }); fxShake(3, 0.3); fxScreenFlash('#dff4ff', 0.14, 0.15);
        level.spawnBurst(this.cx, fy - 4, 14, '#e8f6ff', 140); level.spawnDust(this.cx, fy, 6, 120, 18);
        for (const d of [-1, 1]) entAdd(new Wave(this.cx + d * (this.w / 2 + 2), fy, d, sp, this, '#bfe9ff'));
    }
    draw(ctx, alpha) {
        if (ITEM_HP) return drawHunterHp(this, ctx, alpha);
        const x = Math.round(this.drawX(alpha)), y = Math.round(this.drawY(alpha)), W = this.w, H = this.h, f = this.facing, st = this.st, t = this.t;
        const flash = this.flashT > 0, sleep = st === 'sleep', B = BOSS_HUNTER;
        const k = st === 'dash_wind' ? clamp(this.stT / (this.fastW || this.ph(B.dashW)), 0, 1) : st === 'spear_wind' ? clamp(this.stT / this.ph(B.spearW), 0, 1) : st === 'leap_wind' ? clamp(this.stT / this.ph(B.leapW), 0, 1) : 0;
        const crouch = st === 'leap_wind' ? Math.round(k * 6) : st === 'dash_wind' ? Math.round(k * 4) : st === 'dash_rec' || st === 'leap_rec' ? 3 : 0;
        const shake = (st === 'dash_wind' || st === 'leap_wind' || st === 'spear_wind') && k > 0.5 ? (Math.floor(t * 40) % 2 ? 1 : -1) : st === 'roar' ? (Math.floor(t * 40) % 2 ? 2 : -2) : 0;
        const lean = st === 'dash' ? f * 4 : st === 'dash_wind' ? -f * Math.round(k * 3) : 0, ox = x + lean + shake, top = y + crouch;
        const out = '#18263a', cloak = flash ? '#ffffff' : sleep ? '#6a7c96' : '#cfe8ff', shade = flash ? '#ffffff' : sleep ? '#4a5a72' : '#7fa8d0', hi = flash ? '#ffffff' : '#ffffff';
        if (st === 'dash') { ctx.fillStyle = 'rgba(232,246,255,.35)'; ctx.fillRect(f > 0 ? ox - 22 : ox + W, y + 5, 22, H - 12); ctx.fillStyle = 'rgba(232,246,255,.2)'; ctx.fillRect(f > 0 ? ox - 36 : ox + W + 22, y + 9, 14, H - 20); }
        const step = st === 'idle' ? Math.floor(t * 4) % 2 : 0;
        ctx.fillStyle = out; ctx.fillRect(ox + 2, y + H - 7, 4, 7); ctx.fillRect(ox + W - 6, y + H - 7, 4, 7);                         // chân
        ctx.fillStyle = shade; ctx.fillRect(ox + 3, y + H - 6, 2, 6 - step); ctx.fillRect(ox + W - 5, y + H - 6, 2, 6);
        ctx.fillStyle = out; ctx.fillRect(ox - 1, top + 8, W + 2, H - 14 - crouch + 1);                                                  // áo choàng
        ctx.fillStyle = cloak; ctx.fillRect(ox, top + 9, W, H - 15 - crouch); ctx.fillStyle = shade; ctx.fillRect(ox, top + H - 9 - crouch, W, 3); ctx.fillRect(f > 0 ? ox : ox + W - 3, top + 10, 3, H - 18 - crouch);
        ctx.fillStyle = flash ? '#fff' : '#e0484a'; ctx.fillRect(ox + (W >> 1) - 3, top + 8, 6, 2);                                     // khăn đỏ
        ctx.fillRect(f > 0 ? ox - 4 : ox + W, top + 9, 4, 2 + (Math.floor(t * 6) % 2));
        ctx.fillStyle = out; ctx.fillRect(ox + 2, top, 10, 9); ctx.fillStyle = hi; ctx.fillRect(ox + 3, top + 1, 8, 7); ctx.fillStyle = shade; ctx.fillRect(ox + 3, top + 6, 8, 2);   // mặt nạ
        ctx.fillStyle = out; ctx.fillRect(ox + 1, top - 4, 2, 5); ctx.fillRect(ox + W - 3, top - 4, 2, 5); ctx.fillStyle = hi; ctx.fillRect(ox + 1, top - 3, 1, 4); ctx.fillRect(ox + W - 2, top - 3, 1, 4);   // sừng
        const eye = flash ? '#fff' : sleep ? '#2a3a52' : (st === 'dash_wind' || st === 'dash' || st === 'leap_wind' || st === 'spear_wind') ? '#ff3b3b' : '#1a2a48';
        ctx.fillStyle = eye; ctx.fillRect(ox + (f > 0 ? 7 : 3), top + 3, 4, 2);
        // giáo cầm tay: nâng lên khi báo, chĩa ra khi lao
        const hold = st === 'spear_out' && this.spears() > 0 ? 0 : 1;
        if (hold && !sleep) {
            const hx = f > 0 ? ox + W - 2 : ox + 2, hy = top + 14;
            ctx.fillStyle = out;
            if (st === 'spear_wind') { const ry = Math.round(lerp(hy, top - 4, k)); ctx.fillRect(hx - 1 + f * 2, ry, 4, 14); ctx.fillStyle = '#9ad8ff'; ctx.fillRect(hx + f * 2, ry + 1, 2, 12); ctx.fillStyle = '#fff'; ctx.fillRect(hx + f * 2, ry - 2, 2, 3); }
            else if (st === 'dash' || st === 'dash_wind') { const sx = f > 0 ? hx : hx - 16; ctx.fillRect(sx - 1, hy - 1, 19, 4); ctx.fillStyle = '#9ad8ff'; ctx.fillRect(sx, hy, 17, 2); ctx.fillStyle = '#fff'; ctx.fillRect(f > 0 ? sx + 16 : sx - 2, hy - 1, 3, 4); }
            else { ctx.fillRect(hx - 1 + f * 2, hy - 8, 4, 16); ctx.fillStyle = '#9ad8ff'; ctx.fillRect(hx + f * 2, hy - 7, 2, 14); ctx.fillStyle = '#fff'; ctx.fillRect(hx + f * 2, hy - 10, 2, 3); }
        }
        if (st === 'dash_wind') {                                                           // mũi tên đỏ trên sàn chỉ hướng lao
            const ax = this.aim > 0 ? x + W + 8 : x - 8, ay = y + H - 3; ctx.globalAlpha = 0.4 + 0.5 * k; ctx.fillStyle = '#ff3b3b';
            for (let i = 0; i < 3; i++) { const px = ax + this.aim * i * 10; for (let j = 0; j < 4; j++) ctx.fillRect(this.aim > 0 ? px + 3 - j : px - 3 + j, ay - 3 + j, 1, 7 - 2 * j); }

// ---------- Boss 4: KẺ DẪN HỒN ----------
// hover → (luôn DỊCH CHUYỂN trước: tele_out → tele_in) → CẦU HỒN (orb_wind → orb_rec) | CỘT GAI (pil_wind → pil_rec); sau mỗi loạt đòn Kẻ dẫn hồn HẠ THẤP sát sàn thở dốc (đánh được bằng roi từ dưới đất, như Bà chúa 'tired') | pha 2: ĐẬP (tele lên trên người chơi → slam_wind (cột sáng báo) → slam → stuck (nằm sơ hở) → rise).
const BOSS_MAGE = {
    idle: [0.9, 0.65], teleOut: 0.4, teleIn: 0.3,
    orbW: [0.9, 0.7], orbs: [2, 3], orbSpeed: [60, 70], orbSpread: 0.6, orbTurn: 1.3, orbRec: [1.9, 1.5],
    pilW: [0.55, 0.45], pilWarn: [1.0, 0.85], pilGap: [46, 40], pils: [3, 5], pilStagger: [0, 0.1], pilRec: [1.9, 1.5],
    slamW: 1.0, slamLock: 0.35, slamSpeed: 300, stuck: 2.2, waveSpeed: [90, 105], rise: 110, hover: 36, lowGap: 6, destMin: 44, destMax: 130, anchors: [6, 9.5, 13, 18, 21.5]
};
class Mage extends Boss {
    constructor(cx, by) {
        super('mage', cx, by); this.gravity = 0; this.ignorePlat = true; this.firstState = 'hover'; this.floorY = 0; this.homeY = by - BOSS_MAGE.hover - this.h; this.y = this.py = this.homeY;
        this.next = 'orbs'; this.dest = null; this.lockX = cx; this.pilQ = [];
    }
    ph(a) { return Array.isArray(a) ? a[this.phase - 1] : a; }
    get harmless() { return super.harmless || this.st === 'tele_out'; }
    sleepStep(level, dt) { this.hoverTo(dt, level, this.x, this.homeY, 90); }
    hoverTo(dt, level, x, y, sp) {
        const dx = x - this.x, dy = y + Math.sin(this.t * 2.4) * 2.5 - this.y, L = Math.hypot(dx, dy), v = Math.min(sp, L * 4);
        this.vx = L > 0.5 ? dx / L * v : 0; this.vy = L > 0.5 ? dy / L * v : 0; physMove(level, this, dt);
    }
    floor(level) { return this.floorY || (this.floorY = roomFloorY(level, level.pw / 2, TILE * 2)); }
    light() {
        const L = super.light(); if (L) return L;
        const B = BOSS_MAGE, k = (a) => clamp(this.stT / this.ph(a), 0, 1);
        if (this.st === 'orb_wind') return { r: 20 + 28 * k(B.orbW), col: '#c88cff', a: 0.2 + 0.5 * k(B.orbW) };
        if (this.st === 'pil_wind') return { r: 18 + 20 * k(B.pilW), col: '#b070ff', a: 0.2 + 0.5 * k(B.pilW) };
        if (this.st === 'slam_wind') return { r: 18 + 26 * k(B.slamW), col: '#ff5a5a', a: 0.2 + 0.5 * k(B.slamW) };
        if (this.st === 'tele_out' || this.st === 'tele_in') return { r: 24, col: '#e0b8ff', a: 0.4 };
        return { r: 24, col: '#a070e0', a: 0.3 };
    }
    pickDest(level, p, slam) {
        const B = BOSS_MAGE, R = game.rngPlay;
        if (slam) return { x: clamp(p.cx - this.w / 2, TILE * 3, level.pw - TILE * 3 - this.w), y: TILE * 2.5 };

        for (let j = 0; j < H - 6; j++) { const wd = 5 + Math.round(j * 0.42); ctx.fillStyle = out; ctx.fillRect(cx - wd - 1 + (j > 14 ? sway : 0), top + 8 + j, wd * 2 + 3, 1); }   // áo choàng rộng dần xuống

// 12b_zonemech — CƠ CHẾ RIÊNG CỦA TỪNG VÙNG (lần 37). Ý tưởng học từ Spelunky 2: mỗi thế giới đổi LUẬT chơi chứ không chỉ đổi màu. Cách làm tự thiết kế.
//   snow    : sàn băng — trượt khi thả phím (ma sát 0,93/khung SC thay vì 0,6), tăng tốc chậm hơn 45% khi đứng đất.
//   crystal : trọng lực nhẹ ×0,8 — nhảy cao, lượn lâu (vùng nhảy của bộ sinh chỉ RỘNG THÊM, nên mọi level vẫn đi được). Sát thương rơi tính theo ĐỘ CAO, không theo thời gian.
//   cave    : thạch nhũ (ký tự 'q', `Stalactite`) — treo trần, người chơi bước vào bên dưới thì rung ~0,5 s (có dấu đỏ ở sàn) rồi rơi, −1 máu nếu trúng.
//   Phòng boss KHÔNG áp dụng (số liệu boss đã chỉnh trên luật thường). Vùng khác chưa có cơ chế riêng.
const ZONE_MECH = {
    snow:    { iceFric: 0.93, iceAccel: 0.55, note: 'Sàn băng trơn — khó dừng lại!' },
    crystal: { gravMul: 0.8, note: 'Trọng lực nhẹ — nhảy cao và lượn lâu hơn.' },
    cave:    { drip: true, note: 'Thạch nhũ trên trần — nghe tiếng nứt là né!' },
    magma:   { pop: true, note: 'Dung nham sôi — bong bóng lửa bắn lên khỏi mặt dung nham!' }

const MECH_NONE = { iceFric: 0, iceAccel: 1, gravMul: 1, drip: false, pop: false, note: null };
const MECH_CACHE = {};
function mechOf(zone) {
    if (!zone) return MECH_NONE;
    return MECH_CACHE[zone.id] || (MECH_CACHE[zone.id] = Object.assign({}, MECH_NONE, ZONE_MECH[zone.id] || {}));
}
function curMech() {
    const li = game.levelIdx || 0;
    return BOSS_LEVELS[li] ? MECH_NONE : mechOf(zoneOf(li));
}

const STAL = { warnT: 0.5, sightX: 14, sightY: 150, grav: 800, fallMax: 320 };
class Stalactite extends BossHazard {
    constructor(c, r) { super(c * TILE + 4, r * TILE, 8, 11, 'stalactite', null); this.st = 'hang'; this.active = false; this.homeX = this.x; this.floorY = 0; this.warnAt = 0; }

    clearBelow(level, toY) { for (let y = this.y + this.h + 2; y < toY; y += 4) if (level.solidAt(this.cx, y)) return false; return true; }
    shatter(level, burst) {
        this.alive = false; level.spawnBurst(this.cx, this.cy, burst, '#9aa0b8', 90); level.spawnDust(this.cx - 4, this.y + this.h, 4, 60, 12);
        sndPlay('rock', { x: this.cx, p: 1.3 }); fxShake(0.6, 0.1);
    }

    step(level, dt) {
        const p = game.player;
        if (this.st === 'hang') {

            if (p && !p.dead && Math.abs(p.cx - this.cx) <= STAL.sightX && p.y > this.y + this.h && p.y - this.y <= STAL.sightY && this.clearBelow(level, p.y)) {
                this.st = 'warn'; this.warnAt = this.t; this.floorY = roomFloorY(level, this.cx, this.y + this.h); sndPlay('rock', { x: this.cx, vol: 0.5, p: 1.7 });
            }
        } else if (this.st === 'warn') {

            const k = clamp((this.t - this.warnAt) / STAL.warnT, 0, 1), fy = Math.round(this.floorY), blink = k > 0.7 && Math.floor(this.t * 30) % 2;
            ctx.globalAlpha = blink ? 1 : 0.35 + 0.5 * k; ctx.fillStyle = '#ff3b3b'; ctx.fillRect(Math.round(this.cx) - 4, fy - 2, 8, 2); ctx.globalAlpha = 1;

            const wd = Math.max(1, Math.round(this.w * (1 - j / this.h))), ox = x + ((this.w - wd) >> 1);

// ---- Vùng 9 (hang núi lửa): bong bóng lửa — mặt dung nham GẦN người chơi sủi bọt (báo 0,6 s) rồi bắn 1 cầu lửa lên, rơi lại ----
const POP = { gapMin: 1.6, gapMax: 3.2, warnT: 0.6, range: 150, vy: -140, maxLive: 3 };
function lavaPopStep(L, p) {
    if (!p || p.dead || !L.hasLava || !curMech().pop) return;
    const q = game.popQ || (game.popQ = []); if (game.popT === undefined || game.levelT < 0.2) game.popT = POP.gapMin;
    for (let i = q.length - 1; i >= 0; i--) {
        const o = q[i]; o.t -= STEP;
        if (Math.floor(o.t * 30) % 3 === 0) L.fx.push({ x: o.x + (game.rngFx.next() - 0.5) * 10, y: o.y - 1, vx: 0, vy: -18, life: 0.25, max: 0.3, size: 2, col: '#ffb040' });
        if (o.t <= 0) { q.splice(i, 1); if (L.tile(o.c, o.r) === T_LAVA) { entAdd(new Fireball(o.x, o.y - 2, (game.rngPlay.next() - 0.5) * 20, POP.vy, null)); sndPlay('boom', { x: o.x, p: 2, vol: 0.25 }); L.spawnBurst(o.x, o.y, 5, '#ff9a2e', 80); } }
    }
    if ((game.popT -= STEP) > 0 || q.length >= POP.maxLive) return;
    game.popT = POP.gapMin + game.rngPlay.next() * (POP.gapMax - POP.gapMin);
    const c0 = Math.max(0, Math.floor((p.cx - POP.range) / TILE)), c1 = Math.min(L.w - 1, Math.floor((p.cx + POP.range) / TILE)), r0 = Math.max(0, Math.floor((p.cy - 110) / TILE)), r1 = Math.min(L.h - 1, Math.floor((p.cy + 110) / TILE)), cand = [];
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (L.tile(c, r) === T_LAVA && !L.isSolid(c, r - 1) && L.tile(c, r - 1) !== T_LAVA) cand.push([c, r]);
    if (!cand.length) return;
    const [c, r] = cand[Math.floor(game.rngPlay.next() * cand.length)]; q.push({ c, r, x: (c + 0.5) * TILE, y: r * TILE + 6, t: POP.warnT });
}

// 12c_finale — MÀN CUỐI (level 55 sau vùng 9, lần 40-41): TITAN NÚI LỬA, boss "đố mẹo môi trường" (ý Dan chốt 14:24, kiểu Olmec của Spelunky).
//   Titan BẤT TỬ (mọi đòn đều "keng"); không có thanh máu. Cách thắng: sàn arena gồm 5 Ô (mỗi ô rộng 4 ô-gạch) × 2 LỚP đất, dưới cùng là dung nham.
//   Mỗi cú ĐẬP của Titan phá 1 lớp trong đúng ô nó nhắm (ô khoá theo vị trí người chơi lúc bắt đầu "báo"; cột đỏ báo ô nào). Đập vào ô đã mất hết lớp

//   đập sai ô thì thủng thêm một hố (hết chỗ đứng), bom có thể phá sẵn một lớp để rút ngắn. Số liệu là ước lượng — chỉnh ở BOSS_TITAN.
//   Tọa độ arena (genFinaleArena): lưới 26×24, ô-gạch hàng 16-17 là sàn (2 lớp), hàng 18-22 dung nham, 2 bệ cứng hai bên (xuất phát trái, cửa ra phải).
const BOSS_TITAN = {
    hover: 84, idle: [1.0, 0.7], track: [1.1, 0.8], slamW: [1.0, 0.75], slamSpeed: 340, stuck: [1.2, 0.9], rise: 130, waveSpeed: [80, 100],
    rainW: 0.8, rainWarn: 0.9, rainN: [4, 5], rainRec: 1.3, sinkSpeed: 70, sinkDepth: 0.65, teach: 2
};
const FIN = { W: 26, H: 24, cells: 5, cellW: 4, c0: 3, layerRows: [16, 17], lavaRow: 18, bossRow: 6 };     // tọa độ lưới map (chưa cộng LVL.border)

function genFinaleArena(levelIdx) {
    const W = FIN.W, H = FIN.H, g = []; for (let r = 0; r < H; r++) g.push(new Array(W).fill('.'));
    for (let c = 0; c < W; c++) { g[0][c] = 'H'; g[H - 1][c] = 'H'; } for (let r = 0; r < H; r++) { g[r][0] = 'H'; g[r][W - 1] = 'H'; }

// Lớp trên cùng còn lại của ô i (hàng ô-gạch), hoặc -1 nếu ô đã thủng hết
function finTopRow(level, F, i) {
    for (let k = 0; k < F.rows; k++) { const r = F.topRow + k; for (let j = 0; j < F.cellW; j++) if (level.isSolid(F.c0 + i * F.cellW + j, r)) return r; }
    return -1;
}

class Titan extends Boss {
    constructor(cx, by, F) {
        super('titan', cx, by); this.F = F; this.gravity = 0; this.ignorePlat = true; this.firstState = 'hover'; this.slams = 0; this.acts = 0; this.cell = 2; this.lockCx = cx; this.sunk = false; this.rainLeft = 0;
        this.homeY = F.topRow * TILE - BOSS_TITAN.hover - this.h; this.homeX = cx - this.w / 2; this.x = this.px = this.homeX; this.y = this.py = this.homeY; this.noBar = true;
    }
    ph(a) { return Array.isArray(a) ? a[this.phase - 1] : a; }
    get harmless() { return this.st === 'sleep' || this.st === 'intro' || this.st === 'roar' || this.st === 'dying'; }
    hurt(src) {                                                      // BẤT TỬ: mọi đòn chỉ "keng"
        if (!this.alive || this.st === 'dying') return false;
        const k = src.kind; if (k !== DMG.WHIP && k !== DMG.STOMP && k !== DMG.EXPLOSION && k !== DMG.IMPACT && k !== DMG.ARROW) return false;
        if ((this.clangT || 0) <= 0) { this.clangT = 0.2; sndPlay('clang', { x: this.cx, p: 0.6 }); game.level.spawnBurst(this.cx, this.cy, 5, '#ffb070', 90); this.flashT = 0.06; }

    }
    wake(level) {

    }

    cellCx(i) { return (this.F.c0 + i * this.F.cellW + this.F.cellW / 2) * TILE; }

    }
    hoverTo(level, dt, x, y, sp) {

        this.vx = L > 0.5 ? dx / L * v : 0; this.vy = L > 0.5 ? dy / L * v : 0; physMove(level, this, dt);
    }
    light() {
        const L = super.light(); if (L) return L;
        const B = BOSS_TITAN;
        if (this.st === 'slam_wind') { const k = clamp(this.stT / this.ph(B.slamW), 0, 1); return { r: 30 + 30 * k, col: '#ff5a3a', a: 0.25 + 0.5 * k }; }
        if (this.st === 'rain_wind') return { r: 40, col: '#ff7a3a', a: 0.5 };
        if (this.st === 'sink') return { r: 50, col: '#ffb060', a: 0.6 };

    }
    think(level, dt, p) {
        const B = BOSS_TITAN, F = this.F; if (this.clangT > 0) this.clangT -= dt;

        switch (this.st) {
            case 'hover':

                this.hoverTo(level, dt, lerp(this.x, p.cx - this.w / 2, 0.4), this.homeY, 45);
                if (this.stT >= this.ph(B.idle)) {

                }

            case 'slam_track':

                if (this.stT >= this.ph(B.track)) { const over = p.cx >= F.c0 * TILE && p.cx < (F.c0 + F.cells * F.cellW) * TILE; this.cell = over ? this.cellOf(p.cx) : Math.floor(game.rngPlay.next() * F.cells); this.lockCx = this.cellCx(this.cell); this.go('slam_wind'); sndPlay('diveWind', { x: this.cx, vol: 1.0, p: 0.7 }); }
                break;
            case 'slam_wind':
                this.hoverTo(level, dt, this.lockCx - this.w / 2, this.homeY - 6 * clamp(this.stT / this.ph(B.slamW), 0, 1), 120);
                if (this.stT >= this.ph(B.slamW)) { this.go(finTopRow(level, F, this.cell) < 0 ? 'sink' : 'slam'); this.x = this.lockCx - this.w / 2; sndPlay('diveGo', { x: this.cx, vol: 1.0, p: 0.7 }); }

                this.vx = 0; this.y += (this.stT < 0.25 ? B.slamSpeed : B.sinkSpeed) * dt; this.sunk = true;
                if (Math.floor(this.t * 20) !== Math.floor((this.t - dt) * 20)) level.spawnBurst(this.cx + (game.rngFx.next() - 0.5) * this.w, this.y + this.h * 0.9, 2, '#ff8a2a', 100);
                if (this.y + this.h * B.sinkDepth >= F.lavaRow * TILE + 4) { this.y = F.lavaRow * TILE + 4 - this.h * B.sinkDepth; this.die(null); sndPlay('boom', { x: this.cx, p: 0.6 }); level.spawnBurst(this.cx, F.lavaRow * TILE, 26, '#ff8a2a', 190); }
                break;

            case 'rain_wind':

                    this.go('rain_rec');

    impact(level) {                                                 // đập xuống: vỡ 1 lớp của ô, sóng lửa hai phía, nằm yên một nhịp
        const B = BOSS_TITAN, F = this.F, row = finTopRow(level, F, this.cell), fy = (row < 0 ? F.topRow : row) * TILE;

        sndPlay('bossSlam', { x: this.cx }); fxShake(5, 0.4); fxScreenFlash('#ffb070', 0.2, 0.2);

}
// Dấu hiệu trên sàn: mỗi ô còn mấy lớp (vệt kẻ trên mặt ô, nứt khi còn 1 lớp)
function drawFinaleFloorHp(ctx, F, L) {
    const t = game.time;
    for (let i = 0; i < F.cells; i++) {
        const n = finLayers(L, F, i), x0 = (F.c0 + i * F.cellW) * TILE, row = finTopRow(L, F, i); if (row < 0) continue;
        const y = row * TILE, w = F.cellW * TILE;
        ctx.fillStyle = n >= 2 ? '#8a5a40' : '#ff7a3a'; ctx.fillRect(x0 + 1, y, 0.5, 4); ctx.fillRect(x0 + w - 1.5, y, 0.5, 4);           // cột mốc hai bên ô
        if (n === 1) { ctx.fillStyle = 'rgba(255,122,58,' + (0.55 + 0.25 * Math.sin(t * 5)).toFixed(2) + ')'; for (let k = 0; k < 6; k++) { const zx = x0 + 6 + k * 9.5; ctx.fillRect(zx, y + 0.5, 3, 0.5); ctx.fillRect(zx + 2.5, y + 1, 0.5, 1); ctx.fillRect(zx + 1.5, y + 2, 2, 0.5); } }
    }
}

// 13a_items — vật cầm được + bom + dây + vàng. Mỗi món chỉ khai báo thuộc tính Thing (08a_thing); va chạm/sát thương do 10a_damage lo.
//   Đá (SC oRock 8×8): ném trúng sinh vật −1. Bình (SC oJar): vỡ khi đâm tường > 3 px/khung hoặc rơi > 3 px/khung, bị roi/nổ; vỡ ra đồ ngẫu nhiên (dòng lối chơi).

class Pot extends Thing {

// Thùng gỗ (SC oCrate): cầm/ném được; đứng cạnh (hoặc đang cầm) bấm ↑ + X để mở => ra đồ (SC: phần lớn là cuộn dây hoặc túi bom; đồ hiếm để GĐ6)

class Bomb extends Thing {
    constructor(x, y) {
        super(x, y, 8, 8, { kind: 'bomb', carryable: true, hurtsOnImpact: false, mass: 1, col: '#2a2a33', dmgFrom: [], bounceX: 0.2, bounceY: 0.35 });
        this.fuseT = -1;
    }
    onWall(level, v) { if (this.safeT > 0) this.vx = 0; }          // lần 29: vừa ném đã đụng tường (ném sát vách) => rơi xuống ngay chân tường, không nảy ngược ra
    light() { this.fused = true; this.fuseT = 0; sndPlay('ui', { x: this.cx, p: 0.6 }); }

    update(level, dt) {
        super.update(level, dt);

        if (this.fuseT >= ITEM.bombFuse + ITEM.bombFuse2) {

        ctx.fillStyle = '#9a7a4a'; ctx.fillRect(x + 4, y, 1, 2);
        if (this.fused) { ctx.fillStyle = game.rngFx.chance(0.5) ? '#ffe86a' : '#ff8a3a'; ctx.fillRect(x + 4, y - 1, 1, 1); }
    }
}

// Mũi tên của bẫy (SC oArrow): bay ngang nhanh; đâm tường thì rơi xuống thành vật nhặt/ném được
class Arrow extends Thing {

class Gold extends Thing {
