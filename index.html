            for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nc = c + dc, nr = r + dr; if (nc < 0 || nr < 0 || nc >= fw || nr >= fh || air[nr * fw + nc] || solidAt(nc, nr)) continue; air[nr * fw + nc] = 1; st.push(nr * fw + nc); }
        }
        const monCh = {}; for (const k in zone.floor) monCh[k] = 1; for (const k in zone.air) monCh[k] = 1; delete monCh.x;
        let dropped = 0;
        for (let r = B; r < H + B; r++) for (let c = B; c < W + B; c++) {
            if (!monCh[full[r][c]] || air[r * fw + c] || inShop(c, r)) continue;
            if (R.chance(GEN.sealedKeep)) continue;
            const ch = full[r][c]; full[r][c] = '.'; dropped++;
            if (ch === 'S') counts.snake--; else if (ch === 'B') counts.bat--; else counts.foe--;
        }
        // vàng / thùng nằm ở chỗ hở thông với đường đi nhưng KHÔNG nhảy tới được (bậc quá xa / quá hẹp, bom ném sang cũng nảy ra) => bỏ: thấy mà không lấy được là khó chịu
        const nearSeen = (c, r) => { for (const [dc, dr] of [[0, 0], [0, -1], [0, 1], [-1, 0], [1, 0], [0, -2], [-1, -1], [1, -1]]) if (reach.seen[(r + dr) * fw + c + dc]) return true; return false; };
        let unreachable = 0;
        for (let r = B; r < H + B; r++) for (let c = B; c < W + B; c++) {
            const ch = full[r][c]; if ((ch !== 'g' && ch !== 'G' && ch !== 'c') || inShop(c, r) || !air[r * fw + c] || nearSeen(c, r)) continue;
            full[r][c] = '.'; unreachable++; if (ch === 'c') counts.crate--; else counts.gold--;
        }
        counts.unreachableLoot = unreachable;
        const standOK = (c, r) => full[r][c] === '.' && solidAt(c, r + 1) && full[r - 1][c] === '.' && reach.seen[r * fw + c] && !nearDoor(c, r) && !inShop(c, r) && !(roomOf(c, r).x === path.start.x && roomOf(c, r).y === path.start.y);
        const zl = 1 + 0.5 * Math.min(levelIdx, 40) / 40;
        let extraFoe = 0, extraLoot = 0;
        for (let r = B + 1; r < H + B; r++) for (let c = B; c < W + B; c++) {
            if (!standOK(c, r)) continue;
            if (R.chance(GEN.routeFoe * zl * zr)) { const ch = genWeighted(R, zone.floor); full[r][c] = ch; extraFoe++; counts[ch === 'S' ? 'snake' : ch === 'x' ? 'rock' : 'foe']++; }
            else if (R.chance(GEN.routeLoot * zl2)) { const n = R.int(1, 100); full[r][c] = n <= 55 ? 'g' : n <= 72 ? 'G' : n <= 90 ? 'c' : 'o'; extraLoot++; if (n <= 72) counts.gold++; else if (n <= 90) counts.crate++; else counts.pot++; }
        }
        // thạch nhũ (cơ chế vùng Hang ngầm): treo ở trần phía trên sàn ĐI TỚI ĐƯỢC, cột trống ≥ 4 ô, không sát cửa / phòng đặc biệt
        let drip = 0;
        if (mechOf(zone).drip) for (let r = B + 1; r < H + B; r++) for (let c = B; c < W + B; c++) {
            if (!reach.seen[r * fw + c] || full[r][c] !== '.' || !solidAt(c, r + 1) || nearDoor(c, r) || inShop(c, r)) continue;
            let t = r; while (t - 1 >= B && full[t - 1][c] === '.' && r - t < 8) t--;
            if ('#$%X'.indexOf(full[t - 1][c]) < 0 || r - t + 1 < 4 || full[t][c - 1] === 'q' || full[t][c + 1] === 'q') continue;
            const rm = roomOf(c, r); if (rm.x === path.start.x && rm.y === path.start.y) continue;

        counts.dropped = dropped; counts.extraFoe = extraFoe; counts.extraLoot = extraLoot;
    }
    // công chúa cần cứu (GĐ4): xác suất GEN.princessChance mỗi level; trên sàn ĐI TỚI ĐƯỢC (validator), không ở phòng vào / cửa hàng / sát cửa
    if (R.chance(GEN.princessChance)) {

        for (let r = B + 1; r < H + B; r++) for (let c = B; c < W + B; c++) {
            if (full[r][c] !== '.' || !solidAt(c, r + 1) || full[r - 1][c] !== '.' || nearDoor(c, r) || inShop(c, r)) continue;

        const kc = [];
        for (let r = B + 1; r < H + B; r++) for (let c = B; c < W + B; c++) {
            if (full[r][c] !== '.' || !solidAt(c, r + 1) || full[r][c] === '^' || nearDoor(c, r) || inShop(c, r)) continue;
            const rm = roomOf(c, r); if (rm.x === path.start.x && rm.y === path.start.y) continue;
            if (!reach.seen[r * grid.w + c]) continue;
            kc.push({ c, r });
        }
        if (kc.length) { const q = R.pick(kc); full[q.r][q.c] = 'y'; }
        else for (let r = 0; r < full.length; r++) for (let c = 0; c < full[r].length; c++) if (full[r][c] === 'm') full[r][c] = '.';
    }

    const map = []; for (let r = B; r < H + B; r++) map.push(full[r].slice(B, W + B).join(''));
    const zi = zoneIdx(levelIdx), dk = rngWorld(seedForDark, 9000 + zi), dark = levelIdx % ZONE_LEN >= 1 && dk.chance(zone.darkChance) && dk.int(1, ZONE_LEN - 1) === (levelIdx % ZONE_LEN);      // SC: tối đa MỘT level tối mỗi vùng (level 2–cuối của vùng)
    return {
        def: { id: 'L' + (levelIdx + 1), name: zone.name + ' ' + (zoneIdx(levelIdx) + 1) + '-' + (levelIdx % ZONE_LEN + 1), theme: zone.theme, dark: dark ? zone.dark : 0, map },
        meta: { path, rooms, start: s, exit: e, counts, shop, pit, altar, chest, treasure, lake, opened }

}
// Kiểm lại một def đã sinh (fuzz / test): đi từ P tới E được không?
function genValidate(def) {
    const B = LVL.border, rows = [];
    rows.push('H'.repeat(def.map[0].length + 2 * B));
    for (const s of def.map) rows.push('H' + s + 'H');
    rows.push('H'.repeat(def.map[0].length + 2 * B));
    let P = null, E = null;
    for (let r = 0; r < rows.length; r++) for (let c = 0; c < rows[r].length; c++) { if (rows[r][c] === 'P') P = { c, r }; if (rows[r][c] === 'E') E = { c, r }; }
    if (!P || !E) return { ok: false, why: 'thiếu cửa' };
    const clean = rows.map(s => s.replace(/[PErocgGSBKaehikzwbxDTUCRAJOQIfdqnmy12]/g, '.'));
    const grid = genGrid(clean), reach = genReach(grid, P.c, P.r);
    const ok = !!reach.seen[E.r * grid.w + E.c];
    // không có vật nào nằm trong ô đặc
    let inWall = 0; for (let r = 0; r < rows.length; r++) for (let c = 0; c < rows[r].length; c++) if ('rocgGSBKaehikzwbxDTUCRAJOQIfdnmy12'.indexOf(rows[r][c]) >= 0 && genSolidCh(clean[r][c])) inWall++;
    return { ok: ok && inWall === 0, reach: ok, inWall };
}

// 08_entity — lớp cơ sở cho mọi thực thể (người chơi, quái, vật thể). Toạ độ x,y = góc trên-trái hitbox.

class Entity {

// 08a_thing — Thing: MỌI vật thể động (người chơi, quái, đá, bình, bom, mũi tên, vàng…) — mô hình tương tác thống nhất (roadmap mục 3).
//   Món mới chỉ KHAI BÁO thuộc tính, không viết luật riêng cho từng cặp:
//     mass           0 nhẹ · 1 vừa · 2 nặng (chưa dùng nhiều ở GĐ1; GĐ5: đè, đẩy)
//     carryable      nhặt / mang / ném được (10b_carry)
//     hp, dmgFrom    máu và tập NGUỒN sát thương có tác dụng (10a_damage: DMG.*). Sát thương không biết "ai" gây ra, chỉ biết nguồn.
//     creature       sinh vật: nhận sát thương va chạm từ vật bay, gai giết khi rơi trúng, bị đạp đầu…
//     hurtsOnImpact  khi bay đủ nhanh (> ITEM.impactSpeed) mà trúng sinh vật / vật vỡ được thì gây impactDmg (10a_damage: dmgImpacts)
//     triggersTraps  đang chuyển động thì kích bẫy cảm biến (13b_traps). Mặc định: có
//     breakOnImpact  vỡ khi rơi / đâm mạnh (bình)
//   Vật lý mặc định (vật không tự đi): trọng lực ITEM.itemGravity, nảy khi chạm đất/tường (SC: oItem), lăn chậm dần.

const THING_FALLMAX = 240;          // SC: vật rơi tối đa 8 px/khung
const THING_INVULN_KINDS = new Set(['bite', 'impact', 'arrow', 'whip', 'stomp', 'boss']);

class Thing extends Entity {
    constructor(x, y, w, h, o) {
        super(x, y, w, h);
        o = o || {};
        this.kind = o.kind || 'thing';
        this.mass = o.mass === undefined ? 1 : o.mass;
        this.carryable = !!o.carryable;
        this.creature = !!o.creature;
        this.hp = this.maxHp = o.hp === undefined ? 1 : o.hp;
        this.dmgFrom = new Set(o.dmgFrom || DMG_ALL);
        this.hurtsOnImpact = !!o.hurtsOnImpact; this.impactDmg = o.impactDmg || 1;
        this.triggersTraps = o.triggersTraps !== false;
        this.breakOnImpact = !!o.breakOnImpact;
        this.gravity = o.gravity === undefined ? ITEM.itemGravity : o.gravity;
        this.fallMax = o.fallMax || THING_FALLMAX;
        this.bounceY = o.bounceY === undefined ? ITEM.bounceY : o.bounceY;
        this.bounceX = o.bounceX === undefined ? ITEM.bounceX : o.bounceX;
        this.col = o.col || '#c8c8c8';
        this.holder = null;          // đang bị ai cầm (Thing) — bị cầm thì không tự chạy vật lý
        this.thrower = null; this.safeT = 0;     // vừa bị ném: không làm đau người ném trong safeT giây (SC: alarm[2] = 10 khung)
        this.hitSet = null;          // các mục tiêu đã trúng trong lần bay này (mỗi lần ném trúng mỗi mục tiêu tối đa 1 lần)
        this.invulnT = 0; this.stunT = 0; this.fallT = 0; this.blinkT = 0;
        this.ignorePlat = false;
        this.lastHurt = null;        // nguồn sát thương gần nhất (màn kết ván: "chết vì …")
        this.fused = false;          // bom đang cháy ngòi (13a_items)
    }
    get moving() { return Math.abs(this.vx) > 1 || Math.abs(this.vy) > 1; }
    get speed() { return Math.hypot(this.vx, this.vy); }
    box() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
    timers(dt) {
        if (this.safeT > 0) this.safeT -= dt;
        if (this.invulnT > 0) this.invulnT -= dt;
        if (this.blinkT > 0) this.blinkT -= dt;
        if (this.noiseT > 0) this.noiseT -= dt;
        if (this.thrownT > 0) this.thrownT -= dt;
        if (this.holder && this.creature && this.wriggles && (this.heldT = (this.heldT || 0) + dt) > 3.5) { this.heldT = 0; this.stunT = 0; this.release(); }       // quái bị bế giãy ra sau 3.5s
        else if (!this.holder && this.heldT) this.heldT = 0;
    }
    update(level, dt) {
        this.timers(dt);
        if (this.holder) { this.followHolder(); return; }
        this.physStep(level, dt);
    }
    // Bị cầm: đặt ở tay người cầm (SC: ngang hông, phía trước 4–6px)
    followHolder() {
        const h = this.holder;
        if (!h.alive && !h.dead) { this.holder = null; return; }
        const nx = h.cx + h.facing * 5 - this.w / 2, ny = h.y + h.h - this.h - 2;
        this.x = nx; this.y = ny; this.vx = h.vx; this.vy = h.vy;
    }
    // Vật lý vật không tự đi (SC: oItem Step): trọng lực, nảy, lăn
    physStep(level, dt) {
        if (level.inWater(this)) { this.vy = Math.min(this.vy + this.gravity * WATER.itemGrav * dt, WATER.itemFallMax); this.vx *= scFric(WATER.fric, dt); }
        else this.vy = Math.min(this.vy + this.gravity * dt, this.fallMax);
        physMove(level, this, dt);
        if (this.hitL || this.hitR) { this.vx = -this.hitVx * this.bounceX; this.onWall(level, this.hitVx); }
        if (this.hitU) this.vy = Math.abs(this.hitVy) * 0.8;
        if (this.onGround) {
            const hv = this.hitVy;
            if (hv > 30) { this.vy = -hv * this.bounceY; this.onLand(level, hv); }
            else { this.vx *= scFric(ITEM.groundFric, dt); if (Math.abs(this.vx) < 3) this.vx = 0; }
        }
        if (this.y > level.ph + 64) this.alive = false;
    }
    onWall(level, v) { if (this.breakOnImpact && Math.abs(v) > ITEM.impactSpeed) this.shatter(level); }
    onLand(level, v) { if (this.breakOnImpact && v > ITEM.impactSpeed) this.shatter(level); }
    shatter(level) { this.die({ kind: DMG.CRUSH, dmg: 1 }); }
    // Nhận sát thương từ nguồn src = { kind, dmg, x, y, vx, by }. Trả về true nếu có tác dụng.
    hurt(src) {
        if (!this.alive || this.dead || !this.dmgFrom.has(src.kind)) return false;
        if (this.invulnT > 0 && THING_INVULN_KINDS.has(src.kind)) return false;      // nhấp nháy sau khi bị cắn chỉ chặn đòn "chạm" — nổ, gai, rơi vẫn có tác dụng (SC)

        this.onHurt(src);

        return true;
    }
    onHurt(src) { }
    die(src) { this.alive = false; if (this.holder) this.release(); this.onDie(src); }
    onDie(src) { }
    release() { if (this.holder && this.holder.hold === this) this.holder.hold = null; this.holder = null; }
    knock(vx, vy) { this.vx = vx; this.vy = vy; }
    draw(ctx, alpha) {
        if (this.blinkT > 0 && Math.floor(this.blinkT * 20) % 2) return;
        ctx.fillStyle = this.col; ctx.fillRect(Math.round(this.drawX(alpha)), Math.round(this.drawY(alpha)), this.w, this.h);
    }
}

// Thực thể đang sống trong level (game.entities), lọc theo hàm f
function thingsWhere(f) { const out = []; for (const e of game.entities) if (e.alive && f(e)) out.push(e); return out; }
function overlapBox(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

// 09_player — người chơi kiểu Spelunky (GĐ1). Số liệu ở PHYS / WHIP / ITEM (01_config, đổi từ Spelunky Classic).
//   Trạng thái (state): stand · run · duck · air · hang (bám mép) · climb (thang/dây) · stun (choáng) · dead
//   Roi là lớp phủ (whipT ≥ 0) chạy song song: vừa chạy vừa quất được (như gốc).
//   Người chơi cũng là một Thing (creature): nổ, vật ném, mũi tên, gai, quái cắn… đi qua cùng hệ sát thương với mọi sinh vật khác.

class Player extends Thing {
    constructor(x, y) {
        super(x, y, PLAYER_W, PLAYER_H, { kind: 'player', creature: true, hp: ITEM.startHp, gravity: PHYS.gravity, fallMax: PHYS.fallMax, bounceY: 0.5 });
        this.state = 'air'; this.stateT = 0;
        this.hold = null;
        this.clingCd = 0; this.weapon = null; this.boom = null; this.ammo = 0; this.gunCd = 0; this.items = {}; this.fuel = 0; this.jetOn = false; this.gliding = false; this.safe = null; this.safeAt = -9;
        this.bombs = ITEM.startBombs; this.ropes = ITEM.startRopes; this.gold = 0;
        this.dead = false; this.deadT = 0;
        this.whipT = -1; this.whipHits = null;
        this.jumpHeld = false; this.jumpT = 0;
        this.dirHeldT = 0; this.lastAx = 0; this.runHeldT = 0; this.limit = PHYS.walkMax;
        this.coyoteT = 0; this.bufferT = 0;
        this.hangCd = 0; this.ladderCd = 0; this.dropT = 0;
        this.lookT = 0; this.look = 0;        // nhìn lên/xuống: look = độ dịch camera (px, âm = lên)
        this.landT = 0;                        // vừa chạm đất (hoạt ảnh)
        this.groundY = y + PLAYER_H;            // mặt đất gần nhất đã đứng (px)
    }
    setState(s) { if (this.state !== s) { this.state = s; this.stateT = 0; } }
    placeAt(sp) { this.teleport(sp.x - this.w / 2, sp.y - this.h); this.vx = this.vy = 0; this.setState('stand'); }
    get running() {
        const key = inp.held('run');
        const want = SETTINGS.autoRun ? !key : key;
        return want && (SETTINGS.autoRun || this.runHeldT >= PHYS.runHoldT);
    }
    stun(t) {
        if (this.dead) return;
        if (this.state !== 'stun') carryDrop(this);
        this.stunT = Math.max(this.stunT, t); this.whipT = -1; this.setState('stun'); this.ignorePlat = false;
    }
    onHurt(src) {
        gearJetHit(this, src);
        if (this.hp <= 0) return;
        if (src.kind !== DMG.SPIKE) { this.blinkT = Math.max(this.blinkT, 0.5); }
    }
    die(src) {          // người chơi KHÔNG bị xoá (alive vẫn true): thành "xác" nảy theo vật lý, game đếm deadT rồi mở màn chết
        if (this.dead) return;
        if (gearRevive(this)) return;
        if (game.god) { this.hp = Math.max(this.hp, 1); this.dead = false; return; }          // phím M: bất tử thật sự (cả gai, đè, ma)
        this.dead = true; this.hp = 0; this.deadT = 0; this.whipT = -1; this.lastHurt = src;
        carryDrop(this); this.setState('dead'); this.ignorePlat = false;

    }

    update(level, dt) {
        this.timers(dt);
        this.stateT += dt;
        if (this.hangCd > 0) this.hangCd -= dt;
        if (this.clingCd > 0) this.clingCd -= dt;
        if (this.ladderCd > 0) this.ladderCd -= dt;
        if (this.dropT > 0) this.dropT -= dt;
        if (this.landT > 0) this.landT -= dt;
        if (this.dead) { this.deadT += dt; this.ragdoll(level, dt); return; }
        if (this.state === 'stun') {
            this.stunT -= dt; this.ragdoll(level, dt);
            if (this.stunT <= 0 && this.onGround) this.setState('stand');
            return;
        }
        // ---- đọc phím ----
        const ax = inp.axisX(), up = inp.held('up'), down = inp.held('down');
        if (ax !== 0 && ax === this.lastAx) this.dirHeldT += dt; else this.dirHeldT = ax !== 0 ? dt : 0;
        this.lastAx = ax;
        if (inp.held('run')) this.runHeldT += dt; else this.runHeldT = 0;
        if (inp.pressed('jump')) this.bufferT = Math.max(assistOf('buffer'), 1e-6); else if (this.bufferT > 0) this.bufferT -= dt;

        if (this.state === 'climb') this.stepClimb(level, dt, ax, up, down);
        else if (this.state === 'hang') this.stepHang(level, dt, ax, up, down);
        else if (this.state === 'cling') this.stepCling(level, dt, ax, up, down);
        else this.stepMove(level, dt, ax, up, down);

        if (this.dead || this.state === 'stun') return;
        this.actions(level, ax, up, down);

        if (this.whipBuf > 0) { this.whipBuf -= dt; if (this.whipCan() && !this.hold && this.state !== 'climb' && this.state !== 'hang' && this.state !== 'cling' && this.state !== 'stun' && !this.dead) { this.whipBuf = 0; this.whipStart(); } }
    }

    // ---- Chạy / nhảy / rơi (stand · run · duck · air) ----
    stepMove(level, dt, ax, up, down) {
        const wasGround = this.onGround;
        const duck = wasGround && down && this.whipT < 0;
        // Ngang (SC: tăng tốc khi giữ hướng > 2 khung; ma sát nhân mỗi khung; giới hạn tốc theo đi / chạy / bò)
        if (ax !== 0) this.facing = ax;
        if (wasGround) this.limit = (level.inWater(this) ? PHYS.walkMax * WATER.speed : duck ? PHYS.walkMax / 4 : this.running ? PHYS.runMax : PHYS.walkMax) * statusSpeedMul(this);     // trên không giữ giới hạn lúc rời đất (SC)
        if (ax !== 0 && this.dirHeldT > PHYS.turnDelay) {
            if (!(wasGround && this.blockedAt(level, ax))) this.vx += ax * PHYS.accel * (wasGround ? curMech().iceAccel : 1) * dt;
        }
        const fric = !wasGround ? PHYS.airFric : duck ? 0.2 : (this.running && ax !== 0) ? 0.98 : (ax === 0 && curMech().iceFric) || PHYS.groundFric;
        this.vx *= scFric(fric, dt);
        this.vx = clamp(this.vx, -this.limit, this.limit);
        if (Math.abs(this.vx) < 2 && ax === 0) this.vx = 0;
        // Xuống bục / mặt thang: giữ ↓ khi đứng trên bục một chiều (SC: rơi xuyên ngay, hoặc leo xuống nếu có thang ngay dưới)
        if (wasGround && down && this.groundTile === T_ONEWAY && this.whipT < 0) {
            if (this.tryLadderDown(level)) return;
            if (!level.isSolid(Math.floor(this.cx / TILE), Math.floor((this.y + this.h + 1) / TILE))) { this.dropT = 0.12; this.y += 1; }
        }
        // Nhảy
        if (this.coyoteT > 0) this.coyoteT -= dt;
        if (this.bufferT > 0 && (wasGround || this.coyoteT > 0) && this.dropT <= 0) {
            this.vy = PHYS.jumpV * gearJumpMul(this); this.jumpHeld = true; this.jumpT = 0; this.bufferT = 0; this.coyoteT = 0;
            this.fallT = 0; sndPlay('jump', { x: this.cx });
            if (this.onGround || wasGround) { level.spawnDust(this.cx - 4, this.y + this.h, 4, 55, 14); level.spawnDust(this.cx + 4, this.y + this.h, 4, 55, 14); }      // lần 47: bụi bốc lên lúc nhảy
        }
        if (!inp.held('jump')) this.jumpHeld = false;
        // Trọng lực: còn giữ nút nhảy thì tăng dần từ 0 lên đầy trong jumpRampT giây (SC: gravityIntensity = jumpTime/jumpTimeTotal × grav)
        this.jumpT += dt;
        const ramp = this.jumpHeld && PHYS.jumpRampT > 0 ? clamp(this.jumpT / PHYS.jumpRampT, 0, 1) : 1;
        const wet = level.inWater(this);
        if (wet) {                                        // nước (13g_water): trọng lực nhẹ, chìm chậm, chạy chậm; bấm nhảy khi lơ lửng = đạp nước
            this.vx *= scFric(WATER.fric, dt); this.fallT = 0;
            if (!this.wasWet) { level.spawnBurst(this.cx, this.y + this.h * 0.5, 6, '#9ad0ff', 70); sndPlay('rock', { x: this.cx, vol: 0.4, p: 1.8 }); }
            if (this.bufferT > 0 && !wasGround) { this.vy = WATER.stroke; this.bufferT = 0; this.jumpHeld = false; sndPlay('jump', { x: this.cx, vol: 0.5, p: 0.8 }); }
            this.vy = Math.min(this.vy + PHYS.gravity * WATER.grav * dt, WATER.fallMax);
        } else this.vy = Math.min(this.vy + PHYS.gravity * ramp * curMech().gravMul * dt, PHYS.fallMax);
        gearAir(this, level, dt, wet, wasGround);
        this.wasWet = wet;
        // Di chuyển
        this.ignorePlat = false;
        const vyBefore = this.vy;
        if (SETTINGS.assist && this.vy < 0) {                 // corner correction (Celeste)
            const ny = this.y + this.vy * dt;
            if (boxHitsSolid(level, this.x, ny, this.w, this.h)) {
                outer: for (let d = 1; d <= ASSIST.corner; d++) for (const s of [ax || 1, -(ax || 1)]) {
                    const nx = this.x + s * d;
                    if (!boxHitsSolid(level, nx, ny, this.w, this.h) && !boxHitsSolid(level, nx, this.y, this.w, this.h)) { this.x = nx; break outer; }
                }
            }
        }
        physMove(level, this, dt);
        if (this.hitU && vyBefore < 0) { this.vy = Math.abs(vyBefore) * 0.3; this.jumpHeld = false; }     // SC: đụng trần => bật xuống
        // Đếm thời gian rơi (SC: fallTimer tăng mỗi khung yVel > 0)
        if (this.onGround) {
            this.groundY = this.y + this.h;                   // mặt đất vừa đứng (để biết bậc phía trước cao mấy ô — tryHang)
            if (!wasGround) this.land(level);
            this.coyoteT = assistOf('coyote'); this.fallT = 0;
        } else if (this.vy > 0) this.fallT += dt;
        if (this.dead || this.state === 'stun') return;
        // Trạng thái
        if (this.onGround) this.setState(down && this.whipT < 0 ? 'duck' : Math.abs(this.vx) > 1 ? 'run' : 'stand');
        else this.setState('air');
        // Bám mép (trên không, đang ép vào tường) · bò qua mép thành bám (đang ngồi, ép ra mép)
        if (!this.onGround && !this.tryHang(level, ax)) this.tryCling(level, ax);
        else if (this.state === 'duck' && ax !== 0) this.tryDuckToHang(level, ax);
        // Leo thang / dây
        if (up && this.ladderCd <= 0) this.tryClimb(level, !this.onGround);
        // Nhìn lên / xuống
        this.lookStep(dt, ax, up, down);
        if (this.y > level.ph + 32) this.hurt({ kind: DMG.FALL, dmg: 99 });
    }
    // Đang đứng sát tường phía dir? (SC: đẩy tường thì không tăng tốc — tránh rung)
    blockedAt(level, dir) {
        const x = dir > 0 ? this.x + this.w + 0.5 : this.x - 0.5;
        return level.solidAt(x, this.y + 1) || level.solidAt(x, this.y + this.h - 1);
    }
    // Chạm đất: sát thương rơi theo thời gian rơi (SC: >16 khung = choáng + −1, >32 = −2, >48 = −10)
    land(level) {
        const f = this.fallT * Math.sqrt(curMech().gravMul);       // trọng lực nhẹ => rơi lâu hơn cho cùng độ cao: quy về độ cao
        if (f > PHYS.stunFallT) {
            const dmg = f > PHYS.deathFallT ? 10 : f > PHYS.hurtFall2T ? 2 : 1;
            this.hurt({ kind: DMG.FALL, dmg, x: this.cx, y: this.y + this.h });
            sndPlay('hurt', { x: this.cx }); fxShake(2, 0.2);
            level.spawnDust(this.cx - 4, this.y + this.h, 3, 40, 10); level.spawnDust(this.cx + 4, this.y + this.h, 3, 40, 10);
            if (!this.dead) { this.stun(PHYS.stunT); this.vy = -90; }
        } else if (f > 0.15) { sndPlay('land', { x: this.cx, vol: 0.6 }); level.spawnDust(this.cx - 4, this.y + this.h, 4, 45, 12); level.spawnDust(this.cx + 4, this.y + this.h, 4, 45, 12); this.landT = 0.1; }
        this.fallT = 0;
    }
    // Xác / choáng: nảy như vật (SC: dead/stunned dùng trọng lực 0.6 px/khung², nảy −0.5 khi chạm đất, ma sát 0.3)
    ragdoll(level, dt) {
        this.vy = Math.min(this.vy + ITEM.itemGravity * dt, PHYS.fallMax);
        this.ignorePlat = false;
        physMove(level, this, dt);
        if (this.hitL || this.hitR) this.vx = -this.hitVx * 0.5;
        if (this.hitU) this.vy = Math.abs(this.hitVy) * 0.8;
        if (this.onGround) {
            if (this.hitVy > 30) this.vy = -this.hitVy * 0.5;
            else { this.vx *= scFric(0.3, dt); if (Math.abs(this.vx) < 3) this.vx = 0; }
            this.fallT = 0;
        } else if (this.vy > 0) this.fallT += dt;
        if (this.y > level.ph + 32 && !this.dead) this.hurt({ kind: DMG.FALL, dmg: 99 });
    }

    // ---- Bám mép (SC: tay ở tâm−5..−6 chạm khối đặc, ô trên tay trống (tâm−9), dưới chân trống (tâm+9); không bám lại trong hangCount) ----
    tryHang(level, ax) {
        if (ax === 0 || this.hangCd > 0 || this.hold && this.hold.mass >= 2) return false;
        const hx = ax > 0 ? this.x + this.w + 1 : this.x - 1, cy = this.cy;
        if (!(ax > 0 ? this.hitR || this.blockedAt(level, 1) : this.hitL || this.blockedAt(level, -1))) return false;
        if (!(level.solidAt(hx, cy - 5) || level.solidAt(hx, cy - 6))) return false;
        if (level.solidAt(hx, cy - 9)) return false;
        if (level.solidAt(this.cx, this.y + this.h + 1)) return false;
        if (level.solidAt(this.cx, this.y - 1)) return false;
        const r = Math.floor((cy - 5) / TILE), top = r * TILE;
        if (level.isSolid(Math.floor(hx / TILE), r - 1)) return false;
        // Bậc chỉ cao 1 ô so với chỗ vừa đứng: KHÔNG bám — cú nhảy tự lên được. (SC chạy 30 khung/s nên khung nhảy đầu đã vượt qua vùng bám;
        // ở 60Hz người chơi đi qua vùng bám từng bước nhỏ nên phải chặn rõ ràng, nếu không sẽ bám mép ở bậc 1 ô — lỗi báo 2026-10-25)
        if (this.vy < 0 && this.groundY - top <= TILE + 4) return false;
        this.y = top + 8 - this.h / 2;                     // SC: move_snap(1, 8) => tâm = mặt trên mép + 8
        this.vx = this.vy = 0; this.facing = ax; this.fallT = 0; this.jumpHeld = false;
        this.setState('hang'); sndPlay('step', { x: this.cx });
        return true;
    }
    // Ngồi ở mép + ép ra ngoài => tụt xuống bám ngay mép đó, quay mặt vào tường (SC: DUCKTOHANG)
    tryDuckToHang(level, ax) {
        if (Math.abs(this.vx) > PHYS.walkMax || this.hold && this.hold.mass >= 2) return false;
        const feet = this.y + this.h + 1;
        let edgeC = Math.floor((ax > 0 ? this.x + this.w - 1 : this.x + 1) / TILE);         // ô đang đỡ chân ở phía mép
        if (!level.isSolid(edgeC, Math.floor(feet / TILE))) edgeC -= ax;                       // đã nhô quá mép một chút
        if (!level.isSolid(edgeC, Math.floor(feet / TILE))) return false;
        const outC = edgeC + ax, r = Math.floor(feet / TILE);
        if (level.isSolid(outC, r) || level.isSolid(outC, r + 1) || level.isSolid(outC, r - 1)) return false;
        // còn cách mép > 3px thì chưa (bò tiếp tới mép); đã nhô ra ngoài mép (vẫn còn chân trên đất) cũng được
        const edgeX = ax > 0 ? (edgeC + 1) * TILE : edgeC * TILE, over = ax > 0 ? this.x + this.w - edgeX : edgeX - this.x;
        if (over < -3) return false;
        if (this.hold) carryDrop(this);
        this.x = ax > 0 ? edgeX : edgeX - this.w; this.y = r * TILE + 8 - this.h / 2;
        this.vx = this.vy = 0; this.facing = -ax; this.setState('hang'); this.hangCd = 0;
        return true;
    }
    stepHang(level, dt, ax, up, down) {
        this.vx = this.vy = 0; this.fallT = 0;
        const hx = this.facing > 0 ? this.x + this.w + 1 : this.x - 1;
        if (!level.solidAt(hx, this.cy - 4) && !level.solidAt(hx, this.cy - 7)) { this.letGo(4 / 30); return; }    // mép bị phá
        if (this.bufferT > 0) {
            this.bufferT = 0;
            if (down || ax === -this.facing) { this.letGo(5 / 30); return; }          // ↓ + nhảy hoặc giữ hướng ngược lại: buông
            this.x -= this.facing * 2;                                                // SC: lùi 2px rồi nhảy lên
            this.vy = PHYS.jumpV * gearJumpMul(this); this.jumpHeld = true; this.jumpT = 0; this.hangCd = 0.15; this.limit = PHYS.walkMax;
            this.setState('air'); sndPlay('jump', { x: this.cx });
        }
    }
    // ---- Bám tường (Găng leo tường, 13m_gear): trên không ép vào tường => bám; ↑/↓ leo, nhảy = bật ra, ép hướng ngược / ↓ + nhảy = buông ----
    tryCling(level, ax) {
        if (ax === 0 || !gearHas(this, 'gloves') || this.clingCd > 0 || this.hold && this.hold.mass >= 2 || level.inWater(this)) return false;
        if (this.vy < -40) return false;                                       // đang bay lên mạnh: chưa bám (để nhảy lên dọc tường được)
        const hx = ax > 0 ? this.x + this.w + 1 : this.x - 1;
        if (!(level.solidAt(hx, this.y + 3) && level.solidAt(hx, this.y + this.h - 3))) return false;     // tường phủ cả đầu lẫn chân
        this.vx = this.vy = 0; this.facing = ax; this.fallT = 0; this.jumpHeld = false; this.limit = PHYS.walkMax;
        this.setState('cling'); sndPlay('step', { x: this.cx, vol: 0.5, p: 1.4 });
        return true;
    }
    stepCling(level, dt, ax, up, down) {
        this.fallT = 0; this.vx = 0; this.ignorePlat = false;
        const hx = this.facing > 0 ? this.x + this.w + 1 : this.x - 1;
        if (!level.solidAt(hx, this.y + 3) && !level.solidAt(hx, this.y + this.h - 3)) { this.clingCd = 0.15; this.setState('air'); return; }      // tường biến mất
        if (this.bufferT > 0) {                                                // nhảy: bật khỏi tường (↓ + nhảy: chỉ buông)
            this.bufferT = 0;
            if (down) { this.clingCd = 0.2; this.setState('air'); this.vy = 0; return; }
            this.vy = PHYS.jumpV * gearJumpMul(this); this.vx = -this.facing * GEAR.wallKick; this.facing = -this.facing; this.jumpHeld = true; this.jumpT = 0; this.clingCd = 0.25;
            this.setState('air'); sndPlay('jump', { x: this.cx }); return;
        }
        if (ax === -this.facing) { this.clingCd = 0.2; this.setState('air'); this.vy = 0; return; }       // ép hướng ngược = buông
        this.vy = up ? -GEAR.clingUp : down ? GEAR.clingDown : 0;
        if (this.vy < 0 && !level.solidAt(hx, this.y + 3)) { this.vy = 0; if (!this.tryHang(level, this.facing)) { this.clingCd = 0.2; this.setState('air'); } return; }      // lên tới đỉnh tường: bám mép / thoát
        physMove(level, this, dt);
        if (this.onGround) { this.setState('stand'); this.clingCd = 0.1; }
    }
    letGo(cd) { this.hangCd = cd; this.setState('air'); this.vy = 0; }

    // ---- Thang / dây ----
    climbColAt(level, x, y) { const c = Math.floor(x / TILE), r = Math.floor(y / TILE); return level.isClimb(c, r) ? c : -1; }
    tryClimb(level, inAir) {
        const cy = this.cy;
        let c = this.climbColAt(level, this.cx, cy);
        if (c < 0 && inAir) c = this.climbColAt(level, this.cx, cy - 8);
        if (c < 0) return false;
        const mid = c * TILE + TILE / 2;
        if (Math.abs(this.cx - mid) >= 5) return false;                  // SC: |x − tâm thang| < 4
        if (this.hold && this.hold.mass >= 1) carryDrop(this);           // tay đang cầm vật vừa/nặng thì đánh rơi (SC: leo cần 2 tay; vật nhẹ như mũi tên vẫn giữ)
        this.x = mid - this.w / 2; this.vx = this.vy = 0; this.fallT = 0; this.jumpHeld = false;
        this.setState('climb'); this.ignorePlat = true;
        return true;
    }
    tryLadderDown(level) {
        const c = Math.floor(this.cx / TILE), r = Math.floor((this.y + this.h + 1) / TILE);
        if (!level.isClimb(c, r)) return false;
        const mid = c * TILE + TILE / 2;
        if (Math.abs(this.cx - mid) >= 5) return false;
        this.x = mid - this.w / 2; this.y += 2; this.vx = this.vy = 0;
        this.setState('climb'); this.ignorePlat = true;
        return true;
    }
    stepClimb(level, dt, ax, up, down) {
        this.ignorePlat = true; this.fallT = 0; this.vx = 0;
        if (ax !== 0) this.facing = ax;
        const cx = this.cx, cy = this.cy;
        if (!level.isClimb(Math.floor(cx / TILE), Math.floor(cy / TILE)) && !level.isClimb(Math.floor(cx / TILE), Math.floor((cy + 8) / TILE))) { this.setState('air'); this.ignorePlat = false; return; }
        if (up) {
            if (level.isClimb(Math.floor(cx / TILE), Math.floor((cy - 8) / TILE))) this.vy = -PHYS.climbSpeed;
            else {
                this.vy = 0;
                // đỉnh thang: bước lên đứng trên mặt thang (tiện hơn bản gốc phải nhảy; dây thì không có mặt đứng)
                const c = Math.floor(cx / TILE), r = Math.floor(cy / TILE);
                if (level.isLadderTop(c, r) && !boxHitsSolid(level, this.x, r * TILE - this.h, this.w, this.h)) { this.y = r * TILE - this.h; this.setState('stand'); this.ignorePlat = false; this.ladderCd = 0.25; return; }
            }
        } else if (down) {
            if (level.isClimb(Math.floor(cx / TILE), Math.floor((cy + 8) / TILE))) this.vy = PHYS.climbSpeed;
            else { this.setState('air'); this.ignorePlat = false; this.vy = 0; return; }        // SC: hết thang bên dưới => rơi
        } else this.vy = 0;
        physMove(level, this, dt);
        if (down && this.onGround && level.isSolid(Math.floor(cx / TILE), Math.floor((this.y + this.h + 1) / TILE))) { this.setState('stand'); this.ignorePlat = false; return; }
        if (this.bufferT > 0) {          // nhảy khỏi thang (SC: departLadderXVel 4, departLadderYVel −4)
            this.bufferT = 0;
            this.vx = ax * PHYS.ladderJumpVx; this.vy = PHYS.ladderJumpV; this.jumpHeld = true; this.jumpT = 0; this.limit = this.running ? PHYS.runMax : PHYS.walkMax;
            this.ladderCd = 5 / 30; this.setState('air'); this.ignorePlat = false; sndPlay('jump', { x: this.cx });
        }
    }

    // ---- Nhìn lên / xuống (SC: đứng yên giữ ↑/↓ 30 khung rồi camera dịch 4 px/khung) ----
    lookStep(dt, ax, up, down) {
        const still = this.onGround && ax === 0 && Math.abs(this.vx) < 1 && (up !== down);
        if (still) this.lookT += dt; else this.lookT = 0;
        if (this.lookT > PHYS.lookDelay) this.look = clamp(this.look + (up ? -1 : 1) * PHYS.lookSpeed * dt, -PHYS.lookMax, PHYS.lookMax);
        else this.look = approach(this.look, 0, PHYS.lookSpeed * 2 * dt);
    }

    // ---- Hành động: roi / nhặt / ném / bom / dây ----
    actions(level, ax, up, down) {
        if (this.hold && !this.hold.alive) this.hold = null;
        const canAct = this.state !== 'climb' || this.hold;
        if (inp.pressed('use')) {                               // nút "dùng": mở thùng > đặt đồ đang cầm > nhặt đồ dưới chân
            const cr = this.hold && this.hold.kind === 'crate' ? this.hold : thingsWhere(e => e.kind === 'crate' && !e.holder && overlapBox(e, { x: this.x - 4, y: this.y, w: this.w + 8, h: this.h }))[0];
            if (cr) cr.open(this);
            else if (this.hold) carryThrow(this, this.hold, false, this.onGround);
            else carryPick(this, carryFind(this));
            return;
        }
        if (inp.pressed('attack') && up) {                      // ↑ + X: mở thùng đang cầm hoặc thùng dưới chân (SC)
            const cr = this.hold && this.hold.kind === 'crate' ? this.hold : thingsWhere(e => e.kind === 'crate' && !e.holder && overlapBox(e, { x: this.x - 4, y: this.y, w: this.w + 8, h: this.h }))[0];
            if (cr) { cr.open(this); return; }
        }
        if (inp.pressed('attack')) {
            if (this.hold) {
                carryThrow(this, this.hold, up, down);          // lần 29: đang nhảy/rơi + ↓ = ném THẲNG XUỐNG (đá trúng quái ngay bên dưới)
                this.whipT = -1;
            } else if (down && this.onGround) {
                carryPick(this, carryFind(this));
            } else if (down && !this.onGround && this.state === 'air' && this.whipT < 0) {
                pogoStart(this);
            } else if (this.weapon === 'boomerang' && !this.boom && this.state !== 'climb' && this.state !== 'hang' && this.state !== 'cling') {
                weaponThrowBoom(this);
            } else if (this.weapon === 'shotgun' && this.state !== 'climb' && this.state !== 'hang' && this.state !== 'cling') {
                weaponFire(this, level);
            } else if (this.state !== 'climb' && this.state !== 'hang' && this.state !== 'cling') {
                if (this.whipCan()) this.whipStart(); else this.whipBuf = WHIP.buffer;
            }
        }
        if (inp.pressed('bomb') && this.bombs > 0 && this.whipT < 0) {
            this.bombs--;
            const b = new Bomb(this.cx - 4, this.cy - 4); b.light();
            entAdd(b); carryThrow(this, b, up, down);
        }
        if (inp.pressed('rope') && this.ropes > 0 && this.whipT < 0 && canAct !== false) {
            if (ropeThrow(level, this, down)) this.ropes--;
        }
    }
    whipCan() { return this.whipT < 0 || this.whipT >= WHIP.hitStart + WHIP.recover; }
    whipStart() { this.whipT = 0; this.whipHits = new Set(); this.whipBuf = 0; sndPlay('swing', { x: this.cx }); }
    // Hộp đòn roi hiện tại (null nếu không có): trước mặt (đòn chính) hoặc sau lưng (vung sau)
    whipBox() {
        if (this.whipT < 0) return null;
        const f = this.facing, cx = this.cx, cy = this.cy;
        if (this.whipT < WHIP.preEnd) {
            const x0 = f > 0 ? cx + WHIP.bx0 : cx - WHIP.bx1, x1 = f > 0 ? cx + WHIP.bx1 : cx - WHIP.bx0;
            return { x: x0, y: cy + WHIP.by0, w: x1 - x0, h: WHIP.by1 - WHIP.by0, front: false };
        }
        if (this.whipT >= WHIP.hitStart) {
            const rch = this.weapon === 'machete' ? WPN.macheteReach : 0, x0 = f > 0 ? cx - WHIP.near : cx - WHIP.fx1 - rch, x1 = f > 0 ? cx + WHIP.fx1 + rch : cx + WHIP.near;
            return { x: x0, y: cy + WHIP.fy0, w: x1 - x0, h: WHIP.fy1 - WHIP.fy0, front: true };
        }
        return null;
    }

    // ---- Vẽ (hình tạm 16×16 tự vẽ: nhà thám hiểm đội mũ; sprite thật ở GĐ8) ----
    draw(ctx, alpha) {
        if (this.blinkT > 0 && !this.dead && Math.floor(this.blinkT * 20) % 2) return;
        if (typeof drawHeroHp === 'function') { drawHeroHp(this, ctx, alpha); return; }          // vẽ nửa-pixel (06c_sprites); bản 1px bên dưới là dự phòng
        const x = Math.round(this.drawX(alpha) + this.w / 2), y = Math.round(this.drawY(alpha) + this.h);   // gốc = giữa chân
        const f = this.facing, s = this.state, t = game.time;
        const px = (dx, dy, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(f > 0 ? x + dx : x - dx - w, y + dy, w, h); };
        const SKIN = '#f2c59a', HAT = '#b5793a', HAT2 = '#8a5626', SHIRT = '#3f78c8', PANTS = '#5a4632', BOOT = '#2a1e16', EYE = '#1a1220';
        if (s === 'dead') {          // nằm ngang
            ctx.fillStyle = SHIRT; ctx.fillRect(x - 7, y - 5, 10, 4); ctx.fillStyle = SKIN; ctx.fillRect(x + 3 * (f > 0 ? 1 : -1) - 2, y - 6, 5, 5);
            ctx.fillStyle = PANTS; ctx.fillRect(x - 8, y - 4, 3, 3); ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 3 * (f > 0 ? 1 : -1) - 1, y - 5, 1, 1); ctx.fillRect(x + 3 * (f > 0 ? 1 : -1) + 1, y - 5, 1, 1);
            return;
        }
        const duck = s === 'duck', crouch = duck ? 4 : 0;
        const run = s === 'run' ? Math.floor(t * 12) % 4 : 0;
        // chân
        if (s === 'climb') { const k = Math.floor(this.y / 5) % 2; px(-4, -4 - k * 2, 3, 4, PANTS); px(1, -4 - (1 - k) * 2, 3, 4, PANTS); px(-4, -1 - k * 2, 3, 1, BOOT); px(1, -1 - (1 - k) * 2, 3, 1, BOOT); }
        else if (s === 'air' || s === 'hang' || s === 'cling') { px(-3, -5, 3, 3, PANTS); px(1, -4, 3, 3, PANTS); px(-3, -2, 3, 2, BOOT); px(2, -1, 3, 1, BOOT); }
        else { const a = run === 1 ? 1 : run === 3 ? -1 : 0; px(-3 + a, -4, 3, 3, PANTS); px(1 - a, -4, 3, 3, PANTS); px(-4 + a, -1, 4, 1, BOOT); px(1 - a, -1, 4, 1, BOOT); }
        // thân
        px(-4, -10 + crouch, 8, 6 - (duck ? 0 : 0), SHIRT); px(-4, -5 + crouch, 8, 1, '#2a5294');
        // đầu
        px(-3, -14 + crouch, 7, 5, SKIN); px(2, -12 + crouch, 1, 1, EYE);
        px(-4, -15 + crouch, 9, 2, HAT); px(-6, -13 + crouch, 13, 1, HAT2); px(-2, -16 + crouch, 5, 1, HAT);
        // tay
        if (s === 'hang') { px(3, -16, 2, 4, SKIN); }
        else if (s === 'cling') { px(3, -13, 3, 4, SKIN); px(3, -8, 3, 3, SKIN); }
        else if (s === 'climb') { px(-5, -13, 2, 3, SKIN); px(4, -11, 2, 3, SKIN); }
        else if (this.whipT >= 0) {
            const front = this.whipT >= WHIP.hitStart;
            px(front ? 4 : -6, -9 + crouch, 2, 2, SKIN);
            ctx.fillStyle = '#7a4a22';
            if (front) { const k = clamp((this.whipT - WHIP.hitStart) / 0.08, 0, 1); ctx.fillRect(f > 0 ? x + 6 : x - 6 - Math.round(17 * k), y - 9 + crouch, Math.round(17 * k), 1); }
            else ctx.fillRect(f > 0 ? x - 20 : x + 6, y - 14 + crouch, 14, 1);
        } else px(3, -8 + crouch, 2, 3, SKIN);
        if (s === 'stun') {         // sao quay quanh đầu
            for (let i = 0; i < 3; i++) { const a = t * 6 + i * TAU / 3; ctx.fillStyle = '#ffe86a'; ctx.fillRect(Math.round(x + Math.cos(a) * 6), Math.round(y - 18 + Math.sin(a) * 2), 1, 1); }
        }

}

// ---- Roi trúng mục tiêu (gọi từ dmgStep, 10a_damage). Mỗi nhát trúng mỗi mục tiêu tối đa 1 lần ----
function playerWhipStep(level) {
    const p = game.player; if (!p || p.dead) return;
    const b = p.whipBox(); if (!b) return;
    for (const e of game.entities) {
        if (e === p || !e.alive || e.holder || p.whipHits.has(e)) continue;
        if (!(e.creature || e.breakOnImpact)) continue;
        if (!overlapBox(b, e)) continue;
        p.whipHits.add(e);
        if (e.hurt({ kind: DMG.WHIP, dmg: p.weapon === 'machete' ? WPN.macheteDmg : WHIP.dmg, x: p.cx, y: p.cy, by: p })) {
            e.vx += p.facing * 60; sndPlay('hit', { x: e.cx });
            level.spawnBurst(e.cx, e.cy, 4, e.creature ? '#d23a3a' : e.col, 70);
        }
    }
}

// 10a_damage — NGUỒN SÁT THƯƠNG CHUNG + vụ nổ + va chạm vật bay (roadmap mục 3.2–3.3).
//   Sát thương chỉ biết NGUỒN (DMG.*), không biết ai gây ra => "ném đá vào dơi trượt trúng chủ cửa hàng" tự xảy ra, không cần luật riêng.
//   Mỗi bước (16_gameloop → dmgStep): vật bay trúng sinh vật / vật vỡ được · quái chạm người chơi · roi · đạp đầu (09_player) · gai (dmgSpikes).
//   Vụ nổ: explode(level, x, y) — phá ô trong bán kính, sát thương + hất văng mọi Thing, bom gần đó nổ dây chuyền.

const DMG = { EXPLOSION: 'explosion', FALL: 'fall', IMPACT: 'impact', WHIP: 'whip', STOMP: 'stomp', SPIKE: 'spike', CRUSH: 'crush', ARROW: 'arrow', FIRE: 'fire', BITE: 'bite', GHOST: 'ghost', BOSS: 'boss' };
const DMG_ALL = Object.keys(DMG).map(k => DMG[k]);
// Tên nguồn để hiện "chết vì …" (màn kết ván GĐ4; hiện tạm ở chữ chết GĐ1)
const DMG_NAMES = { explosion: 'bị nổ', fall: 'rơi quá cao', impact: 'bị vật ném trúng', whip: 'bị quất roi', stomp: 'bị giẫm', spike: 'rơi vào gai', crush: 'bị đè', arrow: 'trúng mũi tên', fire: 'bị cháy', bite: 'bị cắn', ghost: 'bị ma bắt', boss: 'trúng đòn của boss' };
function dmgCauseText(src) {
    if (!src) return 'không rõ';
    let s = DMG_NAMES[src.kind] || src.kind;
    if (src.by && src.by.kind && (src.kind === DMG.BITE || src.kind === DMG.IMPACT || src.kind === DMG.BOSS)) s += ' (' + (THING_NAMES[src.by.kind] || src.by.kind) + ')';
    return s;
}
const THING_NAMES = { key: 'chìa khoá', spider: 'nhện', warden: 'Vệ binh đá', queen: 'Bà chúa pha lê', titan: 'Titan núi lửa', wave: 'sóng đất', fallrock: 'đá rơi', shard: 'mảnh tinh thể', spitter: 'quái phun lửa', fireball: 'cầu lửa', walker: 'bọ đá', hopper: 'bọ nhảy', chaser: 'quái đuổi', rusher: 'quái húc', guard: 'lính khiên', shooter: 'xạ thủ', mortar: 'pháo thủ', flyer: 'quái bay', diver: 'quái lao', bolt: 'đạn', shell: 'đạn pháo', snake: 'rắn', bat: 'dơi', rock: 'đá', pot: 'bình', arrow: 'mũi tên', bomb: 'bom', player: 'chính mình', gold: 'vàng', princess: 'công chúa', goods: 'hàng', ghost: 'con ma', shopkeeper: 'chủ cửa hàng', pellet: 'đạn chủ cửa hàng' };

// ---- Vụ nổ (SC: oExplosion 48×48, quái −30 máu, người chơi −10 máu + choáng, văng rand(4,6) px/khung ngang, −6 lên) ----
function explode(level, x, y) {
    const R = ITEM.blastR;
    // 1. Phá ô: mọi ô có hình vuông chạm vòng tròn bán kính R
    const c0 = Math.floor((x - R) / TILE), c1 = Math.floor((x + R) / TILE), r0 = Math.floor((y - R) / TILE), r1 = Math.floor((y + R) / TILE);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
        const nx = clamp(x, c * TILE, (c + 1) * TILE), ny = clamp(y, r * TILE, (r + 1) * TILE);
        if ((nx - x) * (nx - x) + (ny - y) * (ny - y) < R * R) level.breakAt(c, r);
    }
    level.settleAfterBlast(c0 - 1, r0 - 1, c1 + 1, r1 + 2);
    // 2. Mọi Thing chạm vùng nổ: sát thương + văng. Bom khác: châm ngòi ngắn (nổ dây chuyền)
    for (const e of game.entities) {
        if (!e.alive) continue;
        const nx = clamp(x, e.x, e.x + e.w), ny = clamp(y, e.y, e.y + e.h);
        if ((nx - x) * (nx - x) + (ny - y) * (ny - y) >= R * R) continue;
        const dir = e.cx < x ? -1 : 1, kv = ITEM.blastKnockVx * game.rngPlay.range(0.67, 1);
        if (e.holder) e.release();
        if (e.kind === 'oil') { oilIgnite(e); continue; }
        if (e instanceof Bomb) { e.chain(); e.knock(dir * kv, ITEM.blastKnockVy); continue; }
        e.hurt({ kind: DMG.EXPLOSION, dmg: e.creature ? (e === game.player ? ITEM.blastDmg : 30) : 99, x, y });
        if (e.alive) { e.knock(dir * kv, ITEM.blastKnockVy); if (e === game.player && !e.dead) e.stun(100 / 30); }
    }
    // 3. Hình + tiếng
    level.spawnBurst(x, y, 18, '#ffb347', 220); level.spawnBurst(x, y, 10, '#ffe9a8', 140); level.spawnBurst(x, y, 8, '#6a6a6a', 90);
    fxBlast(x, y);
    sndPlay('boom', { x });
    fxShake(5, 0.35);
}

// ---- Vật bay trúng mục tiêu (SC: oItem |vel| > 2 px/khung trúng quái: quái −1 máu, quái nhận 0.3 vận tốc vật) ----
function dmgImpacts(level) {
    const ents = game.entities;
    for (const p of ents) {
        if (!p.alive || p.holder || !p.hurtsOnImpact || p.speed < ITEM.impactSpeed) continue;
        for (const t of ents) {
            if (t === p || !t.alive || t.holder === p || p.holder === t) continue;
            if (!(t.creature || t.breakOnImpact)) continue;
            if (t === p.thrower && p.safeT > 0) continue;
            if (t.holder && t.holder === p.thrower) continue;          // vật người ném đang cầm
            if (p.hitSet && p.hitSet.has(t)) continue;
            if (TRAP.duckSafe && p.kind === 'arrow' && p.flying && t === game.player && t.state === 'duck') continue;     // cúi xuống: tên bay qua đầu
            if (!overlapBox(p, t)) continue;
            (p.hitSet || (p.hitSet = new Set())).add(t);
            const kind = p.kind === 'arrow' ? DMG.ARROW : DMG.IMPACT;
            if (t.hurt({ kind, dmg: p.impactDmg, x: p.cx, y: p.cy, vx: p.vx, by: p })) {
                t.vx += p.vx * 0.3; if (t === game.player && !t.dead) t.stun(1);
                sndPlay('hit', { x: t.cx });
                level.spawnBurst(t.cx, t.cy, 4, t.creature ? '#d23a3a' : t.col, 80);
                p.vx *= -0.3; p.vy = Math.min(p.vy, -60);
                if (p.onHitTarget) p.onHitTarget(level, t);
            }
        }
    }
}

// ---- Gai (SC: sinh vật đang rơi chạm hộp gai và đã rơi > 4 khung hoặc đang choáng => chết) ----
function dmgSpikes(level) {
    for (const e of game.entities) {
        if (!e.alive || !e.creature || e.holder || e.vy <= 0) continue;
        if (!(e.fallT > PHYS.spikeFallT || e.stunT > 0)) continue;
        const c0 = Math.floor((e.cx - 4) / TILE), c1 = Math.floor((e.cx + 4) / TILE), r0 = Math.floor((e.y + e.h - 8) / TILE), r1 = Math.floor((e.y + e.h) / TILE);
        let hit = false;
        for (let r = r0; r <= r1 && !hit; r++) for (let c = c0; c <= c1; c++) if (level.tile(c, r) === T_SPIKE && e.y + e.h > r * TILE + 6) { hit = true; break; }
        if (hit) { e.invulnT = 0; if (e.hurt({ kind: DMG.SPIKE, dmg: 99, x: e.cx, y: e.y + e.h })) { e.vx = 0; e.vy = 0; level.spawnBurst(e.cx, e.y + e.h, 8, '#d23a3a', 60); sndPlay('spike', { x: e.cx }); } }
    }
}

// ---- Quái chạm người chơi (SC: oEnemy Collision_oCharacter): từ trên xuống = bị đạp; ngang = người chơi bị cắn, choáng ngắn, bất tử 1s ----
function dmgContacts(level) {
    const p = game.player; if (!p || p.dead) return;
    for (const e of game.entities) {
        if (!e.alive || !(e instanceof Enemy) || e.holder || e.harmless || !overlapBox(p, e)) continue;
        // Đạp đầu: người chơi đang rơi và chân ở nửa trên của quái
        if (p.vy > 0 && p.py + p.h <= e.py + e.h * 0.5 + 2) {
            const dmg = (Math.floor(p.fallT / PHYS.stunFallT) + 1) * (gearHas(p, 'spike') ? GEAR.spikeStomp : 1);   // SC: hp −= 1 × (floor(fallTimer/16) + 1)
            if (e.hurt({ kind: DMG.STOMP, dmg, x: p.cx, y: p.y + p.h, by: p })) {
                p.vy = ITEM.stompVy - 0.2 * p.vy; p.fallT = 0; p.jumpHeld = false;
                sndPlay('hit', { x: e.cx }); level.spawnBurst(e.cx, e.y, 5, '#d23a3a', 70);
            }
            continue;
        }
        if (p.invulnT > 0 || e.stunT > 0 || e.dmg <= 0) continue;
        if (p.hurt({ kind: DMG.BITE, dmg: e.dmg, x: e.cx, y: e.cy, by: e })) {
            p.invulnT = 1; p.blinkT = 1;                                   // SC: invincible = 30 khung
            p.knock((p.cx < e.cx ? -1 : 1) * 180, -120);                    // SC: xVel ±6
            if (!p.dead) p.stun(0.4);
            sndPlay('hurt', { x: p.cx }); fxShake(2, 0.15);
            const st = statusOf(e); if (st && !p.dead) statusApply(p, st);
        }
    }
}

function dmgStep(level) {
    dmgImpacts(level);
    dmgContacts(level);
    playerWhipStep(level);
    dmgSpikes(level);
}

// ---- Hiệu ứng nhỏ dùng chung (thay 10_combat cũ) ----
function fxShake(amp, t) {
    if (SETTINGS.shake === false) return;
    if (typeof gpadRumble === 'function') gpadRumble(amp / 6, t * 1000);
    if (amp >= game.shakeAmp || game.shakeT <= 0) { game.shakeAmp = amp; game.shakeT = t; game.shakeDur = t; }
}
function fxBlast(x, y) { game.blasts.push({ x, y, t: 0 }); }

// 10b_carry — NHẶT / MANG / NÉM / ĐẶT XUỐNG (dùng cho mọi Thing có carryable: đá, bình, bom, mũi tên… GĐ6: xác quái, người bị nạn).
//   SC: ngồi (↓) + nút hành động (X) để nhặt vật dưới chân (hộp x−8..x+8, y..y+8 quanh tâm người chơi).
//       Đang cầm: X = ném (ngang ±8 px/khung + vận tốc người chơi, −3 lên; giữ ↑ = −9 lên; giữ ↓ trên đất = đặt nhẹ xuống).
//       Bị choáng / chết thì đánh rơi vật đang cầm (vật văng theo vận tốc người chơi, −6 lên).

// Tìm vật nhặt được gần chân người chơi p nhất
function carryFind(p) {
    const box = { x: p.cx - 9, y: p.cy, w: 18, h: p.h / 2 + 2 };
    let best = null, bd = 1e9;
    for (const e of game.entities) {
        if (!e.alive || e.holder || e === p) continue;
        if (!e.carryable && !carryableFoe(e)) continue;
        if (!overlapBox(box, e)) continue;
        const d = Math.abs(e.cx - p.cx) + Math.abs(e.cy - p.cy);
        if (d < bd) { bd = d; best = e; }
    }
    return best;
}
// Quái đang CHOÁNG (stunT > 0.25) nhấc được như một vật; không nhấc boss / chủ cửa hàng / thứ không phải Enemy
function carryableFoe(e) { return e instanceof Enemy && e.kind !== 'shopkeeper' && e.stunT > 0.25 && !e.air; }
function carryPick(p, t) {
    if (!t || t.holder) return false;
    p.hold = t; t.holder = p; t.thrower = null; t.vx = t.vy = 0; t.hitSet = null;
    if (t.onPicked) t.onPicked(p);
    sndPlay('ui', { x: p.cx });
    return true;
}
// Ném vật t khỏi tay p (cũng dùng để ném bom vừa lấy ra: bom không qua bước "cầm")
function carryThrow(p, t, up, down) {
    if (t.holder) t.release();
    t.thrower = p; t.safeT = 10 / 30; t.hitSet = null;
    // đặt vật ra trước mặt, không chui vào tường
    let x = p.cx + p.facing * 4 - t.w / 2, y = p.y + 2;
    const level = game.level;
    if (boxHitsSolid(level, x, y, t.w, t.h)) x = p.cx - t.w / 2;
    if (boxHitsSolid(level, x, y, t.w, t.h)) y = p.y + p.h - t.h;
    t.teleport(x, y);
    if (down && p.onGround) { t.vx = p.facing * ITEM.throwVx * 0.1; t.vy = 0; t.teleport(x, p.y + p.h - t.h); }   // đặt nhẹ xuống
    else {
        t.vx = p.facing * ITEM.throwVx * (gearHas(p, 'mitt') ? GEAR.mittThrow : 1) + p.vx;
        t.vy = up ? ITEM.throwUpVy : down ? (p.onGround ? ITEM.dropVy : ITEM.throwDownVy) : ITEM.throwVy * (gearHas(p, 'mitt') ? GEAR.mittArc : 1);      // găng ném: nhanh hơn VÀ phẳng hơn (ném gần như thẳng ngang)
        if (down) t.vx *= 0.1;
    }
    if (t.onThrown) t.onThrown(p);
    sndPlay('rock', { x: p.cx });
}
// Đánh rơi (choáng / chết): vật văng nhẹ theo người
function carryDrop(p) {
    const t = p.hold; if (!t) return;
    t.release(); t.thrower = p; t.safeT = 0.3; t.vx = p.vx; t.vy = -180;
}

// 10c_status — TRẠNG THÁI (GĐ6c; chuyển từ Metroidvania reserve/mv_stash.js khối 7): độc · cháy · chậm · choáng, gắn lên người chơi bởi quái "nguyên tố".
//   Nguyên tố theo vùng (ZONES[].elem): Rừng sâu = độc · Hang pha lê = chậm · Tàn tích = cháy. Quái có ENEMY_DEFS.elemental dùng nguyên tố của vùng; quái có def.status dùng riêng (quái phun lửa luôn cháy).
//   Gắn khi đòn của quái TRÚNG (chạm, đạn, đạn pháo, cầu lửa). Độc/cháy trừ 1 máu theo nhịp nhưng KHÔNG giết (dừng ở 1 máu, STATUS.lethal = false — bật true để thử khó hơn). Chậm: tốc đi ×0,6.
//   Nước dập lửa và rửa độc. Sinh ra từ dự án cũ: số liệu giữ nguyên.
const ELEMENTS = {
    poison: { name: 'Độc', col: '#7be06a' }, burn: { name: 'Cháy', col: '#ff9a4a' }, slow: { name: 'Chậm', col: '#6fa8ff' },
    shock: { name: 'Giật', col: '#ffe45a' }, stun: { name: 'Choáng', col: '#c070ff' }
};
function elemCol(el) { return el && ELEMENTS[el] ? ELEMENTS[el].col : null; }
const STATUS = {
    slow: { dur: 2.5, runMul: 0.6 },
    poison: { dur: 4.6, tick: 1.5, dmg: 1 },
    burn: { dur: 1.9, tick: 0.9, dmg: 1 },
    stun: { dur: 0.6, imm: 2.0 },
    shock: { dur: 2.5 },
    lethal: false
};
const STATUS_ORDER = ['stun', 'shock', 'burn', 'poison', 'slow'];
const STATUS_SND = { poison: 'st_poison', burn: 'st_burn', slow: 'st_slow', stun: 'st_stun', shock: 'st_shock' };
function statusInit(p) { if (!p.st) { p.st = {}; p.stTick = {}; p.stImm = 0; } }
function statusActive(p, kind) { return !!p.st && p.st[kind] > 0; }
function statusAny(p) { for (const k of STATUS_ORDER) if (statusActive(p, k)) return true; return false; }
// Trạng thái mà quái `e` gây ra trong level hiện tại (null = không có)
function statusOf(e) {
    const d = e && e.def; if (!d) return null;
    if (d.status) return d.status;
    return d.elemental ? (zoneOf(game.levelIdx).elem || null) : null;
}
function statusApply(p, kind) {
    const S = STATUS[kind]; if (!S || typeof S !== 'object' || !p || p.dead) return false;
    statusInit(p);
    if (kind === 'stun' && p.stImm > 0) return false;
    const first = !(p.st[kind] > 0);
    p.st[kind] = Math.max(p.st[kind] || 0, S.dur);
    if (S.tick && first) p.stTick[kind] = S.tick;
    if (kind === 'stun') { p.stun(S.dur); }
    const c = elemCol(kind) || '#fff';
    game.level.spawnBurst(p.cx, p.cy - 2, 10, c, 90);
    sndPlay(STATUS_SND[kind] || 'ui', { x: p.cx });
    return true;
}
function statusClear(p) { if (p) { p.st = {}; p.stTick = {}; } }
// Một bước (stepGame): hết giờ, nhịp trừ máu, nước dập lửa/rửa độc
function statusStep(L, p) {
    if (!p || p.dead || !p.st) return;
    const dt = STEP;
    if (p.stImm > 0) p.stImm = Math.max(0, p.stImm - dt);
    if (L.inWater(p)) { if (p.st.burn > 0 || p.st.poison > 0) { p.st.burn = 0; p.st.poison = 0; L.spawnBurst(p.cx, p.cy, 6, '#cfe8ff', 60); sndPlay('rock', { x: p.cx, vol: 0.3, p: 2 }); } }
    for (const kind of STATUS_ORDER) {
        if (!(p.st[kind] > 0)) continue;
        const S = STATUS[kind];
        p.st[kind] -= dt;
        if (S.tick) {
            p.stTick[kind] -= dt;
            if (p.stTick[kind] <= 0 && p.st[kind] > 0.05) {
                p.stTick[kind] += S.tick;
                if (p.hp > 1 || STATUS.lethal) {
                    p.hp -= S.dmg; p.lastHurt = { kind: DMG.FIRE, dmg: S.dmg }; sndPlay('st_tick', { x: p.cx, p: kind === 'burn' ? 1.2 : 0.9 }); p.blinkT = 0.25;
                    if (p.hp <= 0) p.hurt({ kind: kind === 'burn' ? DMG.FIRE : DMG.BITE, dmg: 99 });
                }
            }
        }
        if (game.rngFx.next() < dt * 14) L.spawnBurst(p.cx + (game.rngFx.next() - 0.5) * 8, p.cy + (game.rngFx.next() - 0.5) * 12, 1, elemCol(kind), 35);
        if (p.st[kind] <= 0) { p.st[kind] = 0; if (kind === 'stun') p.stImm = S.imm; }
    }
}
// Hệ số tốc đi do trạng thái (chậm)
function statusSpeedMul(p) { return statusActive(p, 'slow') ? STATUS.slow.runMul : 1; }
function statusDrawHero(alpha) {
    const p = game.player; if (!p || p.dead || !statusAny(p)) return;
    const x = Math.round(p.drawX(alpha)), y = Math.round(p.drawY(alpha)), kinds = STATUS_ORDER.filter(k => statusActive(p, k)), x0 = x + p.w / 2 - kinds.length * 2.5;
    kinds.forEach((k, i) => { ctx.fillStyle = '#000'; ctx.fillRect(Math.round(x0 + i * 5) - 1, y - 9 + Math.round(Math.sin(game.time * 6 + i)), 5, 5); ctx.fillStyle = elemCol(k); ctx.fillRect(Math.round(x0 + i * 5), y - 8 + Math.round(Math.sin(game.time * 6 + i)), 3, 3); });
}
function statusDrawHud(y) {
    const p = game.player; if (!p || p.dead || !p.st) return y;
    for (const k of STATUS_ORDER) {
        if (!statusActive(p, k)) continue;
        const c = elemCol(k), frac = clamp(p.st[k] / STATUS[k].dur, 0, 1);
        ctx.fillStyle = '#000'; ctx.fillRect(5, y - 1, 7, 7); ctx.fillStyle = c; ctx.fillRect(6, y, 5, 5);
        drawText(ELEMENTS[k].name, 15, y - 2, c);
        ctx.fillStyle = '#000'; ctx.fillRect(53, y + 1, 26, 4); ctx.fillStyle = c; ctx.fillRect(54, y + 2, Math.round(24 * frac), 2);
        y += 9;
    }
    return y;
}

const CORPSE_LEN = { bat: 0.5 };      // lần 48: chỉ dơi tím nhỏ → xác ngắn; các quái khác giữ xác đầy đủ
// 11_enemies — quái (GĐ1: 2 loại đầu để thử tương tác; đủ bộ vùng 1 ở GĐ4/GĐ6). Mọi quái là Thing (creature) => chịu chung nguồn sát thương.
//   Chiến đấu kiểu Spelunky (D3): quái thường 1 máu, chết sau 1 đòn roi / 1 lần đạp / 1 vật ném; KHÔNG có điềm báo dài, hitstop hay đẩy lùi kiểu Hollow Knight.
//   Rắn (SC oSnake): bò 1 px/khung (30 px/s), quay đầu ở tường và mép vực, thỉnh thoảng đứng nghỉ (SC: 1/100 mỗi khung, nghỉ 20–50 khung).
//   Dơi (SC oBat): treo dưới trần; người chơi trong 90px VÀ ở thấp hơn => bay về phía người chơi (1 px/khung theo hướng tới người chơi) khi trong 160px; xa thì bay lên treo lại.

// Thêm thực thể vào level đang chơi
function entAdd(e) { game.entities.push(e); return e; }

class Enemy extends Thing {
    constructor(type, x, y) {
        const d = ENEMY_DEFS[type];
        super(x, y, d.w, d.h, { kind: type, creature: true, hp: d.hp, col: d.col, gravity: ITEM.itemGravity, fallMax: 300 });
        this.type = type; this.def = d; this.dmg = d.dmg;
        this.facing = game.rngPlay.sign();
    }
    get wriggles() { return true; }          // quái bị bế sẽ giãy ra (công chúa / thú cưng thì không)
    onThrown(p) { this.stunT = Math.max(this.stunT, 1.2); this.hurtsOnImpact = true; this.impactDmg = 1; this.thrownT = 0.6; }
    onDie(src) {
        const L = game.level;
        L.spawnBurst(this.cx, this.cy, 10, '#d23a3a', 110); L.spawnBurst(this.cx, this.cy, 5, this.col, 80);
        sndPlay('enemyDie', { x: this.cx }); if (game.stats) game.stats.kills++;
        if (!this.isBoss && this.kind !== 'shopkeeper' && game.rngPlay) {        // lần 29/30: giết quái đôi khi rơi vàng, TOÉ ra về một bên
            const thrown = src && (src.kind === DMG.IMPACT || src.kind === DMG.ARROW), R = game.rngPlay;
            if (R.next() < LOOT.chance * (thrown ? LOOT.thrownMul : 1)) {
                const side = R.next() < 0.5 ? -1 : 1, g = entAdd(new Gold(this.cx - 2 + side * 6, this.cy - 4, LOOT.value[this.kind] || LOOT.value.def));
                g.vx = side * R.range(70, 130); g.vy = R.range(-170, -110);
            }
        }
        if (!this.boss && !(src && src.kind === DMG.EXPLOSION)) entAdd(new Corpse(this.cx, this.y + this.h, this.def.col || this.col, Math.min(this.w, 12), Math.min(this.h, 10), CORPSE_LEN[this.kind] || 1));
    }
    // ô đặc nằm trong thân => chết (SC: quái bị kẹt trong đất thì hp = 0)
    crushedIn(level) { if (level.solidAt(this.cx, this.cy)) this.hurt({ kind: DMG.CRUSH, dmg: 99 }); }
}

// Vàng rơi khi giết quái (lần 29; SC không có — Dan: cần động lực giết quái)
const LOOT = { chance: 0.4, thrownMul: 1.5, value: { snake: 100, bat: 100, spider: 200, def: 200 } };     // thrownMul: chết vì vật ném / mũi tên => tỉ lệ ×1.5 (lần 30)
class Snake extends Enemy {
    constructor(x, y) { super('snake', x, y); this.st = 'walk'; this.t = 0; }
    update(level, dt) {
        this.timers(dt);
        if (this.holder) { this.followHolder(); return; }
        const d = this.def, R = game.rngPlay;
        if (this.stunT > 0) { this.stunT -= dt; this.physStep(level, dt); return; }
        if (this.onGround && Math.abs(this.vx) > d.speed * 1.5) { this.vx *= scFric(0.3, dt); }     // vừa bị đánh văng: trượt chậm lại
        else if (this.onGround) {
            if (this.st === 'idle') { this.vx = 0; if ((this.t -= dt) <= 0) { this.st = 'walk'; this.facing = R.sign(); } }
            else {
                const f = this.facing, aheadX = f > 0 ? this.x + this.w + 1 : this.x - 1, feet = this.y + this.h + 1;
                if (level.solidAt(aheadX, this.y + this.h - 2) || !level.solidAt(aheadX, feet) && !platAt(level, Math.floor(aheadX / TILE), Math.floor(feet / TILE))) this.facing = -f;
                this.vx = this.facing * d.speed;
                if (R.chance(0.5 / 60)) { this.st = 'idle'; this.t = R.range(20 / 30, 50 / 30); }      // SC: 1/100 mỗi khung 30Hz
            }
        }
        this.vy = Math.min(this.vy + this.gravity * dt, this.fallMax);
        physMove(level, this, dt);
        if (this.vy > 0 && !this.onGround) this.fallT += dt; else this.fallT = 0;
        this.crushedIn(level);
        if (this.y > level.ph + 32) this.alive = false;
    }
    draw(ctx, alpha) {
        if (typeof drawSnakeHp === 'function') { if (this.blinkT > 0 && Math.floor(this.blinkT * 20) % 2) return; drawSnakeHp(this, ctx, alpha); return; }
        const x = Math.round(this.drawX(alpha)), y = Math.round(this.drawY(alpha)), f = this.facing, k = Math.floor(game.time * 6 + this.x * 0.1) % 2;
        const px = (dx, dy, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(f > 0 ? x + dx : x + this.w - dx - w, y + dy, w, h); };
        px(0, 7 + k, 4, 3, '#3f8f34'); px(3, 6, 4, 4, '#5fbf4a'); px(6, 7 - k, 3, 3, '#3f8f34'); px(8, 2, 4, 6, '#5fbf4a');
        px(9, 1, 3, 2, '#6fd85a'); px(10, 3, 1, 1, '#1a1a1a'); px(12, 5, 1 + k, 1, '#e23a3a'); px(0, 10, 9, 1, '#2f6e2c');
    }
}

class Bat extends Enemy {
    constructor(x, y) { super('bat', x, y); this.st = 'hang'; this.gravity = 0; }
    update(level, dt) {
        this.timers(dt);
        if (this.holder) { this.followHolder(); return; }
        const p = game.player, d = this.def;
        const dist = p ? Math.hypot(p.cx - this.cx, p.cy - this.cy) : 1e9;
        const ceil = level.solidAt(this.cx, this.y - 1);
        if (this.st === 'hang') {
            this.vx = this.vy = 0;
            if (p && !p.dead && ((dist < 90 && p.cy > this.cy + 16) || !ceil)) { this.st = 'fly'; sndPlay('alert', { x: this.cx, vol: 0.5 }); }
        } else {
            if (p && !p.dead && dist < 160) {
                let ang = Math.atan2(p.cy - this.cy, p.cx - this.cx);
                // SC: bị tường chắn thì bay thẳng lên/xuống; bị trần/sàn chắn thì bay ngang
                if ((this.hitR && p.cx > this.cx) || (this.hitL && p.cx < this.cx)) ang = p.cy < this.cy ? -Math.PI / 2 : Math.PI / 2;
                if ((this.hitU && p.cy < this.cy || this.hitDown && p.cy > this.cy) && Math.abs(p.cx - this.cx) > 8) ang = p.cx < this.cx ? Math.PI : 0;
                this.vx = Math.cos(ang) * d.speed; this.vy = Math.sin(ang) * d.speed;
            } else if (ceil) { this.st = 'hang'; this.vx = this.vy = 0; }
            else { this.vx = 0; this.vy = -d.speed; }
            this.facing = p && p.cx < this.cx ? -1 : 1;
        }
        if (this.stunT > 0) { this.stunT -= dt; this.vy += 300 * dt; }
        this.ignorePlat = true;
        physMove(level, this, dt);
        this.hitDown = this.onGround;
        this.crushedIn(level);
    }
    draw(ctx, alpha) {
        if (typeof drawBatHp === 'function') { if (this.blinkT > 0 && Math.floor(this.blinkT * 20) % 2) return; drawBatHp(this, ctx, alpha); return; }
        const x = Math.round(this.drawX(alpha)), y = Math.round(this.drawY(alpha));
        const B = '#7a4ab0', D = '#4a2a70';
        if (this.st === 'hang') {
            ctx.fillStyle = D; ctx.fillRect(x + 3, y, 6, 2); ctx.fillStyle = B; ctx.fillRect(x + 4, y + 2, 4, 6); ctx.fillStyle = D; ctx.fillRect(x + 2, y + 1, 2, 6); ctx.fillRect(x + 8, y + 1, 2, 6);
            ctx.fillStyle = '#ffd24a'; ctx.fillRect(x + 4, y + 6, 1, 1); ctx.fillRect(x + 7, y + 6, 1, 1);
            return;
        }
        const k = Math.floor(game.time * 12) % 2;
        ctx.fillStyle = B; ctx.fillRect(x + 4, y + 3, 4, 5);
        ctx.fillStyle = D; if (k) { ctx.fillRect(x, y + 1, 4, 3); ctx.fillRect(x + 8, y + 1, 4, 3); } else { ctx.fillRect(x, y + 5, 4, 3); ctx.fillRect(x + 8, y + 5, 4, 3); }
        ctx.fillStyle = '#ffd24a'; ctx.fillRect(x + 4, y + 4, 1, 1); ctx.fillRect(x + 7, y + 4, 1, 1);
    }
}

// Tạo vật / quái theo danh sách đặt sẵn của level (ký tự LVL_CHARS)
function spawnObjects(level) {
    for (const o of level.objs) {
        const x = o.c * TILE, y = o.r * TILE;
        let e = null;
        if (o.kind === 'snake') e = new Snake(x + 2, y + TILE - ENEMY_DEFS.snake.h);
        else if (o.kind === 'bat') e = new Bat(x + 2, y);
        else if (FOES[o.kind]) { const d = ENEMY_DEFS[o.kind]; e = new FOES[o.kind](x + (TILE - d.w) / 2, (FOE_AIR[o.kind] || d.hang) ? y + 2 : y + TILE - d.h); }
        else if (o.kind === 'stalactite') e = new Stalactite(o.c, o.r);
        else if (o.kind === 'bigchest') e = new BigChest(x, y + TILE - 12);
        else if (o.kind === 'key') e = new Key(x + 4, y + TILE - 8);
        else if (o.kind === 'altar') e = new Altar(x + 1, y + TILE - 12);
        else if (o.kind === 'boss_warden') e = bossTierApply(new Warden(x + TILE / 2, y + TILE), game.levelIdx);
        else if (o.kind === 'boss_hunter') e = bossTierApply(new Hunter(x + TILE / 2, y + TILE), game.levelIdx);
        else if (o.kind === 'boss_mage') e = bossTierApply(new Mage(x + TILE / 2, y + TILE), game.levelIdx);
        else if (o.kind === 'boss_titan') e = new Titan(x + TILE / 2, y + TILE, level.def.finale);
        else if (o.kind === 'boss_queen') e = bossTierApply(new Queen(x + TILE / 2, y + TILE), game.levelIdx);
        else if (o.kind === 'barrel') e = new Barrel(x + 2, y + TILE - 14);
        else if (o.kind === 'rock') e = new Rock(x + 4, y + TILE - 8);
        else if (o.kind === 'pot') e = new Pot(x + 3, y + TILE - 11);
        else if (o.kind === 'crate') e = new Crate(x + 2, y + TILE - 12);
        else if (o.kind === 'princess') e = new Princess(x + 3, y + TILE - PRINCESS.h);
        else if (o.kind === 'shopkeeper') e = new Shopkeeper(x + 2, y + TILE - ENEMY_DEFS.shopkeeper.h);
        else if (o.kind.indexOf('goods') === 0) e = new ShopGoods(x + 2, y + TILE - 12, o.kind.slice(5).toLowerCase());
        else if (o.kind === 'goldsmall') e = new Gold(x + 5, y + TILE - 4, 500);
        else if (o.kind === 'goldbig') e = new Gold(x + 4, y + TILE - 6, 1500);
        if (e) entAdd(e);
    }
    if (level.def.boss && level.exit) entAdd(new ExitSeal(level.exit.c, level.exit.r));
}

// 11b_foes — QUÁI CÁC VÙNG SAU (GĐ6b; chuyển từ Metroidvania reserve/mv_stash.js khối 1+4, viết lại theo Thing/Enemy của dự án này).
//   Luật chung (D3 + bảng 3.3): chết bằng roi / đạp đầu / vật ném / bom như quái thường; máu 1–3; chạm người chơi gây 1 (dmgContacts); MỌI đòn đặc biệt có điềm báo `windup` (dấu ! + đổi màu).
//   walker bọ đá (đi tuần) · chaser (thấy → báo → đuổi) · rusher (thấy → báo → húc) · hopper (thấy → ngồi → nhảy cung) · guard (khiên chặn roi/tên phía trước, trừ lúc nghỉ; đạp đầu vẫn được)
//   shooter (đứng yên, báo, bắn đạn thẳng) · mortar (vòng đỏ báo điểm rơi, ném đạn pháo cung, nổ nhỏ) · flyer (lượn, nhích về phía người chơi) · diver (thấy → báo → lao thẳng một đường, nghỉ, về chỗ).
const FOES = {}, FOE_AIR = { flyer: true, diver: true };

class Foe extends Enemy {
    constructor(type, x, y) { super(type, x, y); this.st = 'walk'; this.t = 0; this.air = !!FOE_AIR[type]; if (this.air) { this.gravity = 0; this.home = { x, y }; } this.tx = 0; this.ty = 0; }
    onHurt(src) { this.invulnT = 0.35; if (!this.air) this.stunT = 0.18; if (src && src.x !== undefined) this.vx = (this.cx < src.x ? -1 : 1) * 60; }
    // thấy người chơi? (tầm ngang sight, lệch dọc sightY, không tường chắn; front = chỉ nhìn phía trước)
    sees(level, front) {
        const p = game.player, d = this.def; if (!p || p.dead) return false;
        const dx = p.cx - this.cx, dy = p.cy - this.cy;
        if (this.noiseT > 0 && Math.abs(dx) <= d.sight * 1.5 && Math.abs(dy) <= (d.sightY || 40) * 2) return true;      // nghe tiếng súng
        const sm = level.inWater(p) ? 0.4 : 1;           // lặn dưới nước: quái khó thấy (lần 27)
        if (Math.abs(dx) > d.sight * sm || Math.abs(dy) > (d.sightY || 40) * sm) return false;
        if (front && Math.sign(dx) !== this.facing) return false;
        const n = Math.ceil(Math.hypot(dx, dy) / 6);
        for (let i = 1; i < n; i++) if (level.solidAt(this.cx + dx * i / n, this.cy + dy * i / n)) return false;
        return true;
    }
    face() { const p = game.player; if (p) this.facing = p.cx < this.cx ? -1 : 1; }
    // đi tuần mặt đất như rắn (quay ở tường / mép vực)
    patrol(level, speed) {
        const f = this.facing, aheadX = f > 0 ? this.x + this.w + 1 : this.x - 1, feet = this.y + this.h + 1;
        if (level.solidAt(aheadX, this.y + this.h - 2) || !level.solidAt(aheadX, feet) && !platAt(level, Math.floor(aheadX / TILE), Math.floor(feet / TILE))) this.facing = -f;
        this.vx = this.facing * speed;
    }
    edgeAhead(level) { const f = this.facing, aheadX = f > 0 ? this.x + this.w + 2 : this.x - 2; return level.solidAt(aheadX, this.y + this.h - 2) || !level.solidAt(aheadX, this.y + this.h + 1); }
    warnOn() { this.warnT = 0.001; sndPlay('alert', { x: this.cx, vol: 0.5, p: 1.2 }); }
    update(level, dt) {
        this.timers(dt);
        if (this.holder) { this.followHolder(); return; }
        if (this.stunT > 0) { this.stunT -= dt; if (!(this.thrownT > 0)) this.vx *= scFric(0.3, dt); this.vy = Math.min(this.vy + (this.air ? 300 : this.gravity) * dt, this.fallMax); physMove(level, this, dt); return; }
        this.think(level, dt);
        if (!this.air) { this.vy = Math.min(this.vy + this.gravity * dt, this.fallMax); if (this.vy > 0 && !this.onGround) this.fallT += dt; else this.fallT = 0; }
        else this.ignorePlat = true;
        physMove(level, this, dt);
        this.crushedIn(level);
        if (this.y > level.ph + 32) this.alive = false;
    }
    // --- vẽ chung: thân màu quái, mắt, chân/cánh nhấp nhô; điềm báo = chớp trắng + dấu ! ---
    body(ctx, x, y) { }
    draw(ctx, alpha) {
        const x = Math.round(this.drawX(alpha)), y = Math.round(this.drawY(alpha)), d = this.def, k = Math.floor(game.time * 7 + this.x * 0.1) % 2, warn = this.st === 'warn';
        const col = warn && Math.floor(game.time * 20) % 2 ? '#ffffff' : d.col;
        if (this.blinkT > 0 && Math.floor(this.blinkT * 20) % 2) return;
        if (typeof drawFoeHp === 'function') { drawFoeHp(this, ctx, x, y); if (ITEM_HP) { foeDecoHp(this, ctx, x, y); if (warn) foeWarnHp(this, ctx, x, y); return; } this.deco(ctx, x, y); if (warn) { ctx.fillStyle = '#ffe14a'; ctx.fillRect(x + this.w / 2 - 1, y - 9, 2, 5); ctx.fillRect(x + this.w / 2 - 1, y - 3, 2, 2); } return; }
        ctx.fillStyle = '#1c1420'; ctx.fillRect(x, y + 1, this.w, this.h - 1);
        ctx.fillStyle = col; ctx.fillRect(x + 1, y + 2, this.w - 2, this.h - 4);
        ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fillRect(x + 1, y + 2, this.w - 2, 2);
        const ex = this.facing > 0 ? x + this.w - 5 : x + 2;
        ctx.fillStyle = '#fff'; ctx.fillRect(ex, y + 4, 3, 3); ctx.fillStyle = '#1a1a1a'; ctx.fillRect(ex + (this.facing > 0 ? 1 : 0), y + 5, 2, 2);
        if (!this.air) { ctx.fillStyle = '#1c1420'; ctx.fillRect(x + 1 + k, y + this.h - 2, 3, 2); ctx.fillRect(x + this.w - 4 - k, y + this.h - 2, 3, 2); }
        else { ctx.fillStyle = col; const w = k ? 3 : 0; ctx.fillRect(x - 3, y + 1 + w, 4, 2); ctx.fillRect(x + this.w - 1, y + 1 + w, 4, 2); }
        this.deco(ctx, x, y);
        if (warn) { ctx.fillStyle = '#ffe14a'; ctx.fillRect(x + this.w / 2 - 1, y - 9, 2, 5); ctx.fillRect(x + this.w / 2 - 1, y - 3, 2, 2); }
    }
    deco(ctx, x, y) { }
}

class Walker extends Foe {
    constructor(x, y) { super('walker', x, y); }
    think(level, dt) { if (this.onGround) this.patrol(level, this.def.speed); }
    deco(ctx, x, y) { ctx.fillStyle = '#7a2e22'; ctx.fillRect(x + 2, y, 8, 2); ctx.fillRect(x + 4, y - 1, 4, 1); }
}
class Chaser extends Foe {
    constructor(x, y) { super('chaser', x, y); }
    think(level, dt) {
        const d = this.def;
        if (this.st === 'walk') {
            if (this.onGround) this.patrol(level, d.speed);
            if (this.onGround && this.sees(level, false)) { this.st = 'warn'; this.t = d.windup; this.vx = 0; this.face(); this.warnOn(); }
        } else if (this.st === 'warn') { this.vx = 0; if ((this.t -= dt) <= 0) { this.st = 'chase'; this.t = d.giveUp; } }
        else if (this.st === 'chase') {
            this.face(); if (this.onGround) { if (this.edgeAhead(level)) this.vx = 0; else this.vx = this.facing * d.chaseSpeed; }
            if (this.sees(level, false)) this.t = d.giveUp; else if ((this.t -= dt) <= 0) this.st = 'walk';
        }
    }
    deco(ctx, x, y) { ctx.fillStyle = '#6a4210'; ctx.fillRect(x + 3, y + 8, 6, 2); ctx.fillStyle = '#fff'; ctx.fillRect(x + 4, y + 9, 1, 1); ctx.fillRect(x + 7, y + 9, 1, 1); }
}
class Rusher extends Foe {
    constructor(x, y) { super('rusher', x, y); }
    think(level, dt) {
        const d = this.def;
        if (this.st === 'walk') { if (this.onGround) this.patrol(level, d.speed); if (this.onGround && this.sees(level, true)) { this.st = 'warn'; this.t = d.windup; this.vx = 0; this.warnOn(); } }
        else if (this.st === 'warn') { this.vx = 0; if ((this.t -= dt) <= 0) { this.st = 'lunge'; this.t = d.lungeT; } }
        else if (this.st === 'lunge') { this.vx = this.facing * d.lungeSpeed; if ((this.t -= dt) <= 0 || (this.onGround && this.edgeAhead(level))) { this.st = 'rest'; this.t = d.rest; this.vx = 0; } }
        else { this.vx = 0; if ((this.t -= dt) <= 0) this.st = 'walk'; }
    }
    deco(ctx, x, y) { ctx.fillStyle = '#3a5a26'; const f = this.facing > 0 ? x + this.w - 3 : x - 1; ctx.fillRect(f, y + 5, 4, 3); ctx.fillStyle = '#fff'; ctx.fillRect(f + 1, y + 6, 2, 1); }
}
class Hopper extends Foe {
    constructor(x, y) { super('hopper', x, y); }
    think(level, dt) {
        const d = this.def;
        if (this.st === 'walk') { if (this.onGround) this.patrol(level, d.speed); if (this.onGround && this.sees(level, false)) { this.st = 'warn'; this.t = d.windup; this.vx = 0; this.face(); this.warnOn(); } }
        else if (this.st === 'warn') { this.vx = 0; if ((this.t -= dt) <= 0) { this.st = 'leap'; this.t = 0.12; this.vx = this.facing * d.leapVx; this.vy = d.leapVy; this.onGround = false; } }
        else if (this.st === 'leap') { if ((this.t -= dt) <= 0 && this.onGround) { this.st = 'rest'; this.t = d.rest; this.vx = 0; } }
        else { this.vx = 0; if ((this.t -= dt) <= 0) this.st = 'walk'; }
    }
    deco(ctx, x, y) { ctx.fillStyle = '#2a8a7a'; ctx.fillRect(x + 1, y + this.h - 4, 3, 2); ctx.fillRect(x + this.w - 4, y + this.h - 4, 3, 2); }
}
class Guard extends Foe {
    constructor(x, y) { super('guard', x, y); }
    think(level, dt) {

        if (Math.floor(this.t * 20) !== Math.floor((this.t - dt) * 20)) level.fx.push({ x: this.cx - this.dir * 4, y: this.y + this.h, vx: -this.dir * 20, vy: -20, life: 0.25, max: 0.3, size: 3, col: this.col });

// Đá rơi (Vệ binh pha 2): 'warn' (CHƯA gây hại, vòng đỏ ở sàn) warnT giây → 'fall' (rơi, gây hại) → vỡ khi chạm sàn.
class FallRock extends BossHazard {
    constructor(cx, topY, floorY, warnT, owner) { super(cx - 6, topY, 12, 12, 'fallrock', owner); this.floorY = floorY; this.warnT = warnT; this.st = 'warn'; this.active = false; this.cxx = cx; }
    light() { return this.st === 'warn' ? { r: 10 + 10 * clamp(this.t / this.warnT, 0, 1), col: '#ff4a3a', a: 0.2 } : { r: 14, col: '#ffb070', a: 0.3 }; }
    step(level, dt) {
        if (this.st === 'warn') {
            if (Math.floor(this.t * 12) !== Math.floor((this.t - dt) * 12)) level.fx.push({ x: this.cxx + (game.rngFx.next() - 0.5) * 10, y: this.y + 4, vx: 0, vy: 50, life: 0.35, max: 0.4, size: 2, col: '#8a8fa8' });
            if (this.t >= this.warnT) { this.st = 'fall'; this.active = true; this.vy = 120; }
            return;
        }
        this.vy = Math.min(this.vy + 700 * dt, 300); this.y += this.vy * dt;
        if (this.y + this.h >= this.floorY) { this.alive = false; level.spawnBurst(this.cxx, this.floorY - 4, 10, '#8a8fa8', 110); level.spawnDust(this.cxx, this.floorY, 6, 80, 16); sndPlay('rock', { x: this.cxx }); fxShake(0.8, 0.1); }
    }
    draw(ctx, alpha) {

        if (this.st === 'warn') {                                    // vòng đỏ báo trên sàn (nháy nhanh dần); hòn đá nằm trên trần, rung nhẹ
            const k = clamp(this.t / this.warnT, 0, 1), blink = this.warnT - this.t < 0.25 && Math.floor(this.t * 30) % 2, fy = Math.round(this.floorY);
            ctx.globalAlpha = blink ? 1 : 0.3 + 0.5 * k; ctx.strokeStyle = '#ff3b3b'; ctx.strokeRect(Math.round(this.cxx) - 9 + 0.5, fy - 3 + 0.5, 18, 3);
            ctx.fillStyle = '#ff3b3b'; ctx.fillRect(Math.round(this.cxx) - 1, fy - 8 - Math.round(k * 3), 3, 4); ctx.globalAlpha = 1;
            ctx.fillStyle = '#4a4e66'; ctx.fillRect(x + (Math.floor(this.t * 40) % 2), y, this.w, 4);
            return;
        }
        ctx.fillStyle = '#1c1e2e'; ctx.fillRect(x - 1, y - 1, this.w + 2, this.h + 2);
        ctx.fillStyle = '#8a8fa8'; ctx.fillRect(x, y, this.w, this.h); ctx.fillStyle = '#b8bdd4'; ctx.fillRect(x + 1, y + 1, 5, 3); ctx.fillStyle = '#4a4e66'; ctx.fillRect(x + 5, y + 7, 6, 4);
    }
}

// Mảnh tinh thể (Bà chúa): bay thẳng, mất khi đụng ô đặc / hết life. Điềm báo là lúc NẠP của Bà chúa.

// Con dấu phong ấn cửa ra: còn cho tới khi boss ngã
