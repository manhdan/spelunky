<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Honzy</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0d14; }
        body { display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; }
        #stage { position: relative; line-height: 0; }
        canvas#game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; outline: none; touch-action: none; }
        canvas#hud { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }      /* lớp chữ/bản đồ vẽ ở độ phân giải thật của màn hình (xem 06_render: drawText) */
        #tune { position: fixed; top: 8px; right: 8px; width: 250px; max-height: calc(100% - 16px); overflow: auto; display: none;
                background: rgba(10,12,20,.92); color: #cfd6e6; font: 11px/1.3 monospace; padding: 8px; border: 1px solid #3a4260; border-radius: 6px; }
        #tune.on { display: block; }
        #tune h4 { margin: 0 0 6px; font-size: 12px; color: #ffd36b; }
        #tune label { display: flex; justify-content: space-between; margin-top: 5px; }
        #tune input[type=range] { width: 100%; margin: 0; }
        #tune button { margin: 8px 4px 0 0; font: 11px monospace; cursor: pointer; }
    </style>
</head>
<body>
    <div id="stage"><canvas id="game" width="320" height="240" tabindex="0"></canvas><canvas id="hud"></canvas></div>
    <div id="tune"></div>

    <!-- Thứ tự nạp = số trong tên file. 3 khối: config -> entities -> engine -->
    <script>
// 01_config — hằng số toàn game (kích thước, vật lý, phím, camera) + vài hàm tiện ích nhỏ
// Mọi giá trị trong PHYS / WHIP / ITEM / CAM chỉnh được trực tiếp bằng bảng "Tuning" trong game (phím G).
//
// SỐ LIỆU SPELUNKY CLASSIC: các số có ghi "SC:" lấy từ mã nguồn Spelunky Classic (bản công bố 2009, giấy phép Spelunky User License v1.1b:
//   được học/sửa/chia sẻ, KHÔNG được bán bản dẫn xuất). Mình chỉ lấy SỐ và THUẬT TOÁN, không chép mã/hình/âm/mẫu phòng.
//   Game gốc chạy 30 khung/giây; mình chạy 60Hz nên đổi đơn vị: px/khung × 30 = px/s · px/khung² × 900 = px/s² · số khung ÷ 30 = giây.
//   Hệ số ma sát nhân mỗi khung (vd 0.6) được áp theo thời gian: v *= f^(dt·30) — cùng kết quả sau mỗi 1/30 s.

let RENDER_SMOOTH = true;             // nền (khối ô) phóng 2× làm mịn kiểu EPX (06_render.epx2); false = nền 1px thô như cũ
const RES = 2;                           // độ phân giải bên trong = RES × (320×240): thế giới vẫn tính theo ô 16px, nhưng nhân vật/quái vẽ được nửa-pixel (lần 25)
const VIEW_W = 320, VIEW_H = 240;      // SC: khung nhìn 320×240 = 20×15 ô (D2). Phóng to vừa màn hình.
const TILE = 16;                       // 1 ô = 16px
const STEP = 1 / 60;                   // bước vật lý cố định (giây)
const MAX_FRAME_DT = 0.1;              // chặn khi tab bị treo lâu
const TAU = Math.PI * 2;
const SC_FPS = 30;                     // tốc độ khung của Spelunky Classic (để đổi đơn vị)

// Bản đồ (D1, chốt): lưới 4×4 phòng, mỗi phòng 10×8 ô => level 40×32 ô, cộng viền đá cứng 1 ô quanh ngoài (SC: phòng game 672×544 px = 42×34 ô)
const LVL = { roomsX: 4, roomsY: 4, roomW: 10, roomH: 8, border: 1 };
LVL.w = LVL.roomsX * LVL.roomW + 2 * LVL.border;     // 42
LVL.h = LVL.roomsY * LVL.roomH + 2 * LVL.border;     // 34

// Loại ô
//   T_SOLID  = đất thường: đặc, PHÁ ĐƯỢC bằng bom (D11)
//   T_HARD   = đá cứng: đặc, KHÔNG phá được (viền level, cửa ra)
//   T_ONEWAY = bục một chiều (đứng trên được, nhảy xuyên từ dưới lên, ↓+nhảy để xuống)
//   T_LADDER = thang: không đặc, leo được; ô thang trên cùng (ô trên nó không phải thang) đứng lên được như bục một chiều
//   T_SPIKE  = gai: không đặc; rơi xuống trúng thì chết (SC: đang rơi + đã rơi > 4 khung). Đi ngang qua không sao.
//   T_ARROW  = bẫy mũi tên: đặc, phá được; bắn khi có VẬT ĐANG CHUYỂN ĐỘNG đi vào tầm (13b_traps)
//   T_GOLD   = đất có vàng: như đất thường; phá ra thì rơi vàng
//   T_GOLDBIG = đất có mạch vàng lớn · T_STONE = khối đá (SC oBlock: 10% ô đất thành khối đá; bẫy mũi tên được tạo từ khối đá)
const T_EMPTY = 0, T_SOLID = 1, T_HARD = 2, T_ONEWAY = 3, T_LADDER = 4, T_SPIKE = 5, T_ARROW = 6, T_GOLD = 7, T_GOLDBIG = 8, T_STONE = 9, T_PUSH = 10, T_WATER = 11, T_CRUSH = 12, T_LAVA = 13, T_SPRING = 14, T_WEB = 15, T_CRUMBLE = 16;      // T_SPRING = lò xo (nảy cao), T_WEB = mạng nhện (làm chậm), T_CRUMBLE = sàn vỡ (đứng lên là rung rồi sập) — 13j_springs      // T_LAVA = dung nham (13i_lava): không đặc; chạm là chết (người chơi, quái); vật nhặt được rơi vào thì cháy mất      // T_WATER = nước tĩnh (13g_water): không đặc, vẽ phủ lên vật thể, bơi/chìm chậm, không sát thương rơi      // T_PUSH = khối đẩy được (SC oPushBlock): đặc, bom phá được; đẩy sang ngang 1 ô, mất chỗ tựa thì rơi và đè chết sinh vật (13f_pushblock)
const T_IS_SOLID = [false, true, true, false, false, false, true, true, true, true, true, false, true, false, false, false, true];          // theo chỉ số loại ô
const T_BREAKABLE = [false, true, false, false, true, true, true, true, true, true, true, false, false, false, true, true, true];        // bom phá được (thang, gai cũng vỡ)
// Ký tự trong bản đồ ASCII (02_data.js). Ký tự đặt vật/quái xem LVL_CHARS ở 02_data.
const TILE_CHARS = { '#': T_SOLID, 'H': T_HARD, '=': T_ONEWAY, 'L': T_LADDER, '^': T_SPIKE, '<': T_ARROW, '>': T_ARROW, '$': T_GOLD, '%': T_GOLDBIG, 'X': T_STONE, 'M': T_PUSH, 'W': T_WATER, 'Z': T_CRUSH, 'V': T_LAVA, 'Y': T_SPRING, 'N': T_WEB, 'F': T_CRUMBLE, ' ': T_EMPTY, '.': T_EMPTY };

// Người chơi (hitbox). SC: hộp va chạm 10×16 (−5..5, −8..8). Mình dùng 10×15 để chui khe cao đúng 1 ô không bị kẹt do làm tròn số thực.
const PLAYER_W = 10, PLAYER_H = 15;

// ---- Vật lý người chơi (px, giây) — đổi từ SC (xem đầu file) ----
//   Chạy: SC giới hạn 3 px/khung khi đi (90 px/s), 6 px/khung khi giữ nút chạy ≥ 10 khung (180 px/s); gia tốc 3 px/khung² nên gần như tức thì.
//   Đổi hướng: SC chỉ tăng tốc khi đã giữ phím > 2 khung (bấm rất nhanh = chỉ quay mặt, không bước) => turnDelay.
//   Nhảy: SC vận tốc ban đầu −4 px/khung (−120 px/s); trọng lực tăng dần từ 0 lên đầy (1 px/khung² = 900 px/s²) trong 10 khung khi còn GIỮ nút;
//         thả nút thì trọng lực đầy ngay. Kết quả: giữ = cao ~24px (1,5 ô), bấm nhanh = ~9px. Bậc 2 ô phải BÁM MÉP rồi leo lên (đúng như gốc).

    airFric: 0.8,           // SC: xFric khi ở trên không
    jumpV: -120,            // SC: initialJumpAcc × 2 = −4 px/khung
    gravity: 900,           // SC: grav = 1 px/khung²
    jumpRampT: 0.333,       // SC: jumpTimeTotal = 10 khung
    fallMax: 300,           // SC: yVelLimit 10 px/khung

    climbSpeed: 27,         // SC: climbAcc 0.6 + ma sát 0.6 => 0,9 px/khung

    hurtFall2T: 1.07,       // SC: quá 32 khung => mất 2 máu
    deathFallT: 1.6,        // SC: quá 48 khung => mất 10 (chết)

    spikeFallT: 0.13,       // SC: gai giết khi đang rơi và fallTimer > 4 khung

    lookSpeed: 120,         // SC: 4 px/khung

};
const PHYS_DEFAULT = Object.assign({}, PHYS);
// Cho bảng tuning: [khoá, min, max, bước, nhãn]
const PHYS_META = [
    ['walkMax', 30, 200, 1, 'Tốc độ đi'], ['runMax', 60, 320, 1, 'Tốc độ chạy'], ['runHoldT', 0, 1, 0.01, 'Giữ chạy bao lâu (s)'],
    ['accel', 300, 5000, 50, 'Gia tốc'], ['turnDelay', 0, 0.2, 0.01, 'Trễ đổi hướng (s)'],
    ['groundFric', 0.05, 0.99, 0.01, 'Ma sát đất (nhân/khung SC)'], ['airFric', 0.05, 0.99, 0.01, 'Ma sát trên không'],
    ['jumpV', -300, -60, 1, 'Vận tốc nhảy'], ['gravity', 300, 2000, 10, 'Trọng lực'], ['jumpRampT', 0, 0.8, 0.01, 'Thời gian trọng lực tăng dần (s)'],
    ['fallMax', 150, 600, 5, 'Giới hạn rơi'], ['coyote', 0, 0.2, 0.01, 'Coyote (s, gốc = 0)'], ['buffer', 0, 0.2, 0.01, 'Nhớ phím nhảy (s, gốc = 0)'],
    ['climbSpeed', 10, 120, 1, 'Tốc độ leo'], ['stunFallT', 0.2, 1.5, 0.01, 'Rơi bao lâu thì choáng (s)'], ['deathFallT', 0.5, 3, 0.05, 'Rơi bao lâu thì chết (s)'],
    ['stunT', 0.2, 4, 0.1, 'Thời gian choáng (s)']
];

// ---- Roi (D3) — SC: hoạt ảnh 11 khung × tốc 0.6 ≈ 18 khung (0,61 s). 3 khung đầu: đòn "vung sau" sau lưng; từ khung 8: đòn chính phía trước.
const WHIP = {
    total: 0.51,            // SC: tổng thời gian 1 nhát
    preEnd: 0.15,           // SC: image_index < 2 => vung sau lưng
    hitStart: 0.15,         // SC: image_index > 4 => đòn chính phía trước, tới hết hoạt ảnh
    dmg: 1,                 // SC: oWhip.damage = 1
    recover: 0.15,          // lần 29: sau hitStart + recover (0.30s) được QUẤT LẠI ngay (không phải chờ hết total) — Dan: quất hụt thì không kịp quất lần 2
    buffer: 0.2,            // bấm quất trong lúc đang quất: nhớ 0.2s, tới lúc được quất lại thì tự quất
    near: 5,                // hộp đòn chính kéo về sau tới cx − near: bình/hũ/quái nằm ngay dưới chân cũng trúng
    // hộp đòn tính từ tâm người chơi (SC: sWhip đặt ở x ± 16, bbox 3..15 × 6..10 quanh gốc 8,8 => x 11..23, y −2..2)
    fx0: 11, fx1: 24, fy0: -3, fy1: 3,
    // vung sau (SC: sWhipPre bbox 0..9 × 0..11 => phía sau x −24..−15, y −8..3)
    bx0: -24, bx1: -14, by0: -8, by1: 4
};
const WHIP_DEFAULT = Object.assign({}, WHIP);
const WHIP_META = [['total', 0.2, 1.2, 0.01, 'Roi: tổng (s)'], ['hitStart', 0, 0.6, 0.01, 'Roi: lúc đòn chính bắt đầu (s)'], ['preEnd', 0, 0.3, 0.01, 'Roi: vung sau tới (s)']];

// ---- Vật thể, bom, dây (SC) ----
const ITEM = {
    throwVx: 240,           // SC: ném ngang ±8 px/khung (+ vận tốc người chơi)
    throwVy: -90,           // SC: −3 px/khung
    throwUpVy: -270,        // SC: giữ ↑ khi ném: −9 px/khung
    dropVy: 90,
    throwDownVy: 260,       // lần 29: ↓ + ném khi đang ở trên không: ném mạnh thẳng xuống (đủ nhanh để gây sát thương)             // SC: giữ ↓ khi ném: rơi xuống 3 px/khung, ngang ×0.1
    itemGravity: 540,       // SC: vật rơi 0.6 px/khung² (myGrav vật thể)
    bounceY: 0.5,           // SC: chạm đất thì nảy −vy × 0.5
    bounceX: 0.5,           // SC: chạm tường thì −vx × 0.5
    groundFric: 0.3,        // SC: lăn trên đất xVel × 0.3 mỗi khung khi đã nảy
    impactSpeed: 120,       // vật bay nhanh hơn mức này (px/s) mới gây sát thương khi đâm trúng (SC: |vel| > 4 cho đa số vật) — kiểm lại ở GĐ5
    bombFuse: 80 / 30,      // SC: alarm[0] = 80 khung nhấp nháy chậm…
    bombFuse2: 40 / 30,     // …rồi alarm[1] = 40 khung nhấp nháy nhanh => nổ. Tổng 4 s
    blastR: 24,             // SC: hình nổ 48×48 quanh tâm => bán kính ~24 px
    blastDmg: 10,           // SC: người chơi trúng nổ mất 10 (= chết khi còn ≤ 10 máu); quái mất 30
    blastKnockVx: 150,      // SC: văng ngang rand(4,6) px/khung
    blastKnockVy: -180,     // SC: −6 px/khung
    ropeThrowVy: -360,      // SC: dây ném lên −12 px/khung, bám khi bắt đầu rơi hoặc chạm trần
    ropeLen: 8,             // SC: 16 đoạn × 8px = 8 ô
    ropeDropT: 1 / 15,      // SC: mỗi khung thả thêm 8px => 1 ô (16px) mỗi 2 khung 30Hz = 1/15 s
    stompVy: -180,          // SC: đạp đầu quái nảy lên −6 px/khung (− 0.2 × vy)
    startBombs: 8, startRopes: 4, startHp: 4     // SC: lifeStart / bombStart / ropeStart = "4" cả ba; game này cố ý cho 8 bom (lần 29) — xem ROADMAP_SPELUNKY.md mục 12
};
const ITEM_DEFAULT = Object.assign({}, ITEM);
const ITEM_META = [
    ['throwVx', 60, 480, 5, 'Ném: tốc ngang'], ['throwVy', -300, 0, 5, 'Ném: tốc lên'], ['itemGravity', 200, 1500, 10, 'Vật: trọng lực'],
    ['bounceY', 0, 0.9, 0.05, 'Vật: nảy dọc'], ['impactSpeed', 30, 400, 5, 'Vật: tốc tối thiểu gây sát thương'],
    ['bombFuse', 0.5, 5, 0.1, 'Bom: cháy chậm (s)'], ['bombFuse2', 0.2, 3, 0.1, 'Bom: cháy nhanh (s)'], ['blastR', 12, 56, 1, 'Bom: bán kính nổ (px)'],
    ['ropeThrowVy', -600, -150, 10, 'Dây: tốc ném'], ['ropeLen', 3, 14, 1, 'Dây: dài (ô)']
];

// Bẫy mũi tên (SC): tầm cảm biến tối đa 96px (6 ô) tính từ mặt bẫy, dừng ở ô đặc đầu tiên; mũi tên bay 8 px/khung; bắn MỘT lần.
// Chế độ DỄ tạm thời (2026-10-25, theo phản hồi: mũi tên gần như không tránh được): tầm 64 (SC 96) · báo trước warnT giây rồi mới bắn · cúi xuống (duckSafe) thì tên bay qua đầu.
const TRAP = { arrowRange: 64, arrowV: 240, arrowDmg: 2, arrowGravity: 0, arrowLife: 6, warnT: 0.25, duckSafe: 1 };
const TRAP_DEFAULT = Object.assign({}, TRAP);
const TRAP_META = [['arrowRange', 16, 200, 1, 'Mũi tên: tầm cảm biến (px)'], ['arrowV', 60, 500, 5, 'Mũi tên: tốc'], ['arrowDmg', 1, 4, 1, 'Mũi tên: sát thương'], ['warnT', 0, 0.6, 0.05, 'Mũi tên: báo trước (s)'], ['duckSafe', 0, 1, 1, 'Mũi tên: cúi xuống thì né được (1/0)']];

// Vùng (SC: 4 vùng × 4 level = 16; game này 9 vùng × 6 = 54 + màn cuối): theme (02_data THEMES), trọng số chọn mẫu phòng theo đặc điểm (W nước · V dung nham · Z bẫy đè · M khối đẩy · Y lò xo · N mạng nhện · F sàn vỡ),
// elem = nguyên tố của vùng (10c_status) · rate = hệ số mật độ quái · floor/air = bảng quái theo ký tự LVL_CHARS (trọng số): floor đứng trên sàn, air treo dưới trần
// darkChance = xác suất vùng có MỘT level tối (SC), dark = độ tối. Thêm vùng/đổi nhịp độ chỉ cần sửa bảng này.
const ZONES = [
    { id: 'mines',    name: 'Hầm mỏ',        theme: 'mines',    elem: null,     rate: 1,    floor: { S: 1, x: 0.4 }, air: { B: 2, d: 1 },   darkChance: 0.35, dark: 0.85, w: { W: 1, V: 0.6, Z: 0.7, M: 1, Y: 1, N: 0.5, F: 0.3 } },
    { id: 'forest',   name: 'Rừng sâu',      theme: 'forest',   elem: 'poison', rate: 1.1,  floor: { S: 2, T: 2, U: 2, C: 1, x: 1 }, air: { B: 2, Q: 1, d: 1 }, darkChance: 0.45, dark: 0.85, w: { W: 2.5, V: 0, Z: 0.3, M: 1, Y: 2, N: 3, F: 1 } },
    { id: 'cave',     name: 'Hang ngầm',     theme: 'cave',     elem: null,     rate: 1.2,  floor: { S: 1, T: 2, U: 1, C: 1, x: 0.6 }, air: { B: 2, d: 1, Q: 1 }, darkChance: 0.5, dark: 0.84, w: { W: 1, V: 0.3, Z: 0.8, M: 1, Y: 1, N: 1, F: 0.6 } },
    { id: 'snow',     name: 'Núi tuyết',     theme: 'snow',     elem: 'slow',   rate: 1.3,  floor: { S: 1, U: 2, J: 1, C: 1, x: 0.8 }, air: { Q: 2, B: 1, I: 1 }, darkChance: 0.35, dark: 0.8, w: { W: 0.2, V: 0, Z: 0.8, M: 1.5, Y: 2, N: 0.2, F: 2.5 } },

function rngHash(x) {      // splitmix32: số nguyên 32-bit -> số nguyên 32-bit "trộn đều"
    x = (x + 0x9E3779B9) | 0;
    x = Math.imul(x ^ (x >>> 16), 0x85EBCA6B); x = Math.imul(x ^ (x >>> 13), 0xC2B2AE35);
    return (x ^ (x >>> 16)) >>> 0;
}
// Seed dạng chữ hoặc số -> số nguyên 32-bit
function rngSeedOf(s) {
    if (typeof s === 'number' && isFinite(s)) return s >>> 0;
    s = String(s); let h = 2166136261;
    for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    return h >>> 0;
}

class Rng {
    constructor(seed) {
        let a = rngHash(seed), b = rngHash(a), c = rngHash(b), d = rngHash(c);
        this.s = [a, b, c, d];
        for (let i = 0; i < 12; i++) this.u32();     // bỏ vài số đầu
    }
    u32() {
        const s = this.s; let [a, b, c, d] = s;
        const t = (((a + b) | 0) + d) | 0;
        d = (d + 1) | 0; a = b ^ (b >>> 9); b = (c + (c << 3)) | 0; c = (c << 21) | (c >>> 11); c = (c + t) | 0;
        s[0] = a; s[1] = b; s[2] = c; s[3] = d;
        return t >>> 0;
    }
    next() { return this.u32() / 4294967296; }                 // [0, 1)
    range(a, b) { return a + this.next() * (b - a); }           // số thực [a, b)
    int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }   // số nguyên [a, b] — tương đương rand(a,b) của SC
    chance(p) { return this.next() < p; }
    pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
    sign() { return this.next() < 0.5 ? -1 : 1; }
    state() { return this.s.slice(); }                          // để test so sánh
}

function rngWorld(seed, levelIdx) { return new Rng(rngHash(rngSeedOf(seed) ^ Math.imul(levelIdx + 1, 0x27D4EB2F))); }
function rngPlayFor(seed) { return new Rng(rngHash(rngSeedOf(seed) ^ 0x51ED270B)); }
function rngFxFor(seed) { return new Rng(rngHash(rngSeedOf(seed) ^ 0x1B873593)); }

    <script>
// 03_input — bàn phím qua lớp trừu tượng theo "hành động" (KEYMAP ở 01_config). Giữ nguyên từ dự án Metroidvania; chỉ đổi khoá lưu + tuỳ chọn (autoRun thay djOnJump).
//   inp.held('jump')     đang giữ
//   inp.pressed('jump')  vừa bấm xuống trong bước vật lý này
//   inp.released('jump') vừa thả trong bước này
// Cạnh bấm/thả được giữ lại cho tới khi một bước vật lý chạy xong (inp.endStep) => không mất phím khi màn hình 144Hz.
// Đổi phím (GĐ4): inp.bind / inp.unbind / inp.reset sửa KEYMAP tại chỗ rồi lưu localStorage ('spGD2_controls_v3'); menu Esc ở 15b_screens.
//   inp.lock(true) khi mở menu: bỏ qua phím cho game (menu tự nghe keydown). inp.name/label/fill dùng để hiện tên phím trong chữ hướng dẫn.
// Tay cầm: 03a_gamepad.js (phát lại thành phím nên dùng chung lớp này). Cảm ứng: chưa làm.

const INP_STORE = 'spGD2_controls_v3';   // v2: bố trí Q W E R 1 2 (đổi khoá để phím cũ đã lưu không đè bố trí mới)         // khoá riêng cho dự án này (không lẫn với phím của Metroidvania)
const INP_MAX_KEYS = 3;                       // số phím tối đa mỗi hành động

const inp = (() => {
    const down = new Set(), pressedE = new Set(), releasedE = new Set();
    const gameCodes = new Set();
    let locked = false;
    const rebuild = () => { gameCodes.clear(); for (const k in KEYMAP) KEYMAP[k].forEach(c => gameCodes.add(c)); };
    rebuild();
    const isField = e => e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');

    window.addEventListener('keydown', e => {
        if (isField(e) || locked) return;
        if (gameCodes.has(e.code)) e.preventDefault();
        if (e.repeat) return;
        if (!down.has(e.code)) pressedE.add(e.code);
        down.add(e.code);
    });
    window.addEventListener('keyup', e => {
        if (isField(e) || locked) return;
        if (down.has(e.code)) releasedE.add(e.code);
        down.delete(e.code);
    });
    window.addEventListener('blur', () => { down.clear(); pressedE.clear(); });

    const any = (set, action) => KEYMAP[action].some(c => set.has(c));
    const clear = () => { down.clear(); pressedE.clear(); releasedE.clear(); };

    // ---- Tên phím để hiển thị ----
    const NAMES = { ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', Space: 'Space', ShiftLeft: 'Shift', ShiftRight: 'Shift phải', Enter: 'Enter',
        Backspace: 'Backspace', Delete: 'Delete', Comma: ',', Period: '.', Slash: '/', Semicolon: ';', Quote: "'", Minus: '-', Equal: '=', Backslash: '\\', Backquote: '`' };
    const name = code => {
        if (NAMES[code]) return NAMES[code];
        let m = /^Key([A-Z])$/.exec(code); if (m) return m[1];
        m = /^Digit(\d)$/.exec(code); if (m) return m[1];
        m = /^Numpad(\w+)$/.exec(code); if (m) return 'Num' + m[1];
        return code;
    };
    // Các phím của hành động (tối đa n), nối bằng sep; chưa gán thì "(chưa gán)"
    const label = (action, n, sep) => { const a = (KEYMAP[action] || []).slice(0, n || 2); return a.length ? a.map(name).join(sep || '/') : '(chưa gán)'; };
    // Thay {hành_động} trong chữ hướng dẫn bằng tên phím thật
    const fill = str => str.replace(/\{(\w+)\}/g, (m, k) => KEYMAP[k] ? label(k, 2, ' hoặc ') : m);

    // ---- Đổi phím ----
    // Trả về lý do không gán được (chuỗi) hoặc null nếu gán được
    const bindReason = code => {
        if (!code || typeof code !== 'string') return 'Phím không hợp lệ';
        if (code === 'Escape') return 'Esc dùng để mở/đóng menu';
        if (code === 'Tab' || code === 'ContextMenu' || code === 'CapsLock' || /^F\d+$/.test(code) || /^(Control|Alt|Meta|OS)/.test(code)) return name(code) + ' không gán được (trình duyệt dùng)';
        if (KEY_DEBUG_CODES.indexOf(code) >= 0) return name(code) + ' dành cho phím debug';
        return null;
    };
    const actionOf = id => KEY_ACTIONS.find(a => a.id === id);
    const save = () => {
        try { localStorage.setItem(INP_STORE, JSON.stringify({ keys: KEYMAP, autoRun: SETTINGS.autoRun, fit: SETTINGS.fit, shake: SETTINGS.shake, pad: SETTINGS.pad, assist: SETTINGS.assist, easy: SETTINGS.easy })); } catch (e) { /* không có localStorage: bỏ qua */ }
    };
    const load = () => {
        try {
            const raw = localStorage.getItem(INP_STORE); if (!raw) return;
            const d = JSON.parse(raw);
            for (const a of KEY_ACTIONS) {
                const v = d.keys && d.keys[a.id]; if (!Array.isArray(v)) continue;
                const ok = v.filter((c, i) => typeof c === 'string' && !bindReason(c) && v.indexOf(c) === i).slice(0, INP_MAX_KEYS);
                if (ok.length || !a.need) KEYMAP[a.id] = ok;
            }
            if (typeof d.autoRun === 'boolean') SETTINGS.autoRun = d.autoRun;
            if (typeof d.fit === 'boolean') SETTINGS.fit = d.fit;
            if (typeof d.shake === 'boolean') SETTINGS.shake = d.shake;
            if (typeof d.pad === 'boolean') SETTINGS.pad = d.pad;
            if (typeof d.assist === 'boolean') SETTINGS.assist = d.assist;
            if (typeof d.easy === 'boolean') SETTINGS.easy = d.easy;
            rebuild();
        } catch (e) { /* dữ liệu hỏng: dùng mặc định */ }
    };
    // Gán `code` vào ô `slot` (0..2) của hành động. Phím đang thuộc hành động khác thì chuyển sang đây (trừ khi đó là phím duy nhất của hành động bắt buộc).
    // Trả về {ok, msg}
    const bind = (action, slot, code) => {
        const why = bindReason(code); if (why) return { ok: false, msg: why };
        const arr = KEYMAP[action]; if (!arr || slot < 0 || slot >= INP_MAX_KEYS) return { ok: false, msg: 'Ô không hợp lệ' };
        let moved = '';
        for (const a of KEY_ACTIONS) {
            if (a.id === action) continue;
            if (KEYMAP[a.id].indexOf(code) >= 0 && a.need && KEYMAP[a.id].length <= 1) return { ok: false, msg: name(code) + ' là phím duy nhất của "' + a.label + '"' };
        }
        for (const a of KEY_ACTIONS) {
            if (a.id === action) continue;
            const i = KEYMAP[a.id].indexOf(code); if (i >= 0) { KEYMAP[a.id].splice(i, 1); moved = a.label; }
        }
        const j = arr.indexOf(code);
        if (j >= 0 && j !== slot) { arr.splice(j, 1); if (j < slot) slot--; }
        if (slot < arr.length) arr[slot] = code; else arr.push(code);
        rebuild(); clear(); save();
        return { ok: true, msg: moved ? 'Đã chuyển ' + name(code) + ' từ "' + moved + '"' : '' };
    };
    const unbind = (action, slot) => {
        const arr = KEYMAP[action], a = actionOf(action);
        if (!arr || slot < 0 || slot >= arr.length) return { ok: false, msg: '' };
        if (a && a.need && arr.length <= 1) return { ok: false, msg: 'Cần ít nhất 1 phím cho "' + a.label + '"' };
        arr.splice(slot, 1); rebuild(); clear(); save();
        return { ok: true, msg: '' };
    };
    const reset = () => { for (const k in KEYMAP_DEFAULT) KEYMAP[k] = KEYMAP_DEFAULT[k].slice(); SETTINGS.autoRun = false; SETTINGS.fit = true; SETTINGS.shake = true; SETTINGS.pad = false; rebuild(); clear(); save(); resizeCanvas(); };

    load();
    return {
        held: a => any(down, a),
        pressed: a => any(pressedE, a),
        released: a => any(releasedE, a),
        heldCodes() { return [...down]; },          // để hiển thị trong debug (kiểm tra phím bị 'ghosting')
        axisX() { return (any(down, 'right') ? 1 : 0) - (any(down, 'left') ? 1 : 0); },
        endStep() { pressedE.clear(); releasedE.clear(); },
        clear,
        lock(on) { locked = !!on; clear(); },        // mở menu: game không nhận phím
        get locked() { return locked; },
        name, label, fill, bindReason, bind, unbind, reset, save, load
    };
})();

// 03a_gamepad — TAY CẦM (Gamepad API; Giai đoạn 8, lần 16).
//   Cách làm: mỗi khung hình đọc navigator.getGamepads() rồi PHÁT LẠI thành sự kiện bàn phím (keydown/keyup) lên window. Nhờ vậy mọi thứ có sẵn dùng được ngay:
//   phím đã đổi trong menu Esc vẫn đúng (tay cầm gửi phím ĐẦU TIÊN của hành động), menu/tiêu đề/bản đồ/màn hình kết thúc nghe cùng sự kiện như bàn phím.
//   Chơi:  A = Nhảy · X = Roi / ném · B = Bom · Y = Dây · LB/RB/LT/RT = Chạy nhanh · cần trái hoặc D-pad = đi / leo / ngồi
//          Start = menu (Esc) · Back/Select = bản đồ (Tab)
//   Trong menu / tiêu đề / bản đồ / kết thúc:  cần/D-pad = ←↑→↓ · A = Enter · B = Esc · X = Backspace (xoá phím) · Start = Esc · Back = Tab
//   Rung tay cầm: khi fxShake (bị đánh, boss gầm…) nếu trình duyệt có vibrationActuator; tắt cùng với rung màn hình (menu Esc, hàng "Rung").
//   Dùng hệ nút CHUẨN (mapping 'standard'); tay cầm lạ vẫn thử theo cùng chỉ số. Tắt hẳn: SETTINGS.pad = false (menu Esc, hàng "Tay cầm").
//   Hàm kiểm thử: gpadPoll(pads) nhận mảng giả tay cầm; gpadSend có thể thay để bắt sự kiện.

const GPAD = {
    dead: 0.5,                                    // cần gạt quá ngưỡng này mới tính là bấm
    // chỉ số nút chuẩn -> { play: hành động khi chơi, menu: mã phím khi đang ở menu/màn hình phụ, code: mã phím cố định cho cả hai }
    btn: {      // Spelunky: A nhảy · X roi/ném · B bom · Y dây · RB/RT chạy
        0: { play: 'jump', menu: 'Enter' }, 1: { play: 'bomb', menu: 'Escape' }, 2: { play: 'attack', menu: 'Backspace' }, 3: { play: 'rope', menu: null },
        4: { play: 'run', menu: null }, 5: { play: 'run', menu: null }, 6: { play: 'run', menu: null }, 7: { play: 'run', menu: null },
        8: { code: 'Tab' }, 9: { code: 'Escape' },
        12: { play: 'up', menu: 'ArrowUp' }, 13: { play: 'down', menu: 'ArrowDown' }, 14: { play: 'left', menu: 'ArrowLeft' }, 15: { play: 'right', menu: 'ArrowRight' }
    },
    axis: { 'ax0-': { play: 'left', menu: 'ArrowLeft' }, 'ax0+': { play: 'right', menu: 'ArrowRight' }, 'ax1-': { play: 'up', menu: 'ArrowUp' }, 'ax1+': { play: 'down', menu: 'ArrowDown' } },
    src: {},                                      // nguồn đang giữ: id nguồn -> mã phím đã gửi (để thả đúng mã dù ngữ cảnh đổi giữa chừng)
    count: {},                                    // mã phím -> số nguồn đang giữ nó (cần gạt + D-pad cùng hướng không thả sớm)
    name: '', on: false                           // tên tay cầm đang dùng ('' = chưa có), có dữ liệu ở khung vừa rồi
};

function gpadSend(type, code) {
    try { window.dispatchEvent(new KeyboardEvent(type, { code: code, key: code, bubbles: true, cancelable: true })); } catch (e) { /* trình duyệt không cho tạo sự kiện: bỏ qua */ }
}
// Ngữ cảnh menu = đang ở menu Esc / tiêu đề / bản đồ / màn hình kết thúc (game đứng hình, phím đi tới các trình nghe riêng)
function gpadMenuMode() { return typeof game !== 'undefined' && !!(game.menu || game.title || game.map || game.endScr); }
function gpadCodeFor(def, menu) {
    if (!def) return null;
    if (def.code) return def.code;
    if (menu) return def.menu || null;
    const a = KEYMAP[def.play]; return a && a.length ? a[0] : null;
}
function gpadPress(id, code) { GPAD.src[id] = code; if ((GPAD.count[code] = (GPAD.count[code] || 0) + 1) === 1) gpadSend('keydown', code); }
function gpadRelease(id) {
    const code = GPAD.src[id]; if (code === undefined) return;
    delete GPAD.src[id];
    if ((GPAD.count[code] = (GPAD.count[code] || 1) - 1) <= 0) { delete GPAD.count[code]; gpadSend('keyup', code); }
}
function gpadReleaseAll() { for (const id of Object.keys(GPAD.src)) gpadRelease(id); }
// Chọn tay cầm đầu tiên đang nối
function gpadPick(pads) {
    if (!pads) return null;
    for (let i = 0; i < pads.length; i++) { const p = pads[i]; if (p && p.connected !== false && p.buttons && p.buttons.length >= 4) return p; }
    return null;
}
// Mỗi khung: `pads` mặc định lấy từ navigator.getGamepads() (test truyền mảng giả)
function gpadPoll(pads) {
    if (pads === undefined) { try { pads = typeof navigator !== 'undefined' && navigator.getGamepads ? navigator.getGamepads() : null; } catch (e) { pads = null; } }
    const p = SETTINGS.pad === false ? null : gpadPick(pads);
    if (!p) { if (GPAD.on) gpadReleaseAll(); GPAD.on = false; GPAD.name = ''; return false; }
    GPAD.on = true; GPAD.name = String(p.id || 'Tay cầm').replace(/\s*\(.*$/, '').slice(0, 28);
    const menu = gpadMenuMode(), want = {};
    for (const k in GPAD.btn) { const b = p.buttons[k]; if (b && (b.pressed || b.value > 0.6)) want['b' + k] = GPAD.btn[k]; }
    const ax = p.axes || [], x = ax[0] || 0, y = ax[1] || 0;
    if (x < -GPAD.dead) want['ax0-'] = GPAD.axis['ax0-']; else if (x > GPAD.dead) want['ax0+'] = GPAD.axis['ax0+'];
    if (y < -GPAD.dead) want['ax1-'] = GPAD.axis['ax1-']; else if (y > GPAD.dead) want['ax1+'] = GPAD.axis['ax1+'];
    for (const id of Object.keys(GPAD.src)) if (!want[id]) gpadRelease(id);                      // thả trước, bấm sau (đổi hướng gọn)
    for (const id in want) { if (GPAD.src[id] !== undefined) continue; const code = gpadCodeFor(want[id], menu); if (code) gpadPress(id, code); }
    return true;
}
// Rung tay cầm (nếu có). mag 0..1, ms thời lượng
function gpadRumble(mag, ms) {
    if (SETTINGS.pad === false || SETTINGS.shake === false || !GPAD.on) return false;
    try {
        const pads = navigator.getGamepads(), p = gpadPick(pads), vib = p && p.vibrationActuator;
        if (vib && vib.playEffect) { vib.playEffect('dual-rumble', { duration: Math.round(clamp(ms, 40, 600)), strongMagnitude: clamp(mag, 0, 1), weakMagnitude: clamp(mag * 0.7, 0, 1) }); return true; }
    } catch (e) { /* không hỗ trợ rung */ }
    return false;
}
if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('gamepadconnected', e => { if (typeof uiToast === 'function' && SETTINGS.pad !== false) uiToast('Đã nhận tay cầm: ' + String((e.gamepad && e.gamepad.id) || '').replace(/\s*\(.*$/, '').slice(0, 28) + ' (bấm một nút để bắt đầu)'); });
    window.addEventListener('gamepaddisconnected', () => { gpadReleaseAll(); GPAD.on = false; GPAD.name = ''; });
    window.addEventListener('blur', () => gpadReleaseAll());
}

// 04_audio — âm thanh tổng hợp bằng Web Audio (KHÔNG có file âm thanh nào). Khối dựng âm (nhiễu, bao biên độ, tông, tiếng ồn lọc) lấy ý tưởng từ audio.js của DiabloLike/CozyWorld, viết lại cho game này.
//   Mỗi hiệu ứng = một hàm (ac, out, t, p) dựng nút âm thanh trên AudioContext bất kỳ (p = hệ số cao độ). Nhờ vậy test dựng được bằng OfflineAudioContext hoặc ngữ cảnh giả (tools/test_headless.js).
//   Phát: sndPlay('tên', { x: toạ độ thế giới (giảm âm theo khoảng cách tới người chơi + lệch trái/phải), vol, p }). Không có AudioContext (test Node) hoặc chưa được phép phát thì không làm gì.
//   Trình duyệt chỉ cho phát sau cử chỉ người dùng: AudioContext tạo ở lần bấm phím / chạm đầu tiên (sndUnlock). Âm lượng + tắt tiếng chỉnh ở menu Esc, lưu localStorage riêng (SND_STORE), không nằm chung với phím.
//   Mỗi tiếng có thời lượng tối đa, khoảng cách tối thiểu giữa 2 lần phát (tránh dồn tiếng khi nhiều quái cùng làm một việc) và giới hạn số giọng đồng thời.
//   Tiếng của đòn quái luôn phát ĐÚNG lúc bắt đầu điềm báo (windup) rồi mới tới tiếng ra đòn — người chơi nghe được trước khi đòn tới.

const SND_STORE = 'mvGD7_audio_v1';
const SND = { master: 0.7, muted: false, music: 0.8 };       // music = âm lượng nhạc nền 0..1 (nhân vào MUS_VOL)              // master 0..1; muted = tắt tiếng hoàn toàn
const SND_MAX_VOICES = 28, SND_HEAR = 15 * TILE;        // số giọng tối đa cùng lúc; xa hơn SND_HEAR px (so với người chơi) thì không nghe
let sndCtx = null, sndMaster = null;
const sndStats = { played: {}, dropped: 0, state: 'none', err: null };
const _sndLast = {}, _sndEnds = [];

(function sndLoad() {
    try {
        const o = JSON.parse(localStorage.getItem(SND_STORE) || 'null');
        if (o && typeof o === 'object') { if (typeof o.master === 'number' && o.master >= 0 && o.master <= 1) SND.master = o.master; if (typeof o.music === 'number' && o.music >= 0 && o.music <= 1) SND.music = o.music; SND.muted = !!o.muted; }
    } catch (e) { }
})();
function sndSave() { try { localStorage.setItem(SND_STORE, JSON.stringify(SND)); } catch (e) { } }

// ---------- khối dựng âm ----------
function sndNoiseBuf(ac) {          // nhiễu trắng 2s, LCG cố định (test lặp lại được)
    if (ac._nb) return ac._nb;
    const n = Math.floor(ac.sampleRate * 2), b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0); let s = 1234567;
    for (let i = 0; i < n; i++) { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; d[i] = s / 2147483648 - 1; }
    ac._nb = b; return b;
}
function sndEnv(ac, out, t, dur, vol, att) {          // bao biên độ: lên nhanh (att) rồi tắt theo hàm mũ
    const g = ac.createGain(); att = Math.min(att || 0.004, dur * 0.5);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(out); return g;
}
// o: f (Hz đầu), f2 (Hz cuối, tuỳ chọn), dur, vol, type, att, lp (cắt trên, tuỳ chọn), vib (độ rung tần số Hz, tuỳ chọn)
function sndTone(ac, out, t, o) {
    const osc = ac.createOscillator(); osc.type = o.type || 'sine';
    // lần 28: âm kéo dài (≥0.3s) không xuống dưới 100Hz — chỉ cú đập ngắn mới được có sub-bass
    if (o.dur >= 0.3) { o = Object.assign({}, o); o.f = Math.max(o.f, 100); if (o.f2) o.f2 = Math.max(o.f2, 100); }
    osc.frequency.setValueAtTime(o.f, t); if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t + o.dur);
    let dst = out;
    if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.connect(out); dst = f; }
    osc.connect(sndEnv(ac, dst, t, o.dur, o.vol, o.att)); osc.start(t); osc.stop(t + o.dur + 0.03);
}
// o: type (bandpass / lowpass / highpass), f, f2, q, dur, vol, att, off (vị trí bắt đầu trong bộ đệm nhiễu)
function sndNoise(ac, out, t, o) {
    const src = ac.createBufferSource(); src.buffer = sndNoiseBuf(ac);
    const flt = ac.createBiquadFilter(); flt.type = o.type || 'bandpass'; flt.Q.value = o.q || 1;
    flt.frequency.setValueAtTime(o.f, t); if (o.f2) flt.frequency.exponentialRampToValueAtTime(Math.max(10, o.f2), t + o.dur);
    src.loop = true; src.connect(flt);
    if (o.dur >= 0.3) { const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 100; flt.connect(hp); hp.connect(sndEnv(ac, out, t, o.dur, o.vol, o.att)); }   // nhiễu dài: bỏ dải dưới 100Hz (ù)
    else flt.connect(sndEnv(ac, out, t, o.dur, o.vol, o.att));
    src.start(t, o.off !== undefined ? o.off : (Math.floor(t * 997) % 15) / 10, o.dur + 0.05);
}

// ---------- danh mục hiệu ứng: tên: [hàm dựng, thời lượng tối đa (s), khoảng cách tối thiểu giữa 2 lần (s), ưu tiên (2 = luôn được phát) ] ----------
const SND_DEFS = {
    // --- người chơi ---
    swing:    [(ac, o, t, p) => { sndNoise(ac, o, t, { f: 600 * p, f2: 2600 * p, q: 0.8, dur: 0.12, vol: 0.4 }); sndTone(ac, o, t, { f: 320 * p, f2: 170 * p, dur: 0.09, vol: 0.06, type: 'triangle' }); }, 0.2, 0.08, 0],
    swingUp:  [(ac, o, t, p) => { sndNoise(ac, o, t, { f: 900 * p, f2: 3600 * p, q: 0.8, dur: 0.12, vol: 0.36 }); sndTone(ac, o, t, { f: 420 * p, f2: 240 * p, dur: 0.09, vol: 0.05, type: 'triangle' }); }, 0.2, 0.08, 0],
    hit:      [(ac, o, t, p) => { sndTone(ac, o, t, { f: 170 * p, f2: 55 * p, dur: 0.13, vol: 0.5 }); sndNoise(ac, o, t, { f: 900, f2: 300, q: 1, dur: 0.06, vol: 0.3 }); sndTone(ac, o, t, { f: 1500 * p, f2: 900 * p, dur: 0.05, vol: 0.08, type: 'square' }); }, 0.2, 0.04, 1],
    hitHeavy: [(ac, o, t, p) => { sndTone(ac, o, t, { f: 120 * p, f2: 35 * p, dur: 0.22, vol: 0.6 }); sndNoise(ac, o, t, { f: 700, f2: 200, q: 1, dur: 0.1, vol: 0.35 }); sndTone(ac, o, t, { f: 880 * p, f2: 660 * p, dur: 0.18, vol: 0.1, type: 'triangle' }); }, 0.3, 0.05, 1],

const SND_NAMES = Object.keys(SND_DEFS);

// ---------- phát ----------
function sndOn() { return !!sndCtx && sndCtx.state === 'running' && !SND.muted && SND.master > 0; }
// Có nên phát tiếng ở toạ độ thế giới x (px)? Trả về {vol, pan} hoặc null nếu quá xa. Không có x => to bình thường, giữa.
function sndSpatial(x) {
    if (x === undefined) return { vol: 1, pan: 0 };
    const p = typeof game !== 'undefined' && game.player;
    const dist = p ? Math.abs(x - p.cx) : 0;
    if (dist >= SND_HEAR) return null;
    const v = 1 - dist / SND_HEAR;
    const camX = typeof cam !== 'undefined' ? cam.x : 0;
    return { vol: 0.5 * v + 0.5 * v * v, pan: clamp((x - camX - VIEW_W / 2) / (VIEW_W / 2), -1, 1) * 0.6 };
}
// o: { x, vol, p (cao độ), delay }. Trả về true nếu đã dựng tiếng.
function sndPlay(name, o) {
    const d = SND_DEFS[name]; if (!d || !sndOn()) return false;
    o = o || {}; const now = sndCtx.currentTime;
    if (now - (_sndLast[name] === undefined ? -9 : _sndLast[name]) < d[2]) { sndStats.dropped++; return false; }
    const sp = sndSpatial(o.x); if (!sp) return false;
    const vol = (o.vol === undefined ? 1 : o.vol) * sp.vol; if (vol < 0.02) return false;
    while (_sndEnds.length && _sndEnds[0] <= now) _sndEnds.shift();
    if (_sndEnds.length >= (d[3] >= 2 ? SND_MAX_VOICES + 10 : SND_MAX_VOICES)) { sndStats.dropped++; return false; }
    _sndLast[name] = now;
    const dly = o.delay || 0; _sndEnds.push(now + dly + d[1] + 0.05); _sndEnds.sort((a, b) => a - b);
    sndStats.played[name] = (sndStats.played[name] || 0) + 1;
    const vg = sndCtx.createGain(); vg.gain.value = vol;
    if (sndCtx.createStereoPanner && sp.pan) { const pn = sndCtx.createStereoPanner(); pn.pan.value = sp.pan; vg.connect(pn); pn.connect(sndMaster); } else vg.connect(sndMaster);
    try { d[0](sndCtx, vg, now + 0.005 + dly, o.p || 1); } catch (e) { sndStats.err = String(e); return false; }
    return true;
}
const sndPitch = () => 0.94 + (game.rngFx ? game.rngFx.next() : 0.5) * 0.12;      // biến thiên cao độ nhẹ cho đỡ lặp

// ---------- khởi tạo (sau cử chỉ người dùng) ----------
function sndApply() { if (sndMaster) sndMaster.gain.setTargetAtTime(SND.muted ? 0 : SND.master, sndCtx.currentTime, 0.03); }
function sndInit() {
    if (sndCtx) { if (sndCtx.state === 'suspended' && !SND.muted) sndCtx.resume(); return; }
    const C = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext); if (!C) { sndStats.state = 'unsupported'; return; }
    try {
        sndCtx = new C();
        const cmp = sndCtx.createDynamicsCompressor(); cmp.threshold.value = -8; cmp.ratio.value = 3; cmp.attack.value = 0.003; cmp.release.value = 0.2;
        sndMaster = sndCtx.createGain(); sndMaster.gain.value = SND.muted ? 0 : SND.master; sndMaster.connect(cmp); cmp.connect(sndCtx.destination);
        if (sndCtx.state === 'suspended') sndCtx.resume();
        sndCtx.onstatechange = () => { sndStats.state = sndCtx.state; }; sndStats.state = sndCtx.state;
    } catch (e) { sndCtx = null; sndStats.state = 'error'; sndStats.err = String(e); }
}
function sndSetMaster(v) { SND.master = clamp(Math.round(v * 10) / 10, 0, 1); sndApply(); sndSave(); }
function sndToggleMute() { SND.muted = !SND.muted; sndApply(); sndSave(); return SND.muted; }
if (typeof window !== 'undefined' && window.addEventListener) {
    const unlock = () => { sndInit(); if (sndCtx && sndCtx.state === 'running') { window.removeEventListener('keydown', unlock); window.removeEventListener('pointerdown', unlock); } };
    window.addEventListener('keydown', unlock); window.addEventListener('pointerdown', unlock);
}

// 04a_music — NHẠC NỀN THEO KHU (GĐ7, lần 15). Tự tổng hợp bằng Web Audio như 04_audio (không file âm thanh); dùng chung sndCtx/sndMaster nên âm lượng + tắt tiếng ở menu Esc áp luôn cho nhạc.
//   Mỗi khu (theo THEMES: cave, forest, deep, ruins, crystal, amethyst) có "bus" riêng: lớp NỀN kéo dài (hợp âm mềm qua bộ lọc, lọc quét chậm) + lớp TIẾNG ĐỘNG theo thang âm của khu
//   (giọt nước, dế, chuông, kèn xa, tiếng hát…) rải ngẫu nhiên theo quy luật (RNG cố định hạt giống → dựng lại được). Đổi khu thì bus cũ tắt dần 2,5s, bus mới sáng dần.
//   Đánh boss (game.boss đang tỉnh) chuyển sang khúc 'boss': nhịp trầm dồn + hợp âm chói + nốt gắt. Hạ boss thì về khúc của khu.
//   Mục đích: tắt hình chỉ nghe cũng đoán được đang ở khu nào (mốc "Xong khi" của GĐ7). Chỉ nghe được khi AudioContext đang chạy (sau lần bấm phím đầu), không tắt tiếng.
//   Lập lịch trước 0,5s mỗi khung hình (musStep gọi từ frameLoop). Trình duyệt tạm dừng AudioContext khi ẩn tab; nếu lịch tụt quá 1s thì đặt lại thay vì dồn tiếng.
//   Số liệu (thang âm, độ to, khoảng cách tiếng) là số tạm do mình đặt, chưa nghe thử bằng tai.

// Gọi mỗi khung hình
function musStep() {
    if (!sndOn()) return;
    const ac = sndCtx, now = ac.currentTime, want = musZoneFor();
    while (MUS.old.length && MUS.old[0].until <= now) MUS.old.shift();
    if (MUS.zone !== want) {
        if (MUS.bus) musFadeOut(MUS.bus);
        MUS.bus = musBuild(want); MUS.zone = want;
    }
    const b = MUS.bus, Z = MUS_ZONES[want];
    Z.ev.forEach((e, i) => {
        if (b.nx[i] < now - 1) b.nx[i] = now + 0.2;                             // lịch tụt quá xa (tab ẩn…): đặt lại, không dồn tiếng
        let guard = 0;
        while (b.nx[i] < now + 0.5 && guard++ < 8) { musEvent(b, e, Math.max(b.nx[i], now + 0.01)); b.nx[i] += e.gap[0] + musRand() * (e.gap[1] - e.gap[0]); }

}

// 06_render — canvas, phóng vừa màn hình, camera (bám sát + nhìn lên/xuống), vẽ ô (bộ nhớ đệm THEO KHỐI 10×8 ô, vẽ lại cục bộ khi đất bị phá), nền, hạt, chữ, HUD
// Hình là hình tạm; nghệ thuật thật ở GĐ8.

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });   // nền luôn phủ kín => không cần kênh alpha (nhẹ hơn khi ghép trang)

const hudCv = document.getElementById('hud'), hudCtx = hudCv && hudCv.getContext ? hudCv.getContext('2d') : null;
const TEXT = { q: [], size: 8.6, font: '"Segoe UI", "Noto Sans", "Helvetica Neue", Roboto, Arial, sans-serif' };

function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const raw = Math.min(window.innerWidth * dpr / VIEW_W, window.innerHeight * dpr / VIEW_H);
    // SETTINGS.fit (mặc định BẬT): phóng vừa khít màn hình (có thể lẻ); TẮT: số nguyên khi đủ chỗ (từng pixel đều nhau, nhưng chừa viền)
    const s = (!SETTINGS.fit && raw >= 1) ? Math.floor(raw) : raw;
    view.scale = s;
    canvas.style.width = (VIEW_W * s / dpr) + 'px';
    canvas.style.height = (VIEW_H * s / dpr) + 'px';
    if (hudCv && hudCtx) { hudCv.width = Math.max(1, Math.round(VIEW_W * s)); hudCv.height = Math.max(1, Math.round(VIEW_H * s)); }
}

// ---- Camera ----
// Bám sát người chơi (SC) với vùng chết nhỏ CAM.deadX/deadY, cộng độ dịch nhìn lên/xuống (player.look). Kẹp trong level.
// cx, cy: tâm "logic"; x, y: góc trên-trái đã làm mượt; px, py: bước trước (nội suy khi vẽ)
const cam = { x: 0, y: 0, px: 0, py: 0, cx: 0, cy: 0, look: 0 };

function camClampCenter(level) {
    cam.cx = level.pw <= VIEW_W ? level.pw / 2 : clamp(cam.cx, VIEW_W / 2, level.pw - VIEW_W / 2);
    cam.cy = level.ph <= VIEW_H ? level.ph / 2 : clamp(cam.cy, VIEW_H / 2, level.ph - VIEW_H / 2);
}
function camSnap(level, t) {
    cam.cx = t.x + t.w / 2; cam.cy = t.y + t.h / 2 + (t.look || 0);
    camClampCenter(level);
    cam.x = cam.px = cam.cx - VIEW_W / 2; cam.y = cam.py = cam.cy - VIEW_H / 2;
}
function camUpdate(level, t, dt) {
    cam.px = cam.x; cam.py = cam.y;
    const fx = t.x + t.w / 2, fy = t.y + t.h / 2 + (t.look || 0);
    if (fx < cam.cx - CAM.deadX) cam.cx = fx + CAM.deadX; else if (fx > cam.cx + CAM.deadX) cam.cx = fx - CAM.deadX;
    if (fy < cam.cy - CAM.deadY) cam.cy = fy + CAM.deadY; else if (fy > cam.cy + CAM.deadY) cam.cy = fy - CAM.deadY;
    camClampCenter(level);
    const k = 1 - Math.exp(-CAM.smooth * dt);
    cam.x = cam.cx - VIEW_W / 2;      // lần 49: ngang bám CỨNG trong vùng chết — trước đây làm mượt ngang gây trễ rồi "trượt" thêm khi người chơi dừng lại
    cam.y += (cam.cy - VIEW_H / 2 - cam.y) * k;
}

// ---- Vẽ ----
// Canvas ẩn dùng lại (cache): bầu trời và toàn bộ ô của phòng vẽ MỘT lần, mỗi khung chỉ chép lại (drawImage)
// thay vì ~2000 lệnh fillRect. Pixel y hệt cách vẽ trực tiếp (xem paintTiles). Kỹ thuật cache chi tiết hơn: Giai đoạn 3.
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

const _skyCache = new Map();
function skyFor(theme) {
    let c = _skyCache.get(theme);
    if (!c) {
        c = makeCanvas(VIEW_W, VIEW_H);
        const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, VIEW_H);
        gr.addColorStop(0, theme.sky[0]); gr.addColorStop(1, theme.sky[1]); g.fillStyle = gr; g.fillRect(0, 0, VIEW_W, VIEW_H);
        _skyCache.set(theme, c);
    }
    return c;
}
// Nền theo theme của phòng: bầu trời (cache) + 3 lớp parallax cuộn chậm hơn camera
function drawBackground(cx, cy, room) {
    const th = (room && room.theme) || THEMES.cave;
    if (th.style === 'mines') { drawBackWall(cx, cy, th); return; }
    ctx.drawImage(skyFor(th), 0, 0);
    for (const L of th.layers) {
        ctx.fillStyle = L.col;
        const off = cx * L.f, i0 = Math.floor(off / L.w), offY = cy * L.f * 0.2;   // cuộn dọc theo camera Y
        for (let i = i0; i <= i0 + Math.ceil(VIEW_W / L.w) + 1; i++) {
            const h = L.amp * (0.35 + 0.65 * hash1(i + L.w)), x = Math.round(i * L.w - off), y = Math.round(L.base - h + 40 - offY);
            if (L.kind !== 'tri' && L.kind !== 'col' && drawBackdropShape(L, x, y, h, i)) continue;      // hình nền xa theo vùng (lần 18, 06b_backdrop)
            if (L.kind === 'tri') {                // núi: tam giác
                ctx.beginPath(); ctx.moveTo(x - L.w * 0.7, VIEW_H); ctx.lineTo(x + L.w / 2, y); ctx.lineTo(x + L.w * 1.7, VIEW_H); ctx.closePath(); ctx.fill();
            } else ctx.fillRect(x, y, L.w - 3, VIEW_H);
        }
    }
}

// ---- Ô ----
// Vẽ các ô cột c0..c1, hàng r0..r1 của level lên g (toạ độ thế giới, lệch −ox,−oy)
function paintTiles(g, level, c0, r0, c1, r1, ox, oy) {
    const th = level.theme;
    c0 = Math.max(0, c0); r0 = Math.max(0, r0); c1 = Math.min(level.w - 1, c1); r1 = Math.min(level.h - 1, r1);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
        const t = level.tiles[r * level.w + c];
        if (t === T_EMPTY) continue;
        const x = c * TILE - ox, y = r * TILE - oy;
        if (th.style === 'mines') { paintMinesTile(g, level, th, t, c, r, x, y); continue; }
        if (t === T_SOLID || t === T_GOLD || t === T_GOLDBIG || t === T_STONE || t === T_ARROW || t === T_PUSH || t === T_CRUSH) {   // (T_LAVA vẽ động ở 13i_lava)
            if (!(level.ground && paintGroundSolid(g, level, th, c, r, x, y, level.ground))) {
                const v = hash1(c * 31 + r * 17);
                g.fillStyle = v < 0.5 ? th.solid[0] : th.solid[1]; g.fillRect(x, y, TILE, TILE);
                g.fillStyle = th.edge; g.fillRect(x, y + TILE - 1, TILE, 1); g.fillRect(x + TILE - 1, y, 1, TILE);
                if (!level.isSolid(c, r - 1)) { g.fillStyle = th.top; g.fillRect(x, y, TILE, 2); }
            }
            if (t === T_GOLD) paintGoldVein(g, x, y, c, r);
            if (t === T_ARROW) paintArrowTrap(g, level, x, y, c, r);
            if (t === T_PUSH) paintMinesPush(g, x, y);
            if (t === T_CRUSH) paintMinesCrush(g, x, y);
        } else if (t === T_SPRING) paintMinesSpring(g, x, y);
        else if (t === T_WEB) paintMinesWeb(g, x, y);
        else if (t === T_CRUMBLE) paintMinesCrumble(g, c, r, x, y);
        else if (t === T_HARD) paintHard(g, level, th, x, y, c, r);
        else if (t === T_ONEWAY) {
            if (!(level.ground && paintGroundPlat(g, level, th, c, r, x, y, level.ground))) {
                g.fillStyle = th.plat[0]; g.fillRect(x, y, TILE, 3);
                g.fillStyle = th.plat[1]; g.fillRect(x, y + 3, TILE, 1); g.fillRect(x + 2, y + 4, 2, 3); g.fillRect(x + TILE - 4, y + 4, 2, 3);
            }
        } else if (t === T_LADDER) paintLadder(g, level, x, y, c, r);
        else if (t === T_SPIKE) paintSpike(g, th, x, y);
    }
}
// ---- Vật liệu kiểu Hầm mỏ Spelunky (theme.style = 'mines'): đất nâu cục, mạch vàng, khối đá, thang sắt, gai, bẫy ----
// Hình tự vẽ bằng fillRect (không dùng ảnh của game gốc). Ô biết hàng xóm: mép lộ ra thì có viền sáng / mép tối / thạch nhũ.
function paintMinesTile(g, level, th, t, c, r, x, y) {
    if (t === T_SOLID || t === T_GOLD || t === T_GOLDBIG || t === T_HARD) {
        paintMinesDirt(g, level, th, c, r, x, y, t === T_HARD);
        if (t === T_GOLD) paintMinesGold(g, c, r, x, y, false);
        else if (t === T_GOLDBIG) paintMinesGold(g, c, r, x, y, true);
    } else if (t === T_STONE) paintMinesBlock(g, c, r, x, y);
    else if (t === T_PUSH) paintMinesPush(g, x, y);
    else if (t === T_CRUSH) paintMinesCrush(g, x, y);
    else if (t === T_SPRING) paintMinesSpring(g, x, y);
    else if (t === T_WEB) paintMinesWeb(g, x, y);
    else if (t === T_CRUMBLE) paintMinesCrumble(g, c, r, x, y);
    else if (t === T_ARROW) { paintMinesBlock(g, c, r, x, y); paintMinesTrapFace(g, level, c, r, x, y); }
    else if (t === T_LADDER) paintMinesLadder(g, level, c, r, x, y);
    else if (t === T_SPIKE) paintMinesSpike(g, c, r, x, y);
    else if (t === T_ONEWAY) {
        g.fillStyle = '#4a2e16'; g.fillRect(x, y, TILE, 5); g.fillStyle = '#a8743e'; g.fillRect(x, y, TILE, 3); g.fillStyle = '#d0965a'; g.fillRect(x, y, TILE, 1);
        g.fillStyle = '#6e4622'; g.fillRect(x + 3, y + 5, 2, 4); g.fillRect(x + 11, y + 5, 2, 4);
    }
}
const _mSolid = (level, c, r) => T_IS_SOLID[level.tile(c, r)];

                const x0 = Math.max(x, bx), x1 = Math.min(x + TILE, bx + 7); if (x1 <= x0) continue;
                _gpx(g, T(bc < 0.34 ? P.body[0] : bc < 0.67 ? P.body[1] : P.body[2]), x0, by, x1 - x0, 7);
                _gpx(g, T(P.light), x0, by, x1 - x0, 1);                                          // mép trên gạch sáng
                _gpx(g, T(P.dark), x0, by + 6, x1 - x0, 1);                                        // mép dưới tối
                if (bx + 7 >= x && bx + 7 < x + TILE) _gpx(g, T(P.mortar), bx + 7, by, 1, 7);      // mạch đứng
                if (tileNoise(Math.floor((gx + off + b * 8) / 8), sr, 8) < 0.09) { _gpx(g, T(P.mortar), x0 + 2, by + 2, 1, 1); _gpx(g, T(P.mortar), x0 + 3, by + 3, 1, 2); }    // vết nứt
            }
        }
        if (N(5) < 0.04 && !up && !dn) { const cx = x + 4, cy = y + 4; _gpx(g, T(P.rune), cx + 3, cy, 2, 1); _gpx(g, T(P.rune), cx + 2, cy + 1, 4, 1); _gpx(g, T(P.rune), cx + 3, cy + 2, 2, 1); g.globalAlpha = 0.25; _gpx(g, T(P.rune), cx + 1, cy - 1, 6, 5); g.globalAlpha = 1; }      // chạm khắc phát sáng
        if (up) { _gpx(g, T(P.edge), x, y, TILE, 1); _gpx(g, T(P.cap), x, y + 1, TILE, 1); _gpx(g, T(P.light), x, y + 2, TILE, 1); _gpx(g, T(P.cap2), x, y + 3, TILE, 2); for (let i = 0; i < TILE; i += 8) _gpx(g, T(P.mortar), x + i + 7, y + 1, 1, 4); }      // gờ phiến đá trên cùng
        if (dn) { _gpx(g, T(P.dark), x, y + TILE - 2, TILE, 2); _gpx(g, T(P.edge), x, y + TILE - 1, TILE, 1); }
    } else {                                       // crystal | geode
        const gem = style === 'crystal' || style === 'snow', snow = style === 'snow';
        if (gem) { for (let j = 0; j < TILE; j++) for (let i = 0; i < TILE; i++) { const d = (gx + i + 2 * (gy + j)) % 19; if (d === 0) _gpx(g, T(P.facet), x + i, y + j); else if (d === 1 && N(3 + (i >> 2)) < 0.5) _gpx(g, T(P.light), x + i, y + j); } }     // pha lê: vân chéo như mặt cắt kính
        else {                                     // geode: thân đá nhám có mạch tím và vệt tối, KHÔNG có vân chéo
            for (let k = 0; k < 5; k++) _gpx(g, T(k % 2 ? P.facet : P.light), x + Math.floor(N(90 + k) * 14), y + 2 + Math.floor(N(95 + k) * 12), N(100 + k) < 0.5 ? 3 : 2, N(105 + k) < 0.3 ? 2 : 1);
            if (N(110) < 0.4) { const ly = y + 4 + Math.floor(N(111) * 8); _gpx(g, T(P.facet), x, ly, 6 + Math.floor(N(112) * 8), 1); _gpx(g, T(P.edge), x + 2, ly + 1, 4 + Math.floor(N(113) * 6), 1); }
        }
        if (N(6) < 0.16 && !up) { const px = x + 3 + Math.floor(N(7) * 9), py = y + 3 + Math.floor(N(8) * 8); _gglow(g, T(P.glow), px, py, 4, 4, 0.2); _gpx(g, T(P.cap2), px, py - 1, 1, 3); _gpx(g, T(P.cap2), px - 1, py, 3, 1); _gpx(g, T(P.gem), px, py, 1, 1); }
        for (let k = 0; k < 2; k++) if (N(10 + k) < 0.25) _gpx(g, T(P.gem), x + Math.floor(N(12 + k) * 15), y + 2 + Math.floor(N(14 + k) * 12), 1, 1);
        if (up) {
            _gpx(g, T(P.edge), x, y, TILE, 1); _gpx(g, T(P.cap), x, y + 1, TILE, 2); _gpx(g, T(P.cap2), x, y + 3, TILE, 1);
            for (let i = 0; i < TILE; i++) if (N(20 + i) < 0.3) _gpx(g, T(P.gem), x + i, y + 1, 1, 1);
            if (!gem && N(50) < 0.5) {                // chùm thạch anh tím mọc từ mặt đất: 3 mũi xoè quạt, cao 4–8px
                const bx = x + 2 + Math.floor(N(53) * 7);
                for (let k = 0; k < 3; k++) { const hh = 4 + ((k * 2 + Math.floor(N(54) * 3)) % 4), px = bx + k * 4 + (k === 1 ? 0 : (k === 0 ? -1 : 1)); for (let j = 0; j < hh; j++) { const w = j === 0 ? 1 : (j < 2 ? 2 : 3); _gpx(g, T(j < 2 ? P.gem : P.cap), px + (w === 3 ? 0 : (w === 2 ? 0 : 1)), y - hh + j + 1, w, 1); } _gpx(g, T(P.cap2), px + 2, y - 2, 1, 2); }
                _gglow(g, T(P.glow), bx + 5, y - 4, 10, 6, 0.14);
            }
            const nShard = gem ? (N(50) < 0.55 ? (N(51) < 0.4 ? 2 : 1) : 0) : 0;                         // tinh thể mọc trên mặt: thấp (≤ 5px) để không che chỗ đứng
            for (let s = 0; s < nShard; s++) { const sx = x + 1 + Math.floor(N(52 + s) * 11), hh = 3 + Math.floor(N(54 + s) * 3); for (let j = 0; j < hh; j++) { const w = j < hh - 2 ? 3 : (j === hh - 2 ? 2 : 1); _gpx(g, T(j % 2 ? P.cap : P.gem), sx + Math.floor((3 - w) / 2), y - hh + j + 1, w, 1); } _gpx(g, T(P.cap2), sx, y, 1, 1); _gglow(g, T(P.glow), sx + 1, y - (hh >> 1), 3, (hh >> 1) + 2, 0.16); }
        }
        if (snow && up) {                             // lớp tuyết dày 4–6px, mép dưới gợn, có bóng xanh nhạt
            for (let i = 0; i < TILE; i++) { const d = 4 + ((N(300 + (i >> 2)) * 3) | 0); _gpx(g, T(P.snow), x + i, y, 1, d); _gpx(g, T(P.snowSh), x + i, y + d, 1, 1); }
            for (let i = 0; i < TILE; i += 5) if (N(320 + i) < 0.5) _gpx(g, T(P.cap2), x + i, y + 1, 2, 1);
        }
        if (snow && !up && N(330) < 0.2) _gpx(g, T(P.snow), x + 2 + Math.floor(N(331) * 10), y + 3 + Math.floor(N(332) * 8), 2, 1);
        if (snow && dn) {                             // nhũ băng dài hơn ở trần
            for (let k = 0; k < 2; k++) if (N(340 + k) < 0.55) { const sx = x + 2 + Math.floor(N(342 + k) * 11), L2 = 3 + Math.floor(N(344 + k) * 5); for (let j = 0; j < L2; j++) _gpx(g, T(j < 2 ? P.cap2 : P.ice), sx + (j > L2 - 3 ? 0 : 0), y + TILE - 1 + j, j < L2 - 2 ? 2 : 1, 1); }
        }
        if (dn) { _gpx(g, T(P.edge), x, y + TILE - 1, TILE, 1); if (N(70) < 0.45) { const sx = x + 2 + Math.floor(N(71) * 10), L = 3 + Math.floor(N(72) * 4); for (let j = 0; j < L; j++) _gpx(g, T(j === 0 ? P.cap2 : P.cap), sx + (j < 2 ? 0 : 1), y + TILE + j - 1, j < 2 ? 3 : 1, 1); } }
        if (!gem && N(80) < 0.26 && !up) { const ax = x + 2 + Math.floor(N(81) * 8), ay = y + 11; for (let k = 0; k < 3; k++) { const hh = 2 + ((k + 1) % 3) + Math.floor(N(82 + k) * 2); _gpx(g, T(k === 1 ? P.gem : P.cap), ax + k * 3, ay - hh, 2, hh); _gpx(g, T(P.cap2), ax + k * 3 + 1, ay - hh, 1, hh); } }      // chùm thạch anh trong hốc đá
    }
    if (lf) { _gpx(g, T(P.edge), x, y, 1, TILE); _gpx(g, T(P.light || P.cap2 || P.dark), x + 1, y + (up ? 3 : 0), 1, TILE - (up ? 3 : 0) - (dn ? 1 : 0)); }
    if (rt) _gpx(g, T(P.edge), x + TILE - 1, y, 1, TILE);
    return true;
}

// ---------- bục một chiều ----------
function paintGroundPlat(g, room, th, c, r, x, y, style) {
    const G = GROUND[style], kind = G && G.plat, P = GROUND_PLAT[kind]; if (!P) return false;
    const N = k => tileNoise(c, r, 200 + k), T = col => _gtint(th, col);
    const isP = cc => room.tile(cc, r) === T_ONEWAY, L = !isP(c - 1), R = !isP(c + 1);       // đầu / cuối dãy bục
    if (kind === 'wood') {                         // ván gỗ + đinh + trụ đỡ ở hai đầu
        _gpx(g, T(P.top), x + (L ? 1 : 0), y, TILE - (L ? 1 : 0) - (R ? 1 : 0), 1);
        _gpx(g, T(P.mid), x, y + 1, TILE, 2); _gpx(g, T(P.low), x, y + 3, TILE, 1);
        const jx = x + 3 + Math.floor(N(1) * 9); _gpx(g, T(P.dark), jx, y + 1, 1, 3);                                    // khe giữa hai tấm ván
        if (N(2) < 0.7) { _gpx(g, T(P.nail), x + 2, y + 1, 1, 1); _gpx(g, T(P.nail), x + TILE - 3, y + 1, 1, 1); }
        _gpx(g, T(P.dark), x + (L ? 1 : 0), y + 4, TILE - (L ? 1 : 0) - (R ? 1 : 0), 1);
        g.globalAlpha = 0.25; _gpx(g, '#000000', x, y + 5, TILE, 2); g.globalAlpha = 1;
        if (L) { _gpx(g, T(P.low), x + 1, y + 4, 2, 6); _gpx(g, T(P.dark), x + 1, y + 4, 1, 6); _gpx(g, T(P.low), x + 3, y + 5, 1, 1); _gpx(g, T(P.low), x + 4, y + 6, 1, 1); }
        if (R) { _gpx(g, T(P.low), x + TILE - 3, y + 4, 2, 6); _gpx(g, T(P.dark), x + TILE - 2, y + 4, 1, 6); _gpx(g, T(P.low), x + TILE - 4, y + 5, 1, 1); _gpx(g, T(P.low), x + TILE - 5, y + 6, 1, 1); }
    } else if (kind === 'log') {                   // thân cây nằm ngang: vỏ có vân, đầu khúc có vòng gỗ, rêu/lá trên mặt
        _gpx(g, T(P.top), x + (L ? 2 : 0), y, TILE - (L ? 2 : 0) - (R ? 2 : 0), 1);
        _gpx(g, T(P.mid), x + (L ? 1 : 0), y + 1, TILE - (L ? 1 : 0) - (R ? 1 : 0), 3); _gpx(g, T(P.low), x + (L ? 2 : 0), y + 4, TILE - (L ? 2 : 0) - (R ? 2 : 0), 1);
        for (let k = 0; k < 3; k++) _gpx(g, T(P.dark), x + Math.floor(N(3 + k) * 14), y + 1 + Math.floor(N(6 + k) * 3), 2 + Math.floor(N(9 + k) * 3), 1);       // vân vỏ
        if (L || R) { const ex = L ? x : x + TILE - 3; _gpx(g, T(P.ring), ex, y + 1, 3, 3); _gpx(g, T(P.low), ex + 1, y + 2, 1, 1); }
        for (let k = 0; k < 2; k++) if (N(12 + k) < 0.5) _gpx(g, T(P.leaf), x + 2 + Math.floor(N(14 + k) * 11), y - 1, 2 + Math.floor(N(16 + k) * 2), 1);                       // rêu / lá
        g.globalAlpha = 0.22; _gpx(g, '#000000', x, y + 5, TILE, 2); g.globalAlpha = 1;
        if (L || R) _gpx(g, T(P.dark), L ? x + 2 : x + TILE - 3, y + 5, 1, 3);                                                                                                     // cành chống ngắn
    } else if (kind === 'slab') {                  // phiến đá chạm, nhô xuống bằng đài ở hai đầu
        _gpx(g, T(P.top), x + (L ? 1 : 0), y, TILE - (L ? 1 : 0) - (R ? 1 : 0), 1);
        _gpx(g, T(P.mid), x, y + 1, TILE, 3); _gpx(g, T(P.low), x, y + 4, TILE, 1); _gpx(g, T(P.dark), x + (L ? 1 : 0), y + 5, TILE - (L ? 1 : 0) - (R ? 1 : 0), 1);
        if (N(1) < 0.6) _gpx(g, T(P.groove), x + 2, y + 2, TILE - 4, 1);
        if (N(2) < 0.25) { _gpx(g, T(P.dark), x + 6 + Math.floor(N(3) * 4), y + 1, 1, 3); }
        g.globalAlpha = 0.25; _gpx(g, '#000000', x, y + 6, TILE, 2); g.globalAlpha = 1;
        if (L) { _gpx(g, T(P.mid), x + 1, y + 5, 3, 2); _gpx(g, T(P.low), x + 1, y + 7, 2, 2); _gpx(g, T(P.dark), x + 1, y + 9, 1, 1); }
        if (R) { _gpx(g, T(P.mid), x + TILE - 4, y + 5, 3, 2); _gpx(g, T(P.low), x + TILE - 3, y + 7, 2, 2); _gpx(g, T(P.dark), x + TILE - 2, y + 9, 1, 1); }
    } else {                                       // crystal | amethyst: phiến tinh thể trong suốt, vệt sáng và quầng sáng phía dưới
        g.globalAlpha = 0.22; _gpx(g, T(P.glow), x, y + 4, TILE, 3); g.globalAlpha = 0.12; _gpx(g, T(P.glow), x, y + 7, TILE, 2); g.globalAlpha = 1;
        _gpx(g, T(P.top), x + (L ? 1 : 0), y, TILE - (L ? 1 : 0) - (R ? 1 : 0), 1);
        _gpx(g, T(P.mid), x, y + 1, TILE, 2); _gpx(g, T(P.low), x, y + 3, TILE, 1);
        _gpx(g, T(P.dark), x + (L ? 1 : 0), y + 4, TILE - (L ? 1 : 0) - (R ? 1 : 0), 1);
        for (let k = 0; k < 2; k++) if (N(1 + k) < 0.55) _gpx(g, T(P.top), x + 2 + Math.floor(N(4 + k) * 11), y + 1, 2, 1);                                                         // vệt sáng
        if (N(8) < 0.35) { const sx = x + 2 + Math.floor(N(9) * 11), L2 = 2 + Math.floor(N(10) * 3); for (let j = 0; j < L2; j++) _gpx(g, T(j ? P.mid : P.top), sx, y + 5 + j, j === L2 - 1 ? 1 : 2, 1); }          // tinh thể nhỏ treo dưới
        if (L || R) _gpx(g, T(P.top), L ? x : x + TILE - 1, y, 1, 1);
        if (kind === 'ice') { for (let i = 0; i < TILE; i++) _gpx(g, '#ffffff', x + i, y - 1, 1, N(30 + (i >> 2)) < 0.5 ? 2 : 1); }      // tuyết đọng trên phiến băng
    }
    return true;
}

// 06b_backdrop — HÌNH NỀN XA THEO VÙNG (lần 18): các lớp parallax của THEMES có thêm `kind` ngoài 'tri' (núi) và 'col' (cột):
//   pine = cây thông · bush = bụi cây · hang = nhũ đá treo từ trần · vine = dây leo rủ · shroom = nấm khổng lồ · ruin = cột đền (có cột gãy) · spire = tháp pha lê · cluster = chùm thạch anh nghiêng.
//   drawBackground (06_render) gọi drawBackdropShape cho kind lạ; trả false thì rơi về 'col' cũ. Mỗi hình chỉ là vài đa giác/hình chữ nhật cùng một màu L.col (bóng đổ xa), vẽ mỗi khung như hai kiểu cũ.
//   Hình dạng/cao thấp lấy theo chỉ số cột i qua hash1 → cố định, không nhấp nháy khi cuộn. Hình mọc từ đáy (y = đỉnh hình, kéo xuống VIEW_H) trừ hang/vine treo từ trần (y = 0).
// Một hoặc nhiều đa giác trong MỘT đường vẽ và MỘT lệnh fill (ít lệnh canvas hơn mỗi khung so với mỗi đa giác một fill)
function _bdPolys(g, polys) { g.beginPath(); for (const pts of polys) { g.moveTo(Math.round(pts[0][0]), Math.round(pts[0][1])); for (let k = 1; k < pts.length; k++) g.lineTo(Math.round(pts[k][0]), Math.round(pts[k][1])); g.closePath(); } g.fill(); }
// g: canvas để vẽ (mặc định ctx của game; test truyền bộ ghi lệnh vào)
function drawBackdropShape(L, x, y, h, i, g) {
    g = g || ctx; const w = L.w, b = VIEW_H, n = k => hash1(i * 7.3 + w * 1.7 + k * 3.1);
    switch (L.kind) {
        case 'pine': {                              // thông 3 tầng trên thân thẳng
            const cx = x + w / 2, th = h * 0.62;
            g.fillRect(Math.round(cx - 1), Math.round(y + h * 0.5), 3, b);
            const tiers = []; for (let t = 0; t < 3; t++) { const ty = y + t * th * 0.3, hw = w * (0.24 + 0.13 * t); tiers.push([[cx, ty], [cx - hw, ty + th * 0.42], [cx + hw, ty + th * 0.42]]); }
            _bdPolys(g, tiers);
            return true;
        }
        case 'bush': {                              // bụi tròn
            g.fillRect(Math.round(x + w * 0.25), Math.round(y), Math.round(w * 0.5), b);
            g.fillRect(Math.round(x + w * 0.1), Math.round(y + h * 0.3), Math.round(w * 0.8), b);
            g.fillRect(Math.round(x), Math.round(y + h * 0.6), Math.round(w), b);
            return true;
        }
        case 'hang': {                              // nhũ đá treo từ trần (hai mũi)
            const len = L.amp * (0.3 + 0.7 * n(1));
            _bdPolys(g, [[[x, 0], [x + w * 0.7, 0], [x + w * 0.35, len]], [[x + w * 0.7, 0], [x + w, 0], [x + w * 0.85, len * 0.5]]]);
            return true;
        }
        case 'vine': {                              // dây leo rủ có lá
            const len = L.amp * (0.4 + 0.9 * n(1)), vx = Math.round(x + w / 2);
            g.fillRect(vx, 0, 1, Math.round(len));
            for (let k = 8; k < len; k += 9) g.fillRect(vx + (k % 2 ? 1 : -3), k, 3, 2);
            g.fillRect(vx - 1, Math.round(len), 3, 3);
            return true;
        }
        case 'shroom': {                            // nấm khổng lồ: thân + mũ tròn
            const sx = x + w * 0.4, sw = w * 0.2;
            g.fillRect(Math.round(sx), Math.round(y + h * 0.3), Math.round(sw), b);
            g.fillRect(Math.round(x), Math.round(y + h * 0.2), Math.round(w), Math.round(h * 0.14));
            g.fillRect(Math.round(x + w * 0.12), Math.round(y + h * 0.1), Math.round(w * 0.76), Math.round(h * 0.12));
            g.fillRect(Math.round(x + w * 0.3), Math.round(y), Math.round(w * 0.4), Math.round(h * 0.12));
            return true;
        }
        case 'ruin': {                              // cột đền có đầu cột; một số gãy ngọn
            const px = x + w * 0.25, pw = w * 0.5, broken = n(2) > 0.6, top = y + (broken ? h * 0.3 : 0);
            g.fillRect(Math.round(px - 3), Math.round(top), Math.round(pw + 6), 4);
            g.fillRect(Math.round(px), Math.round(top + 4), Math.round(pw), b);
            if (broken) { g.fillRect(Math.round(px + pw * 0.55), Math.round(top - 3), Math.round(pw * 0.3), 3); g.fillRect(Math.round(px + pw * 0.75), Math.round(top - 5), 2, 2); }
            return true;
        }
        case 'spire': {                             // tháp pha lê lục giác + một mũi phụ
            _bdPolys(g, [[[x + w * 0.5, y], [x + w * 0.82, y + h * 0.28], [x + w * 0.82, b], [x + w * 0.18, b], [x + w * 0.18, y + h * 0.28]], [[x + w * 0.95, y + h * 0.45], [x + w * 1.15, y + h * 0.62], [x + w * 1.15, b], [x + w * 0.75, b], [x + w * 0.75, y + h * 0.62]]]);
            return true;
        }
        case 'cluster': {                           // ba tinh thể nghiêng xoè quạt
            const cs = []; for (let k = 0; k < 3; k++) { const bx = x + w * (0.2 + 0.3 * k), tipX = bx + (k - 1) * w * 0.22, tipY = y + h * (0.12 + 0.22 * ((k + Math.floor(n(3) * 3)) % 3)); cs.push([[tipX, tipY], [bx + w * 0.14, b], [bx - w * 0.14, b]]); }
            _bdPolys(g, cs);
            return true;
        }
    }
    return false;
}

// 06c_sprites — vẽ CHI TIẾT nửa-pixel (lần 25). Canvas bên trong nay gấp RES=2 lần 320×240 nên mỗi pixel logic = 2×2 điểm; các hàm vẽ nhân vật/quái dùng "hp" = nửa pixel
//   (đơn vị 0.5 px) để có viền tối, đổ bóng, mắt có tròng… Hitbox và vật lý KHÔNG đổi. Tất cả vẽ bằng fillRect (không file ảnh).
//   hpMaker(ctx, cx, bottomY, facing) → q(dx, dy, w, h, màu) với dx tính từ TÂM (hp, dương = phía trước mặt), dy từ ĐÁY (âm = lên trên); lật theo hướng nhìn.
function hpMaker(ctx, cx, by, f) {
    return (dx, dy, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(f > 0 ? cx + dx * 0.5 : cx - (dx + w) * 0.5, by + dy * 0.5, w * 0.5, h * 0.5); };
}
const SPR_OUT = '#1a1220';
// phần có viền: vẽ viền tối rộng hơn 1hp rồi tô màu
function hpPart(q, dx, dy, w, h, c, o) { q(dx - 1, dy - 1, w + 2, h + 2, o || SPR_OUT); q(dx, dy, w, h, c); }

// ----- Người chơi -----

// 07a_level — Level: một khối bản đồ liền (thay Room của dự án cũ; KHÔNG có chuyển phòng).
//   Kích thước = LVL.w × LVL.h ô (42×34: 40×32 bên trong + viền đá cứng 1 ô). Toạ độ px: (0,0) = góc trên-trái viền.

//   Đổi ô qua setTile()/breakAt(): đánh dấu khối vẽ "bẩn" để 06_render vẽ lại CỤC BỘ (roadmap 3.4), không dựng lại cả level.

class Level {

        for (let i = 0; i < n; i++) this.fx.push({
            x: x + R.range(-3, 3), y, vx: R.range(-0.5, 0.5) * spread, vy: -R.next() * (up || 20),

    for (let r = 0; r < RH; r++) for (let c = 0; c < RW; c++) g[rm.ry * RH + r][rm.rx * RW + c] = ALTAR_TPL[r][side === -1 ? c : RW - 1 - c];
    return { rx: rm.rx, ry: rm.ry, side };
}

// ---- Rương lớn (GĐ7g; phòng bên có lối vào, 'm') — chìa khoá 'y' đặt sau khi biết vùng đi tới được ----
const CHEST_TPL = ['##########', '#........#', '#........#', '#........#', '#........#', '.........#', '....m....#', '##########'];
function genChest(R, path, rooms, g, taken, levelIdx) {
    if (levelIdx < 1 || !R.chance(GEN.chestChance)) return null;
    const cand = [];
    for (const rm of rooms) {
        if (rm.type !== 0 || taken.some(t => t && t.rx === rm.rx && t.ry === rm.ry)) continue;
        const ok = t => t === 1 || t === 3;
        if (rm.rx > 0 && ok(path.type[rm.rx - 1][rm.ry])) cand.push({ rm, side: -1 });
        if (rm.rx < LVL.roomsX - 1 && ok(path.type[rm.rx + 1][rm.ry])) cand.push({ rm, side: 1 });
    }
    if (!cand.length) return null;
    const { rm, side } = R.pick(cand), RW = LVL.roomW, RH = LVL.roomH;
    for (let r = 0; r < RH; r++) for (let c = 0; c < RW; c++) g[rm.ry * RH + r][rm.rx * RW + c] = CHEST_TPL[r][side === -1 ? c : RW - 1 - c];
    return { rx: rm.rx, ry: rm.ry, side };
}
// ---- Kho báu kín (GĐ7g; phòng loại 0 kín bằng đất): lõi toàn mạch vàng, hai bẫy tên canh hàng giữa — phải nổ bom mới vào được ----
const TREASURE_TPL = ['##########', '#........#', '#.%$$$$%.#', '#.$%%%%$.#', '>........<', '#.$%%%%$.#', '#.%$$$$%.#', '##########'];
function genTreasure(R, path, rooms, g, taken, levelIdx) {
    if (levelIdx < 1 || !R.chance(GEN.treasureChance)) return null;
    const cand = rooms.filter(rm => rm.type === 0 && !taken.some(t => t && t.rx === rm.rx && t.ry === rm.ry));
    if (!cand.length) return null;
    const rm = R.pick(cand), RW = LVL.roomW, RH = LVL.roomH;
    for (let r = 0; r < RH; r++) for (let c = 0; c < RW; c++) g[rm.ry * RH + r][rm.rx * RW + c] = TREASURE_TPL[r][c];
    return { rx: rm.rx, ry: rm.ry };
}

// ---- Hồ ngầm (lần 20; phòng loại 0 kín bằng đất, gần nửa phòng là nước, đáy có mạch vàng): phải đào / nổ vào; nước tràn ra khi thủng ----
const LAKE_TPL = ['##########', '#........#', '#........#', '#WWWWWWWW#', '#WWWWWWWW#', '#WWWWWWWW#', '#W$%$$%W##', '##########'];
function genLake(R, path, rooms, g, taken, levelIdx) {
    if (levelIdx < 1 || !R.chance(GEN.lakeChance)) return null;
    const cand = rooms.filter(rm => rm.type === 0 && !taken.some(t => t && t.rx === rm.rx && t.ry === rm.ry));
    if (!cand.length) return null;
    const rm = R.pick(cand), RW = LVL.roomW, RH = LVL.roomH;
    for (let r = 0; r < RH; r++) for (let c = 0; c < RW; c++) g[rm.ry * RH + r][rm.rx * RW + c] = LAKE_TPL[r][c];
    return { rx: rm.rx, ry: rm.ry };
}


// ---- Mở lối vào phòng phụ (lần 36) ----
//   Phòng loại 0 thường (không phải cửa hàng / hố rắn / kho báu / hồ…) có xác suất GEN.openChance được khoét một cửa hai ô cao ở tường chung với phòng kề
//   đã nối (phòng đường chính loại 1/3 luôn mở lối trái-phải, hoặc một phòng phụ đã mở trước đó), kèm gian tiền sảnh 4 ô trong đất.
//   Cửa nằm sát sàn (hàng 5–6, sàn hàng 7 là đất liền) => đi bộ vào được, không cần bom. Không đụng phòng đường chính => đường chính y nguyên.
function genOpenRooms(R, path, rooms, g, taken, seenAt) {
    const RW = LVL.roomW, RH = LVL.roomH, key = (x, y) => x + ',' + y, DIRT = '#$%X';
    const conn = new Set(), opened = [];
    const linked = (nb, edge) => conn.has(key(nb.rx, nb.ry)) || seenAt(nb, edge);      // phòng kề có ô đứng ở mép đối diện đi tới được (hoặc vừa được mở)
    const at = (rm, c, r) => g[rm.ry * RH + r][rm.rx * RW + c];
    const has = (rm, chs) => { for (let r = 0; r < RH; r++) for (let c = 0; c < RW; c++) if (chs.indexOf(at(rm, c, r)) >= 0) return true; return false; };
    const canCarve = (rm, edge) => { for (const r of [5, 6]) { const ch = at(rm, edge, r); if (DIRT.indexOf(ch) < 0 && ch !== '.') return false; } return true; };
    const carve = (rm, side, depth) => {              // side = -1: khoét ở mép trái của phòng; +1: mép phải. depth = số cột tiền sảnh
        const edge = side < 0 ? 0 : RW - 1;
        for (let k = 0; k < depth; k++) for (const r of [5, 6]) { const c = edge + (side < 0 ? k : -k); const ch = at(rm, c, r); if (DIRT.indexOf(ch) >= 0) g[rm.ry * RH + r][rm.rx * RW + c] = '.'; }
    };
    const cand = rooms.filter(rm => rm.type === 0 && !taken.some(t => t && t.rx === rm.rx && t.ry === rm.ry) && !has(rm, 'VW'));
    for (let i = cand.length - 1; i > 0; i--) { const j = R.int(0, i); const t = cand[i]; cand[i] = cand[j]; cand[j] = t; }
    const want = new Set(cand.filter(() => R.chance(GEN.openChance)).map(rm => key(rm.rx, rm.ry)));
    for (let pass = 0; pass < 3; pass++) for (const rm of cand) {
        const k = key(rm.rx, rm.ry); if (!want.has(k) || conn.has(k)) continue;
        const sides = [];
        for (const side of [-1, 1]) {
            const nx = rm.rx + side; if (nx < 0 || nx >= LVL.roomsX) continue;
            const nb = rooms.find(x => x.rx === nx && x.ry === rm.ry);
            if (!linked(nb, side < 0 ? RW - 1 : 0)) continue;
            if (!canCarve(rm, side < 0 ? 0 : RW - 1)) continue;
            if (nb.type === 0 && !canCarve(nb, side < 0 ? RW - 1 : 0)) continue;
            sides.push({ side, nb });
        }
        if (!sides.length) continue;
        const { side, nb } = R.pick(sides);
        carve(rm, side, 4);
        if (nb.type === 0) carve(nb, -side, RW);          // phòng phụ đã mở nay thành lối đi xuyên qua: khoét suốt hai hàng
        conn.add(k); opened.push({ rx: rm.rx, ry: rm.ry, side });
    }
    return opened;
}

// ---- 4–5. Ráp level ----
function genLevel(seed, levelIdx) {
    if (BOSS_LEVELS[levelIdx]) { const out = genBossArena(levelIdx); out.meta.rerolls = 0; out.meta.seed = seed; out.meta.levelIdx = levelIdx; return out; }
    let tries = 0;
    for (; tries < GEN.attempts; tries++) {
        const R = rngWorld(seed, levelIdx * 1000 + tries);
        const out = genTry(R, levelIdx, seed);
        if (out) { out.meta.rerolls = tries; out.meta.seed = seed; out.meta.levelIdx = levelIdx; return out; }
    }
    // không bao giờ nên tới đây (fuzz canh): trả phòng thử nghiệm để game không chết
    return { def: TEST_LEVEL, meta: { failed: true, rerolls: tries, seed, levelIdx } };
}
function genTry(R, levelIdx, seedForDark) {
    const path = genPath(R);
    const zone = zoneOf(levelIdx), { g, rooms } = genTiles(R, path, zone);
    const shop = genShop(R, path, rooms, g, levelIdx);
    const pit = genPit(R, path, rooms, g, shop, levelIdx);
    const altar = genAltar(R, path, rooms, g, [shop, pit], levelIdx);
    const chest = genChest(R, path, rooms, g, [shop, pit, altar], levelIdx);
    const treasure = genTreasure(R, path, rooms, g, [shop, pit, altar, chest], levelIdx);
    const lake = genLake(R, path, rooms, g, [shop, pit, altar, chest, treasure], levelIdx);
    const RW = LVL.roomW, RH = LVL.roomH, B = LVL.border, W = g[0].length, H = g.length;
    // lưới có viền để kiểm tra
    const full = []; for (let r = 0; r < H + 2 * B; r++) full.push(new Array(W + 2 * B).fill('H'));
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) full[r + B][c + B] = g[r][c];
    const grid = genGrid(full);
    const standIn = (rx, ry) => {
        const out = [];
        for (let r = ry * RH; r < (ry + 1) * RH; r++) for (let c = rx * RW; c < (rx + 1) * RW; c++) {
            const C = c + B, Rr = r + B;
            const t = grid.T(C, Rr), below = grid.T(C, Rr + 1), above = grid.T(C, Rr - 1);
            if (t === T_EMPTY && T_IS_SOLID[below] && below !== T_ARROW && !T_IS_SOLID[above] && above !== T_LADDER) out.push({ c: C, r: Rr });
        }
        return out;
    };
    // cửa vào
    const sCands = standIn(path.start.x, path.start.y); if (!sCands.length) return null;
    const s = R.pick(sCands);
    let reach = genReach(grid, s.c, s.r);
    // (lần 36) mở lối vào phòng phụ — chỉ khoét phòng loại 0 nên đường chính không đổi; lưới `full` cập nhật tại chỗ => kiểm lại đường đi
    const opened = genOpenRooms(R, path, rooms, g, [shop, pit, altar, chest, treasure, lake], (nb, edge) => !!reach.seen[(nb.ry * RH + 6 + B) * grid.w + nb.rx * RW + edge + B]);
    if (opened.length) {
        for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) full[r + B][c + B] = g[r][c];
        reach = genReach(grid, s.c, s.r);
    }
    // cửa ra: ô đứng được trong phòng ra mà đi tới được, không trùng ô cửa vào
    if (shop) {            // chắc ăn: ô chủ cửa hàng phải đi tới được, nếu không sinh lại
        let ok = false;
        for (let r = shop.ry * RH + B; r < (shop.ry + 1) * RH + B && !ok; r++) for (let c = shop.rx * RW + B; c < (shop.rx + 1) * RW + B; c++) if (full[r][c] === 'D' && reach.seen[r * grid.w + c]) { ok = true; break; }
        if (!ok) return null;
    }
    const eCands = standIn(path.exit.x, path.exit.y).filter(p => reach.seen[p.r * grid.w + p.c] && !(p.c === s.c && p.r === s.r) && Math.abs(p.c - s.c) + Math.abs(p.r - s.r) > 3);
    if (!eCands.length) return null;
    const e = R.pick(eCands);
    full[s.r][s.c] = 'P'; full[e.r][e.c] = 'E'; full[e.r + 1][e.c] = 'H';
    // ---- 5. vật + quái + bẫy (SC vùng Hầm mỏ) ----
    const isEmpty = (c, r) => full[r] && full[r][c] === '.';
    const solidAt = (c, r) => r >= 0 && r < full.length && genSolidCh(full[r][c]);
    const roomOf = (c, r) => ({ x: Math.floor((c - B) / RW), y: Math.floor((r - B) / RH) });
    const nearDoor = (c, r) => Math.abs(c - s.c) + Math.abs(r - s.r) < 3 || Math.abs(c - e.c) + Math.abs(r - e.r) < 2;
    const zk = levelIdx % ZONE_LEN, zr = GEN.zoneRamp[zk], zl2 = GEN.zoneLoot[zk];      // lần 37: nhịp độ khó trong vùng — màn đầu thoáng + nhiều đồ, màn sau dày quái/bẫy hơn
    const counts = { snake: 0, bat: 0, foe: 0, rock: 0, pot: 0, crate: 0, gold: 0, trap: 0, princess: 0, shop: shop ? 1 : 0, pit: pit ? 1 : 0, altar: altar ? 1 : 0, chest: chest ? 1 : 0, treasure: treasure ? 1 : 0 };
    const inShop = (c, r) => { const rm = roomOf(c, r); return !!(shop && rm.x === shop.rx && rm.y === shop.ry) || !!(pit && rm.x === pit.rx && rm.y === pit.ry) || !!(altar && rm.x === altar.rx && rm.y === altar.ry) || !!(chest && rm.x === chest.rx && rm.y === chest.ry) || !!(treasure && rm.x === treasure.rx && rm.y === treasure.ry) || !!(lake && rm.x === lake.rx && rm.y === lake.ry); };      // cửa hàng + hố rắn: không rải thêm vật / quái
    for (let r = B + 1; r < H + B; r++) for (let c = B; c < W + B; c++) {
        if (!solidAt(c, r) || inShop(c, r)) continue;
        const rm = roomOf(c, r), inStart = rm.x === path.start.x && rm.y === path.start.y;
        // kho báu trên mặt đất (SC scrTreasureGen): ô trên trống, không sát cửa
        if (isEmpty(c, r - 1) && !nearDoor(c, r - 1)) {
            if (R.int(1, 100) === 1) { full[r - 1][c] = 'r'; counts.rock++; continue; }
            if (R.int(1, 40) === 1) { full[r - 1][c] = 'o'; counts.pot++; continue; }
            const alcove = solidAt(c, r - 2) && (solidAt(c - 1, r - 1) || solidAt(c + 1, r - 1));
            const tunnel = solidAt(c - 1, r - 1) && solidAt(c + 1, r - 1);
            if (alcove) {
                if (R.int(1, 10) === 1) { full[r - 1][c] = 'c'; counts.crate++; continue; }
                if (R.int(1, 3) === 1) { full[r - 1][c] = 'g'; counts.gold++; continue; }
                if (R.int(1, 6) === 1) { full[r - 1][c] = 'G'; counts.gold++; continue; }
            } else if (tunnel && R.int(1, 4) === 1) { full[r - 1][c] = 'g'; counts.gold++; continue; }
        }
        if (inStart) continue;
        // quái (SC scrEntityGen): dơi treo dưới trần (2 ô dưới trống), rắn trên sàn
        const per = Math.max(2, Math.round(60 / (zone.rate * GEN.monsterMul * zr * (1 + GEN.monsterPerLevel * levelIdx))));     // lần 29: nhiều quái hơn ×1.5, tăng dần theo level
        if (r < H + B - 3 && isEmpty(c, r + 1) && isEmpty(c, r + 2) && R.int(1, per) === 1) { const ch = genWeighted(R, zone.air); full[r + 1][c] = ch; counts[ch === 'B' ? 'bat' : 'foe']++; }
        if (isEmpty(c, r - 1) && !nearDoor(c, r - 1) && R.int(1, per) === 1) { const ch = genWeighted(R, zone.floor); full[r - 1][c] = ch; counts[ch === 'S' ? 'snake' : ch === 'x' ? 'rock' : 'foe']++; }
    }
    // bẫy mũi tên từ khối đá (SC: 1/4; cách cửa vào > 48px; cùng hàng với cửa vào thì phải cách > 144px; phía trước có 2 ô trống)
    for (let r = B; r < H + B; r++) for (let c = B; c < W + B; c++) {
        if (full[r][c] !== 'X') continue;
        const dx = (c - s.c) * TILE, dy = (r - s.r) * TILE, n = Math.hypot(dx, dy);
        if (!R.chance(0.25 * zr) || (r === s.r && n < 144) || n <= 48) continue;
        if (solidAt(c + 1, r) && isEmpty(c - 1, r) && isEmpty(c - 2, r)) { full[r][c] = '<'; counts.trap++; }
        else if (solidAt(c - 1, r) && isEmpty(c + 1, r) && isEmpty(c + 2, r)) { full[r][c] = '>'; counts.trap++; }
    }
    // ---- (lần 36) quái / đồ trên đường đi ----
    //   Quái bị nhốt trong đất (không bao giờ gặp) bỏ bớt; thay vào đó rải thêm quái + vàng/thùng trên sàn ĐI TỚI ĐƯỢC (validator) — cho cảm giác có chuyện xảy ra trên đường.
    {
        const fw = full[0].length, fh = full.length, air = new Uint8Array(fw * fh), st = [];
        for (let i = 0; i < reach.seen.length; i++) if (reach.seen[i]) { air[i] = 1; st.push(i); }
        while (st.length) {
